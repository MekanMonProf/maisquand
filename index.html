<style>
/* Layout : en-tête collant, une grande « à la une » puis une grille d'articles ; vue article dans la même page */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#dde3e8;
  --accent:#0b6e8a; --accent-soft:#e1f0f4; --sun:#e2a02b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#16222a; --ink:#e6edf2; --muted:#93a4b1; --line:#253540;
  --accent:#5cc3df; --accent-soft:#16343f; --sun:#f0b84f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#16222a; --ink:#e6edf2; --muted:#93a4b1; --line:#253540;
  --accent:#5cc3df; --accent-soft:#16343f; --sun:#f0b84f; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo{flex-direction:column;align-items:flex-start;gap:0;line-height:1}
.logo .name{font-size:1.75rem}
.logo em{font-style:normal;color:var(--sun);display:inline-block;transform:rotate(8deg) translateY(-1px);margin-left:1px}
.logo .slogan{font-family:var(--mono);font-weight:500;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.date{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.search{flex:1 1 220px;max-width:320px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav button{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:.9rem}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding-block:28px 48px;display:grid;gap:32px}
.note{font-family:var(--mono);font-size:.75rem;color:var(--muted);background:var(--accent-soft);padding:8px 12px;border-radius:6px}

.une{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;cursor:pointer;text-decoration:none}
.une .img{aspect-ratio:16/10}
.une h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.1;margin:.3em 0;text-wrap:balance}
.une p{color:var(--muted);margin:0;max-width:60ch}
@media (max-width:720px){.une{grid-template-columns:1fr}}

.img{width:100%;max-width:100%;border-radius:10px;position:relative;overflow:hidden}
.img svg,.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.img span{z-index:1;text-shadow:0 1px 3px #0009;position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:.7rem;color:#fff;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.cat{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

h3.sec{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:28px 24px}
.card{display:grid;gap:8px;text-decoration:none;align-content:start}
.card .img{aspect-ratio:3/2}
.card h4{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.25;margin:0;text-wrap:balance}
.card:hover h4,.une:hover h2{color:var(--accent)}
.empty{color:var(--muted)}

article{max-width:68ch;margin:0 auto;display:grid;gap:14px}
article h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.08;margin:0;text-wrap:balance}
article .chapo{font-size:1.15rem;color:var(--muted);margin:0}
article .img{aspect-ratio:16/9}
article .txt p{margin:0 0 1em}
.back{justify-self:start;border:none;background:none;color:var(--accent);cursor:pointer;font-family:var(--display);font-weight:600;padding:0}

/* Rappel du jour : bandeau vert et or, même rendu en clair et en sombre */
.rappel{--rg:#0f4a35;--rg2:#0b3828;--gold:#d8b45a;--cream:#f7f1e1;background:radial-gradient(120% 140% at 100% 0%,#17644a 0%,var(--rg) 45%,var(--rg2) 100%);color:var(--cream);border-radius:14px;padding:28px clamp(18px,4vw,40px);display:grid;grid-template-columns:auto 1fr;gap:20px 36px;text-decoration:none;position:relative;overflow:hidden}
.rappel::after{content:"";position:absolute;inset:8px;border:1px solid #d8b45a55;border-radius:10px;pointer-events:none}
.rappel .when{display:grid;align-content:start;justify-items:center;text-align:center;gap:2px;padding:14px 18px;border:1.5px solid var(--gold);border-radius:60px 60px 10px 10px;min-width:120px}
.rappel .when b{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--gold)}
.rappel .when small{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.rappel .when hr{width:60%;border:0;border-top:1px solid #d8b45a88;margin:6px 0}
.rappel .eyebrow{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.rappel h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.1rem);margin:.15em 0 .5em;line-height:1.1}
.ar{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;direction:rtl;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.6;color:var(--gold)}
.rappel .fr{font-style:italic;margin:0}
.rappel .ref{font-family:var(--mono);font-size:.72rem;opacity:.8}
.rappel .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px;align-items:start}
.rappel .cols>div{min-width:0}
.rappel .more{font-family:var(--display);font-weight:600;color:var(--gold)}
.rappel:hover .more{text-decoration:underline}
@media (max-width:720px){.rappel{grid-template-columns:1fr}.rappel .when{justify-self:start;border-radius:10px;grid-auto-flow:column;align-items:baseline;gap:8px;padding:8px 14px}.rappel .when hr{display:none}.rappel .when b{font-size:1.6rem}.rappel .cols{grid-template-columns:1fr}}
.rp{display:grid;gap:18px}
.rp section{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--surface);display:grid;gap:8px}
.rp section.dark{background:#0f4a35;color:#f7f1e1;border-color:#0f4a35;text-align:center}
.rp h2{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0}
.rp .dark h2{color:#d8b45a}
.rp blockquote{margin:0;font-size:1.2rem;line-height:1.5}
.rp .ar{color:var(--accent)}.rp .dark .ar{color:#d8b45a}
.rp .src{font-family:var(--mono);font-size:.75rem;color:var(--muted)}.rp .dark .src{color:#d8cfb4}
.vid{margin:0;background:#0d1114;border-radius:12px;padding:12px;display:grid;justify-items:center;gap:8px}
.vid video{width:100%;max-width:420px;max-height:78vh;border-radius:8px;background:#000;display:block}
.vid figcaption{font-family:var(--mono);font-size:.72rem;color:#b9c3ca;text-transform:uppercase;letter-spacing:.08em}
.play{position:absolute;z-index:1;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:1rem;padding-left:3px;border:2px solid #fff}
.duo{display:grid;grid-template-columns:1fr 1.25fr;gap:24px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
.panel h3 em{font-style:normal;color:var(--sun)}
.panel .sub{margin:0;color:var(--muted);font-size:.92rem}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.panel .fine{margin:0;font-size:.78rem;color:var(--muted)}
.sel select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--display);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.prieres li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.prieres li b{font-family:var(--mono);font-size:1.05rem}
.prieres li.lev{color:var(--muted);font-size:.9rem}
.prieres li.next{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dates li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.dates li:first-child{border-top:0}
.dates .cd{display:grid;justify-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 0;line-height:1}
.dates .cd b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.dates .cd small{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.dates .dt{display:grid;min-width:0}
.dates .dt span{font-size:.85rem;color:var(--muted)}
.dates .tag{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
@media (max-width:420px){.dates .tag{display:none}.dates li{grid-template-columns:56px 1fr}}
.lnk{font-family:var(--display);font-weight:600;color:var(--accent);text-decoration:none;font-size:.92rem}
.lnk:hover{text-decoration:underline}
nav .mqbtn{border-color:var(--sun)}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.share span{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.share a,.share button{font-family:var(--display);font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:999px;text-decoration:none;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.share .wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.share .fb{background:#2d5fc4;border-color:#2d5fc4;color:#fff}
.cpin{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:0;flex:1 1 200px}
.filtres{display:flex;flex-wrap:wrap;gap:6px}
.filtres button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.85rem}
.filtres button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates li.vide{display:block;color:var(--muted);border:0}
.dates .obs{font-style:normal;font-size:.84rem;line-height:1.45;margin-top:6px;padding:6px 10px;border-left:3px solid var(--sun);background:var(--accent-soft);border-radius:0 6px 6px 0}
.dates .obs b{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500;color:var(--accent)}
.dates li{grid-template-columns:64px 1fr auto}
.dates .act{display:grid;gap:6px;justify-items:end;align-content:center}
.suivre{font-family:var(--display);font-weight:600;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.suivre[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.dates .dt .fiab{font-size:.68rem;color:var(--muted)}
.fiab{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.03em;color:var(--muted);margin-top:3px}
.fiab i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.fiab.haut i{background:#2f9e5b}.fiab.moy i{background:var(--sun)}.fiab.bas i{background:#d9622b}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:8px;border-top:1px solid var(--line)}
.mq-hero{display:grid;gap:6px;padding-block:6px 4px}
.mq-hero h1{font-size:clamp(2rem,5.5vw,3.2rem)}
.mq-hero .by{margin:0;font-family:var(--mono);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mq-intro{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mq-intro section{min-width:0}
.mq-intro h2,.h2{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0 0 6px}
.h2{margin-top:10px}
.mq-intro p{margin:0}
@media (max-width:680px){.mq-intro{grid-template-columns:1fr}}
.etapes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:e;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.etapes li{counter-increment:e;padding:14px 16px;display:grid;gap:4px;align-content:start;border-left:1px solid var(--line);min-width:0}
.etapes li:first-child{border-left:0}
.etapes li b{font-family:var(--display);font-size:1.05rem}
.etapes li b::before{content:counter(e);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sun);color:#1d1a10;font-size:.75rem;margin-right:8px;vertical-align:2px}
.etapes li span{font-size:.88rem;color:var(--muted);line-height:1.45}
@media (max-width:680px){.etapes{grid-template-columns:1fr 1fr}.etapes li:nth-child(3){border-left:0}.etapes li:nth-child(n+3){border-top:1px solid var(--line)}}
.ask{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px;display:grid;gap:10px}
.ask label{font-family:var(--display);font-weight:800;font-size:1.3rem}
.ask input{width:100%;padding:12px 14px;border-radius:10px;border:0;font-size:1.05rem;background:var(--surface);color:var(--ink)}
.exemples{font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center;opacity:.95}
.exemples button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.82rem}
.mes{border-color:var(--sun)}
@media (max-width:480px){.dates li{grid-template-columns:52px 1fr}.dates .act{grid-column:2;justify-items:start;grid-auto-flow:column;justify-content:start}}
/* ===== Rubrique Mais quand ? : lignes cliquables, fiches et actualité des dates ===== */
[hidden]{display:none!important}
.dates li{position:relative}
.rowlink{position:absolute;inset:0;z-index:0;border-radius:8px}
.rowlink:focus-visible{outline:2px solid var(--accent)}
.dates .act{position:relative;z-index:1}
.dates li:hover strong{color:var(--accent)}
.dates .dt strong{font-family:var(--display);font-weight:600;line-height:1.25}
.majs{display:grid;gap:12px}
.majc{display:grid;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none}
.majc h4{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.25;margin:0;text-wrap:balance}
.majc p{margin:0;color:var(--muted);font-size:.92rem}
.majc:hover h4{color:var(--accent)}
.lie{font-family:var(--mono);font-size:.72rem;color:var(--accent)}
.resol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.resol li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.resol .ok{width:24px;height:24px;border-radius:50%;background:#2f9e5b;color:#fff;display:grid;place-items:center;font-size:.8rem}
.resol strong{font-family:var(--display);font-weight:600;font-size:.98rem;line-height:1.3}
.resol p{margin:2px 0 4px;font-size:.92rem}
.srcl{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
a.back{text-decoration:none}
.answer{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.answer .big{display:grid;justify-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;line-height:1;min-width:96px}
.answer .big b{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.answer .big small{font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.answer .when{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:1.15rem}
.answer .when::first-letter{text-transform:uppercase}
.answer .anote{margin:6px 0 0;color:var(--muted);font-size:.92rem}
@media (max-width:560px){.answer{grid-template-columns:auto 1fr}.answer .suivre{grid-column:1/-1;justify-self:start}}
.pobs{margin:0;font-size:.92rem;line-height:1.5;padding:10px 14px;border-left:3px solid var(--sun);background:var(--accent-soft);border-radius:0 8px 8px 0}
.pobs b{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500;color:var(--accent)}
.blk{display:grid;gap:8px}
.blk h2{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0}
.srcs{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.95rem}
.srcs a{color:var(--accent)}
.hist{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px}
.hist li{position:relative;font-size:.95rem}
.hist li::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--sun)}
.hist span{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.attcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--sun);border-radius:12px;text-decoration:none;background:var(--surface)}
.attcard .cd{display:grid;justify-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 0;line-height:1;width:64px}
.attcard .cd b{font-family:var(--display);font-size:1.4rem}
.attcard .cd small{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.attcard strong{display:block;font-family:var(--display);font-weight:600}
.attcard .meta{display:block}
/* ===== Confiance ===== */
.sait{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.sait{grid-template-columns:1fr}}
.sait section{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.sait .oui{border-top:4px solid #2f9e5b}
.sait .non{border-top:4px solid var(--sun)}
.sait h2{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px;color:var(--ink)}
.sait ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.95rem;line-height:1.45}
.sait .oui li::marker{content:"✓  ";color:#2f9e5b}
.sait .non li::marker{content:"?  ";color:var(--sun);font-weight:700}
.regle-lien{margin:0;font-size:.85rem;color:var(--muted)}
.regle-lien a{color:var(--accent)}
.regles7{margin:0;padding-left:22px;display:grid;gap:14px;line-height:1.55}
.regles7 b{font-family:var(--display);font-weight:600}
.regles7 li::marker{font-family:var(--display);font-weight:800;color:var(--sun)}
.corrs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.corrs li{border-left:3px solid var(--sun);padding-left:12px}
.vide-c{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px;margin:0}
footer .foot{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px}
footer .foot a{color:var(--accent);font-family:var(--display);font-weight:600}
/* ===== Vrai ou faux ? ===== */
.stamp{display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:5px 10px;border-radius:6px;border:2px solid currentColor;transform:rotate(-3deg);white-space:nowrap;background:var(--surface)}
.stamp.faux{color:#c8372d}.stamp.vrai{color:#2f9e5b}.stamp.trompeur{color:#d9622b}.stamp.nonverifie{color:var(--muted)}
.stamp.big{font-size:1.3rem;padding:8px 16px;border-width:3px}
.vfband{display:grid;gap:12px;padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid #c8372d}
.vfband .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vfband h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
.vfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.vfgrid{grid-template-columns:1fr}}
.vfc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--bg);min-width:0}
.vfc h4{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.3;text-wrap:balance}
.vfc:hover h4{color:var(--accent)}
.vflist{display:grid;gap:12px}
.vfleg{border:0;padding:0}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.verdict.faux{border-left:6px solid #c8372d}.verdict.vrai{border-left:6px solid #2f9e5b}.verdict.trompeur{border-left:6px solid #d9622b}
.verdict p{margin:0;font-size:1.02rem}
@media (max-width:520px){.verdict{grid-template-columns:1fr}}
.pp{margin:0}
.preuves{margin:0;padding-left:18px;display:grid;gap:6px}
nav .vfbtn{border-color:#c8372d}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.card .img,.une .img{transition:transform .3s}.card:hover .img,.une:hover .img{transform:scale(1.02)}}

 {id:"m-rentree",photo:"images/rentree.jpg",pos:"center 30%",src:["rentree","revue12"],cat:"Éducation",titre:"Rentrée scolaire : plus de 4 millions d'élèves reprennent les cours ce lundi",chapo:"Reportée d'une semaine à cause des inondations, la rentrée a lieu ce lundi 12 octobre sur tout le territoire.",date:"2026-10-12",min:2,c:["#0b4f6e","#3a8fb7"],
  sait:["Les cours devaient commencer le mercredi 7 octobre 2026.","Le mardi 6 octobre, le ministère de l'Éducation nationale les a reportés au lundi 12 octobre, sur l'ensemble du territoire.","Le report est dû aux intempéries : il fallait assurer la sécurité des élèves et nettoyer, désinfecter et remettre en état les établissements touchés.","Plus de 4 millions d'élèves sont concernés par cette rentrée 2026-2027."],
  saitPas:["Le nombre d'écoles sinistrées qui ne sont pas encore prêtes à accueillir les élèves.","Les aménagements prévus pour les établissements concernés par les JOJ Dakar 2026 (à partir du 31 octobre)."],
  texte:["La rentrée des classes 2026-2027 a lieu ce lundi 12 octobre dans tout le Sénégal. Initialement prévue le mercredi 7 octobre, elle avait été reportée par le ministère de l'Éducation nationale dans un communiqué publié le mardi 6 octobre.","Le ministère a invoqué l'évolution de la situation météorologique et les remontées des inspections d'académie. Le délai devait permettre de nettoyer, désinfecter et remettre en état les établissements touchés par les inondations, et d'assurer la sécurité des élèves.","Toutes les académies n'étaient pas touchées avec la même intensité. Le ministère a pourtant choisi une date unique pour tout le pays, afin que les élèves reprennent les cours dans les mêmes conditions partout. Il a aussi appelé à une mobilisation citoyenne pour préparer les écoles.","Le ministère souhaite enfin préserver au maximum le temps d'apprentissage avant les Jeux olympiques de la jeunesse Dakar 2026, qui débutent le 31 octobre et pourraient perturber certains établissements."]},

  texte:["Le Front syndical pour la défense des travailleurs menace de déclencher une grève générale de 72 heures à Dakar Dem Dikk, les mercredi 21, jeudi 22 et vendredi 23 octobre 2026, faute de réponse des autorités à ses revendications. Si elle a lieu, elle pourrait paralyser l'ensemble du réseau de bus.","Les syndicats réclament la transformation des CDD en CDI, la mensualisation des indemnités de logement avec une indemnité pour tous, la revalorisation des pensions de retraite et la révision du Code de la sécurité sociale. Ils demandent aussi une augmentation des salaires, le paiement des primes non versées, dont la prime de rendement 2025, et la signature de l'accord d'établissement, attendue depuis mai.","Ces dates coïncident avec la grève générale de 72 heures à laquelle appelle le Front syndical pour la défense du travail (FSDT), qui regroupe dix centrales syndicales, pour les secteurs public, privé et informel.","Pour les usagers, la question reste ouverte : mais quand saura-t-on si la grève est maintenue ? Nous suivons la date dans la rubrique Mais quand ? et la mettrons à jour dès qu'une décision sera annoncée."]},

  texte:["Le programme Force-N a mis en avant le parcours d'Awa Ndiaye, une élève sénégalaise de 17 ans en Terminale S1, présentée comme admise au Massachusetts Institute of Technology (MIT), l'université américaine de Cambridge, près de Boston, réputée pour les sciences, l'ingénierie et l'intelligence artificielle.","Dans la vidéo, la jeune fille raconte que son parcours scolaire a commencé dans son village, à l'école maternelle et primaire. La publication cite plusieurs distinctions : un premier prix au Concours général en sciences physiques, une médaille d'argent aux Olympiades nationales de mathématiques et une 9ᵉ place internationale au Robotics for Good Youth Challenge, à Genève. Après le baccalauréat, elle prévoit un bachelor en intelligence artificielle.","Nous n'avons pas encore pu confirmer cette admission auprès du MIT, ni ses distinctions auprès des organisateurs. Nous mettrons cet article à jour dès que nous aurons ces confirmations."]},

 {id:"a5",srcTxt:["Conseils de la rédaction"],photo:"images/paiement.jpg",cat:"Tech",titre:"Paiement mobile : cinq conseils pour éviter les arnaques",chapo:"Faux SMS, faux agents, codes demandés par téléphone : les bons réflexes à adopter.",date:"2026-10-03",min:5,c:["#1f5a3a","#4fb37e"],

/* Calcul des heures de prière (méthode Ligue islamique mondiale : Fajr 18°, Icha 17°, Asr chaféite). */
function prayerTimes(date, lat, lng, tz){
  const dr=Math.PI/180, sin=d=>Math.sin(d*dr), cos=d=>Math.cos(d*dr), tan=d=>Math.tan(d*dr),
    asin=x=>Math.asin(x)/dr, acos=x=>Math.acos(x)/dr, atan2=(y,x)=>Math.atan2(y,x)/dr, acot=x=>Math.atan(1/x)/dr,
    fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  let Y=y,M=m; if(M<=2){Y-=1;M+=12}
  const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const JD=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5 - lng/(15*24);
  const sun=jd=>{const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),
    L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;
    return {decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)}};
  const mid=t=>fix(12-sun(JD+t).eqt,24);
  const angleTime=(ang,t,ccw)=>{const dec=sun(JD+t).decl,noon=mid(t),T=acos((-sin(ang)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/15;return noon+(ccw?-T:T)};
  const asr=t=>{const dec=sun(JD+t).decl;return angleTime(-acot(1+tan(Math.abs(lat-dec))),t)};
  const adj=h=>h+tz-lng/15;
  const r={fajr:angleTime(18,5/24,true),lever:angleTime(0.833,6/24,true),dhuhr:mid(12/24)+1/60,asr:asr(13/24),maghrib:angleTime(0.833,18/24),isha:angleTime(17,18/24)};
  for(const k in r){r[k]=adj(r[k])}
  r.maghrib+=1/60;
  return r;
}
const hhmm=h=>{h=((h%24)+24)%24;let H=Math.floor(h),Mn=Math.round((h-H)*60);if(Mn===60){H=(H+1)%24;Mn=0}return String(H).padStart(2,"0")+":"+String(Mn).padStart(2,"0")};

function joursAvant(iso){const a=new Date(iso+"T00:00:00Z"),n=new Date(),b=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());return Math.round((a-b)/864e5)}

let suivis=[]; try{suivis=JSON.parse(localStorage.getItem("mq-suivis3")||"[]")}catch(e){}
const estSuivi=x=>suivis.includes(x.id);
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const MOTS_VIDES=new Set("mais quand quel quelle quels quelles est ce que qui le la les de des du un une a au aux et ou en pour sur date dates jour prochain prochaine il elle on c je l d s ont sort ouvre ouvrent commence a lieu".split(" "));
function correspond(x,q){const mots=norm(q).split(/[^a-z0-9]+/).filter(m=>m.length>1&&!MOTS_VIDES.has(m));if(!mots.length)return true;const h=norm(x.q+" "+x.c+" "+(x.note||"")+" "+(x.obs||""));return mots.some(m=>h.includes(m.replace(/s$/,"")))}
const cdBox=x=>{const j=joursAvant(x.d);return `<div class="cd"><b>${j===0?"Auj.":j}</b><small>${j===0?"":j===1?"jour":"jours"}</small></div>`};
const fiabTag=x=>`<span class="fiab ${x.f}" title="${esc(x.fd)}"><i></i>${FLBL[x.f]} · ${esc(x.fd)}</span>`;
const btnSuivre=x=>`<button type="button" class="suivre" data-k="${x.id}" aria-pressed="${estSuivi(x)}">${estSuivi(x)?"✓ Suivi":"+ Suivre"}</button>`;
function dateRow(x,opts={}){return `<li><a class="rowlink" href="#att-${x.id}" aria-label="${esc(x.q)}"></a>${cdBox(x)}<div class="dt"><strong>${esc(x.q)}</strong><span>${fmt(x.d)}${x.note&&!opts.court?" · "+esc(x.note):""}</span>${fiabTag(x)}</div><div class="act"><span class="tag">${x.c}</span>${opts.court?"":btnSuivre(x)}</div></li>`}

  const l=$("#liste"); if(l) l.innerHTML=liste.length?liste.map(x=>dateRow(x)).join(""):`<li class="vide">Aucune date ne correspond${mqQuestion?` à « ${esc(mqQuestion)} »`:" à ce filtre"}. Essayez un autre mot : Bac, Tabaski, Lions, police…</li>`;
  document.querySelectorAll(".filtres button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filtreDate));
}

 {id:"vf-gendarmerie",verdict:"faux",cat:"Emploi",d:"2026-10-11",att:"gendarmerie",
  claim:"« Le concours de l'ESOGN est ouvert : appelez ce numéro pour vous inscrire »",
  circule:"Des publications annoncent l'ouverture du concours de l'École des sous-officiers de la gendarmerie (ESOGN) et invitent à appeler un numéro de téléphone pour connaître la procédure d'inscription. Ce type d'annonce revient régulièrement.",
  preuves:["Le Haut Commandement de la gendarmerie nationale a démenti ces annonces par un communiqué (octobre 2025), les qualifiant de contenus destinés à tromper les citoyens.","Les concours EOGN et ESOGN ne sont annoncés que par communiqué sur les canaux officiels : le site gendarmerie.sn et la page Facebook officielle de la gendarmerie.","Aucune inscription ne se fait en appelant un numéro trouvé sur les réseaux sociaux."],
  conclusion:"Faux. Une annonce de concours qui renvoie vers un numéro de téléphone inconnu est une tentative d'arnaque.",
  reflexe:"Ne payez jamais pour « réserver » une place à un concours. En cas de doute, la gendarmerie indique les numéros gratuits 123 et 800 00 20 20.",
  src:[{n:"Seneweb : la gendarmerie dément les fausses annonces de recrutement ESOGN",u:"https://www.seneweb.com/en/news/Societe/esogn-2026-la-gendarmerie-nationale-dement-les-fausses-annonces-de-recrutement_n_470240.html"}]},
 {id:"vf-amulettes",verdict:"faux",cat:"Sport",d:"2026-10-11",
  claim:"Des amulettes saisies dans les bagages des Lions aux États-Unis, selon le Washington Post",
  circule:"En juin 2026, une capture d'écran attribuée au Washington Post a circulé sur Facebook : des objets rituels et des amulettes auraient été saisis dans les bagages de l'équipe du Sénégal à son arrivée aux États-Unis pour la Coupe du monde.",
  preuves:["L'article est introuvable sur le site du Washington Post.","L'adresse web visible sur la capture contient un espace, ce qui est impossible pour une vraie adresse.","Le Washington Post a démenti sur X le 11 juin 2026 : il s'agit d'une image retouchée.","La page qui avait lancé la publication l'a supprimée."],
  conclusion:"Faux. L'article attribué au Washington Post a été fabriqué.",
  reflexe:"Une capture d'écran n'est pas une preuve : cherchez l'article sur le site du média cité avant de le partager.",
  src:[{n:"Africa Check : cet article attribué au Washington Post est faux (18 juin 2026)",u:"https://africacheck.org/fr/fact-checks/meta-programme-fact-checks/coupe-du-monde-2026-faux-article-washington-post-equipe-senegal"}]},
];
const vfById=id=>VERIFS.find(v=>v.id===id);
const stamp=v=>`<span class="stamp ${v.verdict}">${VERDICTS[v.verdict]}</span>`;
function vfCard(v){return `<a class="vfc" href="#${v.id}">${stamp(v)}<div><span class="meta">${v.cat} · ${fmt(v.d)}</span><h4>${esc(v.claim)}</h4></div></a>`}
function vfBand(){
  return `<section class="vfband" aria-labelledby="vf-t">
    <div class="ph"><h3 id="vf-t">Vrai ou faux ?</h3><a class="lnk" href="#vrai-faux">Toutes les vérifications →</a></div>
    <p class="sub">Les rumeurs qui circulent sur WhatsApp et les réseaux, vérifiées avec leurs sources.</p>
    <div class="vfgrid">${VERIFS.slice(0,3).map(vfCard).join("")}</div>
  </section>`;
}
function renderVF(){
  $("#app").innerHTML=`<article style="max-width:780px">
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">Vrai ou faux ?</span><h1>Les rumeurs vérifiées</h1>
    <p class="chapo">Une information vous semble douteuse ? Nous la vérifions, nous montrons comment, et nous citons nos sources.</p>
    <div class="legende vfleg">${Object.keys(VERDICTS).map(k=>`<span class="stamp ${k}">${VERDICTS[k]}</span>`).join("")}</div>
    <p class="fine">Faux : contredit par des preuves. Trompeur : en partie vrai, mais présenté de façon à induire en erreur. Non vérifié : impossible à confirmer ou à démentir pour l'instant. Vrai : confirmé par des sources fiables.</p>
    <div class="vflist">${VERIFS.map(vfCard).join("")}</div>
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"}; window.scrollTo(0,0);
}
function renderVFOne(v){
  const x=v.att&&typeof attById==="function"?attById(v.att):null;
  $("#app").innerHTML=`<article>
    <a class="back" href="#vrai-faux">← Vrai ou faux ?</a>
    <span class="cat">Vrai ou faux ? · ${v.cat}</span>
    <h1>${esc(v.claim)}</h1>
    <div class="verdict ${v.verdict}"><span class="stamp ${v.verdict} big">${VERDICTS[v.verdict]}</span><p>${esc(v.conclusion)}</p></div>
    <span class="meta">Vérification publiée le ${fmt(v.d)}</span>
    <section class="blk"><h2>Ce qui circule</h2><p class="pp">${esc(v.circule)}</p></section>
    <section class="blk"><h2>Ce que nous avons vérifié</h2><ul class="preuves">${v.preuves.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
    <p class="pobs"><b>Le bon réflexe :</b> ${esc(v.reflexe)}</p>
    ${x?`<a class="attcard" href="#att-${x.id}">${cdBox(x)}<div><span class="meta">Mais quand ? · date suivie</span><strong>${esc(x.q)}</strong>${fiabTag(x)}</div></a>`:""}
    <section class="blk"><h2>Sources</h2><ul class="srcs">${v.src.map(s=>`<li><a href="${s.u}" target="_blank" rel="noopener">${esc(s.n)}</a></li>`).join("")}</ul></section>
    <p class="regle-lien">Comment nous travaillons : <a href="#regles">nos règles</a> · <a href="#corrections">corrections</a></p>
    ${shareBar({titre:VERDICTS[v.verdict]+" : "+v.claim,id:v.id})}
  </article>`;
  window.scrollTo(0,0);
}

/* Partage */
const lienArticle=a=>"https://maisquand.com/#"+a.id;
function shareBar(a){
  const url=lienArticle(a), txt=a.titre+" — Mais quand ?";
  return `<div class="share"><span>Partager</span>
    <a class="wa" href="https://wa.me/?text=${encodeURIComponent(txt+"\n"+url)}" target="_blank" rel="noopener">WhatsApp</a>
    <a class="fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">Facebook</a>
    <button type="button" class="cp" data-url="${url}">Copier le lien</button></div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest(".cp"); if(!b) return;
  const done=()=>{b.textContent="Lien copié"; setTimeout(()=>b.textContent="Copier le lien",2000)};
  try{navigator.clipboard.writeText(b.dataset.url).then(done,()=>{prompt0(b)})}catch(_){prompt0(b)}});
function prompt0(b){b.outerHTML=`<input class="cpin" readonly value="${b.dataset.url}" onfocus="this.select()">`}

function renderCats(){
  const onDates=location.hash==="#dates"||location.hash.startsWith("#att-");
  const onVF=location.hash==="#vrai-faux"||location.hash.startsWith("#vf-");
  $("#cats").innerHTML = CATS.map(c=>`<button type="button" aria-pressed="${!onDates&&!onVF&&c===cat}" data-c="${c}">${c}</button>`).join("")+`<button type="button" class="vfbtn" aria-pressed="${onVF}" data-r="vrai-faux">Vrai ou faux ?</button>`+`<button type="button" class="mqbtn" aria-pressed="${onDates}" data-r="dates">Mais quand ?</button>`;
}
$("#cats").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.r){ location.hash=b.dataset.r; return; }
  cat=b.dataset.c; location.hash="accueil"; renderCats(); renderHome();
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase(); if(location.hash.length>1 && location.hash!=="#accueil") location.hash="accueil"; renderHome();});

function rappelBand(r){
  return `<a class="rappel" href="#${r.id}">
    <div class="when"><small>${new Date(r.date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long"})}</small><b>${new Date(r.date+"T12:00:00").getDate()}</b><small>${new Date(r.date+"T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</small><hr><small>${r.hijri}</small></div>
    <div style="min-width:0">
      <span class="eyebrow">Le rappel du jour · Spiritualité</span>
      <h2>${esc(r.rap.titre)}</h2>
      <div class="cols">
        <div><div class="ar" lang="ar" style="font-size:clamp(1.3rem,2.6vw,1.7rem)">${r.verset.ar}</div><p class="fr">« ${esc(r.verset.fr)} »</p><span class="ref">${r.verset.ref}</span></div>
        <div><p class="fr">« ${esc(r.hadith.texte)} »</p><span class="ref">${r.hadith.source}</span><p style="margin:14px 0 0"><span class="more">Lire le rappel complet →</span></p></div>
      </div>
    </div>
  </a>`;
}
function renderHome(){
  const list = ARTICLES.filter(a=>(cat==="Toutes"||a.cat===cat) && (!q || (a.titre+" "+a.chapo+" "+(a.rap?a.rap.texte+a.hadith.texte:"")).toLowerCase().includes(q)));
  if(!list.length){ $("#app").innerHTML=`<p class="empty">Aucun article ne correspond à votre recherche.</p>`; return; }
  const rap = list.find(a=>a.rappel);
  const others = list.filter(a=>!a.rappel);
  const [first,...rest0]=others;
  const rest=[...rest0].sort((x,y)=>y.date.localeCompare(x.date));
  $("#app").innerHTML = `
    ${first?`<a class="une" href="#${first.id}">
      ${img(first)}
      <div><span class="cat">À la une · ${first.cat}</span><h2>${esc(first.titre)}</h2><p>${esc(first.chapo)}</p><p style="margin-top:10px">${meta(first)}</p></div>
    </a>`:""}
    ${rap?rappelBand(rap):""}
    ${cat==="Toutes"&&!q?`<div class="duo">${prayerPanel()}${datesPanel()}</div>`:""}
    ${cat==="Toutes"&&!q?vfBand():""}
    ${rest.length?`<h3 class="sec">${cat==="Toutes"?"Dernières actualités":cat}</h3>
    <div class="grid">${rest.map(a=>`<a class="card" href="#${a.id}">${img(a)}<span class="cat">${a.cat}</span><h4>${esc(a.titre)}</h4>${meta(a)}</a>`).join("")}</div>`:""}`;
}

function renderArticle(a){
  if(a.rappel){
    $("#app").innerHTML = `<article>
      <button class="back" type="button" id="back">← Retour aux actualités</button>
      <span class="cat">${a.cat} · Le rappel du jour</span><h1>${esc(a.titre)}</h1><p class="chapo">${esc(a.chapo)}</p>
      <span class="meta">${fmt(a.date)} · ${a.hijri}</span>
      <div class="rp">
        <section><h2>Le hadith</h2><p style="margin:0">Le Messager d'Allah ﷺ a dit :</p><blockquote>« ${esc(a.hadith.texte)} »</blockquote><div class="ar" lang="ar" style="font-size:1.5rem">${a.hadith.ar}</div><span class="src">${a.hadith.source}</span></section>
        <section><h2>Le rappel</h2><strong style="font-size:1.15rem">${esc(a.rap.titre)}</strong><p style="margin:0">${esc(a.rap.texte)}</p></section>
        <section class="dark"><h2>Le verset du jour</h2><div class="ar" lang="ar">${a.verset.ar}</div><blockquote>« ${esc(a.verset.fr)} »</blockquote><span class="src">${a.verset.ref}</span></section>
        <section><h2>À retenir</h2><p style="margin:0;font-size:1.1rem">${esc(a.retenir)}</p></section>
        <section><h2>Douʿâ</h2><div class="ar" lang="ar">${a.doua.ar}</div><blockquote>« ${esc(a.doua.fr)} »</blockquote></section>
      </div>
      ${shareBar(a)}
    </article>`;
    $("#back").onclick=()=>{location.hash="accueil"};
    window.scrollTo(0,0); return;
  }
  $("#app").innerHTML = `<article>
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">${a.cat}</span><h1>${esc(a.titre)}</h1><p class="chapo">${esc(a.chapo)}</p>${meta(a)}
    ${saitBox(a)}
    ${a.video?`<figure class="vid"><video controls playsinline preload="metadata" poster="${a.photo}" src="${a.video}"></video><figcaption>Vidéo · ${fmt(a.date)}</figcaption></figure>`:img(a)}<div class="txt">${a.texte.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    ${a.att&&attById(a.att)?(x=>`<a class="attcard" href="#att-${x.id}">${cdBox(x)}<div><span class="meta">Mais quand ? · date suivie</span><strong>${esc(x.q)}</strong>${fiabTag(x)}</div></a>`)(attById(a.att)):""}
    ${(a.src||a.srcTxt)?`<section class="blk"><h2>Sources</h2><ul class="srcs">${a.src?srcLinks(a.src):""}${(a.srcTxt||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:""}
    <p class="regle-lien">Comment nous travaillons : <a href="#regles">nos règles</a> · <a href="#corrections">corrections</a></p>
    ${shareBar(a)}
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"};
  window.scrollTo(0,0);
}

function route(){
  renderCats();
  if(location.hash==="#dates") return renderDates();
  if(location.hash==="#regles") return renderRegles();
  if(location.hash==="#vrai-faux") return renderVF();
  if(location.hash.startsWith("#vf-")){ const v=vfById(location.hash.slice(1)); if(v) return renderVFOne(v); }
  if(location.hash==="#corrections") return renderCorrections();
  if(location.hash.startsWith("#att-")){ const x=attById(location.hash.slice(5)); if(x) return renderAtt(x); }
  const a = ARTICLES.find(x=>"#"+x.id===location.hash);
  a ? renderArticle(a) : renderHome();
}
window.addEventListener("hashchange",route);
renderCats(); route();
</script>
</body>
</html>
