<style>
/* Layout : en-tête collant, une grande « à la une » puis une grille d'articles ; vue article dans la même page */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#16222a; --ink:#e6edf2; --muted:#93a4b1; --line:#253540;
  --accent:#6fcf94; --accent-soft:#173a28; --sun:#f0b84f; color-scheme:dark }}
:root[data-theme="dark"]{

  --accent:#6fcf94; --accent-soft:#173a28; --sun:#f0b84f; color-scheme:dark }

*{box-sizing:border-box}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo{flex-direction:column;align-items:flex-start;gap:0;line-height:1}

/* Sur ordinateur, pas de glissement au doigt : les rubriques passent à la ligne au lieu de sortir du cadre. */

main{padding-block:28px 48px;display:grid;gap:32px}

.une{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;cursor:pointer;text-decoration:none}

/* Rappel du jour : bandeau vert et or, même rendu en clair et en sombre */
.rappel{--rg:#0f4a35;--rg2:#0b3828;--gold:#d8b45a;--cream:#f7f1e1;background:radial-gradient(120% 140% at 100% 0%,#17644a 0%,var(--rg) 45%,var(--rg2) 100%);color:var(--cream);border-radius:14px;padding:28px clamp(18px,4vw,40px);display:grid;grid-template-columns:auto 1fr;gap:20px 36px;text-decoration:none;position:relative;overflow:hidden}

.rappel .fr{font-style:italic;margin:0}
.rappel .ref{font-family:var(--mono);font-size:.72rem;opacity:.8}
.rappel .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px;align-items:start}
.rappel .cols>div{min-width:0}
.rappel .more{font-family:var(--display);font-weight:600;color:var(--gold)}
.rappel:hover .more{text-decoration:underline}
@media (max-width:720px){.rappel{grid-template-columns:1fr}.rappel .when{justify-self:start;border-radius:10px;grid-auto-flow:column;align-items:baseline;gap:8px;padding:8px 14px}.rappel .when hr{display:none}.rappel .when b{font-size:1.6rem}.rappel .cols{grid-template-columns:1fr}}

/* ===== Rubrique Mais quand ? : lignes cliquables, fiches et actualité des dates ===== */
[hidden]{display:none!important}
.dates li{position:relative}
.rowlink{position:absolute;inset:0;z-index:0;border-radius:8px}
.rowlink:focus-visible{outline:2px solid var(--accent)}
.dates .act{position:relative;z-index:1}
.dates li:hover strong{color:var(--accent)}
.dates .dt strong{font-family:var(--display);font-weight:600;line-height:1.25}
.majs{display:grid;gap:12px}
.majc{display:grid;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none}
.majc h4{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.25;margin:0;text-wrap:balance}
.majc p{margin:0;color:var(--muted);font-size:.92rem}
.majc:hover h4{color:var(--accent)}

.resol{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.resol .ok{width:24px;height:24px;border-radius:50%;background:#2f9e5b;color:#fff;display:grid;place-items:center;font-size:.8rem}

.answer{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.answer .big{display:grid;justify-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;line-height:1;min-width:96px}
.answer .big b{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}

.answer .when{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:1.15rem}

<script>
const ARTICLES = [
 {"id":"joj-dakar-2026-comment-circuler","cat":"Société","titre":"JOJ Dakar 2026 : comment circuler à Dakar, Diamniadio et Saly pendant les Jeux","chapo":"Du 31 octobre au 13 novembre, les Jeux olympiques de la jeunesse modifient la circulation à Dakar, Diamniadio et Saly : voies réservées, Corniche fermée certains jours, restrictions pour les poids lourds. Les autorités demandent d'anticiper ses déplacements et de privilégier le TER, le BRT et les navettes. Voici ce qu'il faut savoir.","date":"2026-10-29","min":3,"c":["#0f4a35","#2f9e5b"],"texte":["Un plan de circulation de 166 mesures, préparé par le ministère des Transports, le Comité de mobilité Dakar 2026 et le CETUD, s'applique pendant les Jeux. Une partie est en place depuis le 17 octobre. Selon le guide officiel de mobilité, le dispositif complet entre en vigueur le 30 octobre, fonctionne à plein du 1er au 12 novembre, et les mesures temporaires seront retirées le 14 novembre, au lendemain de la clôture des Jeux.","À Dakar, la Corniche Ouest sera fermée les 7, 8 et 10 novembre, de 6 h à 16 h, pour les épreuves sur route. Selon la presse, les déviations passent par l'avenue Cheikh Anta Diop, la rue Aimé Césaire et Fann Résidence. Les autres jours, certains tronçons de la Corniche sont réservés aux épreuves et aux bus des Jeux. Autour de la Tour de l'Œuf et de la piscine olympique, les abords sont piétonnisés, sauf pour les véhicules accrédités. Des sens uniques et des restrictions sont aussi prévus autour du stade Iba-Mar-Diop.","Sur la route de Diamniadio, une voie de l'autoroute est réservée aux délégations, aux officiels et aux secours, et la voie de droite de l'axe des Sphères ministérielles aux navettes officielles et aux véhicules accrédités. Le jour de la cérémonie d'ouverture, samedi 31 octobre, la sortie n° 11, qui dessert le stade Abdoulaye-Wade, est réservée aux véhicules accrédités de 7 h à 23 h 30 : pour rejoindre les sites, il faut emprunter les sorties n° 10 et n° 12.","À Saly, la route Ngaparou–Saly sera fermée pendant les épreuves de triathlon (jeudi 5 et vendredi 6 novembre) et de cyclisme (dimanche 8 et mardi 10 novembre), avec une déviation limitée à 30 km/h. Pendant toute la durée des Jeux, les camions et les charrettes sont interdits aux entrées du secteur, les motos et tricycles interdits sur les routes accréditées, et des parkings-relais sont prévus à Saly Tapé, Bougainvillées et Karting. Des navettes relient Saly à Grand Médine (toutes les 45 minutes) et au stade de Mbour (toutes les 15 minutes).","Les poids lourds sont soumis à des restrictions en journée. Les horaires annoncés varient selon les sources : de 7 h à 19 h selon certaines, et jusqu'à 23 h 30 sur l'autoroute à péage le jour de l'ouverture pour les camions de plus de 3,5 tonnes.","Pour se déplacer, les autorités recommandent les transports en commun. Pour Diamniadio, le TER est la solution principale, avec un train toutes les 8 minutes depuis Dakar annoncé. Des navettes relient ensuite la gare aux sites, et un itinéraire piéton sécurisé de 30 à 40 minutes mène au stade Abdoulaye-Wade. À Dakar, le BRT dessert le stade Iba-Mar-Diop par les stations Grande Mosquée et Papa Gueye Fall. Des navettes dédiées circulent de 6 h 30 à 22 h depuis huit points de départ, dont le Monument de la Renaissance, la gare routière de Rufisque et le stade de Mbour.","Un centre de pilotage installé à Grand Médine surveille la circulation en temps réel. Les autorités annoncent aussi une application, « CETUD Mobilités », pour suivre les horaires du TER, du BRT, des bus et des navettes, et les perturbations."],"conseils":[["Partez plus tôt","Que d'habitude, surtout vers Diamniadio les jours d'épreuves."],["Prenez le TER ou le BRT","Plutôt que la voiture pour rejoindre les sites."],["Ne vous engagez pas sur les voies réservées","Elles sont signalées et contrôlées."],["Le 31 octobre, évitez la sortie n° 11 de l'autoroute","Prenez la sortie n° 10 ou n° 12."],["Les 7, 8 et 10 novembre, contournez la Corniche Ouest","Entre 6 h et 16 h, par l'avenue Cheikh Anta Diop ou Fann Résidence."]],"sait":["Le plan de circulation compte 166 mesures ; selon le guide officiel, les mesures temporaires seront retirées le 14 novembre.","La Corniche Ouest est fermée les 7, 8 et 10 novembre, de 6 h à 16 h.","Une voie de l'autoroute et une voie de l'axe des Sphères ministérielles sont réservées aux véhicules des Jeux.","À Saly, la route Ngaparou–Saly est fermée pendant le triathlon (5 et 6 novembre) et le cyclisme (8 et 10 novembre)."],"saitPas":["Les horaires exacts de restriction des poids lourds : les sources ne concordent pas (19 h ou 23 h 30).","Si les navettes dédiées sont gratuites pour le public : aucune source ne le précise.","Si l'application « CETUD Mobilités » est déjà disponible."],"att":"corniche-joj","srcTxt":["Visuel : Mais quand ?"],"src":[{"n":"Ministère des Transports (Vie publique) : guide « Se déplacer pendant les JOJ Dakar 2026 »","u":"https://www.vie-publique.sn/docs/7ec17f81-341f-48d4-a0b1-c18ea09c3603/guide-mobilite-dakar-joj-2026.pdf"},{"n":"Le Soleil : un plan de circulation déployé à partir du 17 octobre","u":"https://lesoleil.sn/actualites/sports/joj-dakar-2026-un-plan-de-circulation-deploye-a-partir-du-17-octobre/"},{"n":"Le Quotidien : 166 mesures mises sur la route","u":"https://lequotidien.sn/plan-de-circulation-lors-des-joj-166-mesures-mises-sur-la-route/"},{"n":"Agence Ecofin : circulation, transports, navettes, ce qui change à partir du 29 octobre","u":"https://www.agenceecofin.com/actualites-services/2710-142798-dakar-2026-circulation-transports-navettes-ce-qui-change-a-partir-du-29-octobre"},{"n":"Seneweb : ces voies qu'il ne faut surtout pas emprunter","u":"https://www.seneweb.com/fr/news/Transport/circulation-et-joj-dakar-2026-ces-voies-quil-ne-faut-surtout-pas-emprunter_n_999002085.html"},{"n":"Ndarinfo : voies prioritaires, autoroute réservée et restrictions pour les poids lourds","u":"https://www.ndarinfo.com/Circulation-pendant-les-JOJ-voies-prioritaires-autoroute-reservee-et-restrictions-pour-les-poids-lourds_a46859.html"},{"n":"Le Petit Journal : d'importants changements de circulation","u":"https://lepetitjournal.com/dakar/joj-dakar-2026-la-capitale-se-prepare-dimportants-changements-de-circulation-456308"},{"n":"Au Sénégal : comment se déplacer pendant les Jeux","u":"https://au-senegal.com/joj-dakar-2026-comment-se-deplacer-pendant-les-jeux,18563.html?lang=fr"}],"photo":"images/articles/joj-circulation-5-reflexes.jpg","pos":"center","cta":{"t":"Télécharger le plan de circulation officiel (PDF)","u":"https://www.vie-publique.sn/docs/7ec17f81-341f-48d4-a0b1-c18ea09c3603/guide-mobilite-dakar-joj-2026.pdf"},"plans":[{"u":"images/articles/plan-joj-diamniadio-ouverture.jpg","t":"Cérémonie d'ouverture, samedi 31 octobre, stade Abdoulaye-Wade (Diamniadio) : circulation des véhicules et itinéraires piétons. Le grand public sort à la sortie n° 12 de l'autoroute ; la sortie n° 11 est réservée aux personnes accréditées ; 50 000 personnes sont attendues. Source : CETUD, guide officiel de mobilité des JOJ."},{"u":"images/articles/plan-joj-corniche-ouest.jpg","t":"Corniche Ouest (Ouakam, Mamelles, Fann), du 31 octobre au 13 novembre : la Corniche est fermée dans les deux sens les 7, 8 et 10 novembre, de 6 h à 16 h, avec déviations par l'avenue Cheikh Anta Diop, la rue Aimé Césaire et Fann Résidence. Source : CETUD, guide officiel de mobilité des JOJ."},{"u":"images/articles/plan-joj-iba-mar-diop.jpg","t":"Complexe Iba-Mar-Diop (Médina), du 31 octobre au 13 novembre : la rue 11 est réservée aux JOJ, les camions de plus de 3,5 tonnes et les deux-roues sont interdits aux abords, et le stationnement est interdit rues 13, 15 et 25. En BRT, descendez à Grande Mosquée ou Papa Gueye Fall. Source : CETUD, guide officiel de mobilité des JOJ."},{"u":"images/articles/plan-joj-tour-de-l-oeuf.jpg","t":"Plan de circulation autour du complexe Tour de l'Œuf – Piscine olympique (Point E), du 31 octobre au 13 novembre. En BRT, descendez à la station Dial Diop. Source : CETUD, guide officiel de mobilité des JOJ."},{"u":"images/articles/plan-joj-saly.jpg","t":"Saly et Ngaparou, du 31 octobre au 13 novembre : route Ngaparou–Saly fermée pendant le triathlon (5 et 6 novembre) et le cyclisme (8 et 10 novembre), déviation limitée à 30 km/h ; parkings-relais à Saly Tapé, Bougainvillées et Karting. Source : CETUD, guide officiel de mobilité des JOJ."},{"u":"images/articles/plan-joj-calendrier.jpg","t":"Le calendrier du dispositif : entrée en vigueur le 30 octobre, dispositif maximal du 1er au 12 novembre, clôture des Jeux le 13 novembre, retrait des mesures le 14 novembre. Source : CETUD, guide officiel de mobilité des JOJ."}],"maj":"2026-10-29"},
 {"id":"grand-dakar-des-eaux-usees-jusque-dans-les-maisons","cat":"Près de chez vous","titre":"Grand-Dakar : des eaux usées jusque dans les maisons, le maire interpelle l'ONAS","chapo":"À Grand-Dakar, les eaux usées remontent des canalisations et envahissent des habitations depuis les pluies de début octobre. Le maire, Jean-Baptiste Diouf, parle d'une situation « désastreuse » et réclame le retour de l'ONAS. L'office, lui, met en cause un réseau très ancien et des regards ouverts par des riverains.","date":"2026-10-30","min":2,"c":["#7a4a12","#e2a02b"],"texte":["Dans plusieurs quartiers de Grand-Dakar, des eaux usées refluent des canalisations et se répandent dans les rues, jusque dans les chambres de certaines maisons. Le 24 octobre, le maire de la commune, Jean-Baptiste Diouf, a dénoncé une situation « désastreuse » et alerté sur les risques pour la santé des habitants.","Il demande une intervention rapide de l'Office national de l'assainissement du Sénégal (ONAS). Selon lui, l'office est déjà intervenu, mais « le problème, c'est qu'ils ne sont plus revenus ». Le maire estime aussi que les projets d'aménagement de la commune restent bloqués tant que l'assainissement n'est pas réglé.","L'ONAS, de son côté, explique ces débordements par plusieurs causes : les fortes pluies du 4 octobre, des regards ouverts par des riverains pour évacuer l'eau de pluie, et l'âge du réseau, dont certaines conduites ont près de 70 ans. L'office dit avoir déjà débouché plusieurs canalisations dans l'agglomération dakaroise, notamment aux Maristes, à Grand Yoff, à Pikine et à Rufisque. Il appelle les collectivités à travailler ensemble plutôt qu'à chercher un seul responsable.","À l'échelle de Dakar, l'ONAS dit avoir porté la capacité de pompage de la Zone de captage de 6 000 à 9 000 m³ par heure, après la submersion de son bassin lors des pluies des 5 et 6 octobre."],"conseils":[["N'ouvrez pas les regards d'égout","Pour évacuer l'eau de pluie : c'est l'une des causes des refoulements, selon l'ONAS."],["Tenez les enfants à l'écart","Des eaux usées, et ne les laissez pas jouer dedans."],["Lavez-vous les mains","Au savon après tout contact, et nettoyez les sols touchés à l'eau de Javel."],["Signalez les débordements","À la mairie de votre commune, qui peut relayer auprès de l'ONAS."]],"sait":["Des eaux usées envahissent des habitations à Grand-Dakar, selon le maire, qui a lancé l'alerte le 24 octobre.","L'ONAS attribue les refoulements aux pluies du début octobre, aux regards ouverts et à la vétusté du réseau."],"saitPas":["Les quartiers précis et le nombre de familles touchés.","Quand l'ONAS interviendra de nouveau à Grand-Dakar : aucun calendrier n'a été annoncé."],"src":[{"n":"Seneweb : Grand-Dakar sous les eaux usées, le maire crie à l'urgence sanitaire","u":"https://www.seneweb.com/fr/news/Video/grand-dakar-sous-les-eaux-usees-le-maire-crie-a-lurgence-sanitaire_n_999001623.html"},{"n":"Senegal7 : reflux d'eaux usées, l'ONAS explique les contraintes d'intervention","u":"https://senegal7.com/reflux-deaux-usees-a-dakar-lonas-explique-les-contraintes-dintervention-et-appelle-a-une-synergie-des-acteurs-territoriaux/"},{"n":"Senego : l'ONAS relie des bouchons du réseau aux regards ouverts par des riverains","u":"https://senego.com/a-dakar-lonas-relie-des-bouchons-du-reseau-aux-regards-ouverts-par-des-riverains_2017239.html"},{"n":"PressAfrik : l'ONAS porte la capacité de pompage de 6 000 à 9 000 m³ à la Zone de captage","u":"https://www.pressafrik.com/Inondations-a-Dakar-l-ONAS-porte-la-capacite-de-pompage-de-6000-a-9000-m%C2%B3-a-la-Zone-de-captage_a313179.html"}],"maj":"2026-10-30","photo":"images/articles/grand-dakar-des-eaux-usees-jusque-dans-les-maisons-mvv8ecty.jpg"},
 {"id":"fann-point-e-amitie-426-eleves-du-lycee-fadilou-mbacke-aux-joj","cat":"Près de chez vous","titre":"Fann-Point E-Amitié : 426 élèves du lycée Fadilou Mbacké invités aux JOJ","chapo":"Futsal, rugby à sept, Baseball5 et fan zone : du 2 au 9 novembre, les élèves du lycée Cheikh Mouhamadou Fadilou Mbacké assisteront à des épreuves des Jeux olympiques de la jeunesse. Ils seront 426, encadrés par 30 accompagnateurs, selon la convocation du comité d'organisation.","date":"2026-10-30","min":2,"c":["#7a4a12","#e2a02b"],"texte":["Le lycée Cheikh Mouhamadou Fadilou Mbacké, dans la commune de Fann-Point E-Amitié, fait partie des établissements invités à assister à des épreuves des JOJ Dakar 2026. Selon la convocation adressée par le comité d'organisation (COJOJ) et datée du 22 octobre, 426 élèves et 30 accompagnateurs se rendront sur trois sites, lors de quatre sorties, entre le lundi 2 et le lundi 9 novembre. Au total, 456 billets ont été attribués à l'établissement.","Le programme commence le lundi 2 novembre au complexe Iba-Mar-Diop, avec une session de futsal de 15 h 30 à 19 h 30. Le mardi 3 novembre, 234 élèves se rendront à Iba-Mar-Diop pour le rugby à sept, de 13 h 05 à 17 h 50. Le même après-midi, un groupe de 29 élèves assistera au Baseball5 au complexe Tour de l'Œuf, de 15 h à 18 h 05. Enfin, le lundi 9 novembre, 70 élèves passeront la journée à la fan zone des Jeux, de 9 h à 18 h 15.","Pour chaque sortie, le groupe doit se présenter à l'entrée du site une heure avant le début de la session. L'encadrement prévu est d'un accompagnateur pour seize billets. Le censeur du lycée, Moustapha Sène, est le référent du groupe auprès de l'équipe Mobilisation du COJOJ pendant toute la durée des Jeux. Des bus seront mis à la disposition des élèves pour se rendre sur les sites.","Le lycée avait déjà fait parler de lui en octobre, quand ses élèves et ses enseignants avaient participé au nettoyage de l'établissement après les pluies."],"conseils":[["Lundi 2 novembre, futsal","Complexe Iba-Mar-Diop, de 15 h 30 à 19 h 30 (arrivée à 14 h 30) ; 93 élèves et 7 accompagnateurs."],["Mardi 3 novembre, rugby à sept","Complexe Iba-Mar-Diop, de 13 h 05 à 17 h 50 (arrivée à 12 h 05) ; 234 élèves et 16 accompagnateurs."],["Mardi 3 novembre, Baseball5","Complexe Tour de l'Œuf, de 15 h à 18 h 05 (arrivée à 14 h) ; 29 élèves et 2 accompagnateurs."],["Lundi 9 novembre, fan zone","Animations de 9 h à 18 h 15 (arrivée à 8 h) ; 70 élèves et 5 accompagnateurs."]],"sait":["426 élèves et 30 accompagnateurs du lycée assisteront à des épreuves des JOJ, du 2 au 9 novembre.","Les sorties ont lieu au complexe Iba-Mar-Diop, au complexe Tour de l'Œuf et à la fan zone.","Les élèves seront transportés par des bus mis à leur disposition."],"saitPas":["Comment les élèves ont été choisis pour chaque sortie."],"srcTxt":["Convocation de groupe du COJOJ Dakar 2026 (réf. LYDA048, éditée le 22 octobre 2026), transmise à la rédaction.","Informations transmises à la rédaction (transport).","Photo : archives, lycée Cheikh Mouhamadou Fadilou Mbacké."],"src":[{"n":"Mais quand ? : Fann-Point E-Amitié, après les pluies, le lycée Fadilou Mbacké et les écoles de la commune font le ménage","u":"https://maisquand.com/a/fann-point-e-amitie-apres-les-pluies-le/"},{"n":"Mais quand ? : JOJ Dakar 2026, comment circuler (plans d'Iba-Mar-Diop et de la Tour de l'Œuf)","u":"https://maisquand.com/a/joj-dakar-2026-comment-circuler/"}],"photo":"images/articles/lycee-fadilou-mbacke-nettoyage.jpg","pos":"center 50%"},
 {"id":"vendredi-veille-des-joj-le-croyant-fort","cat":"Spiritualité","titre":"Vendredi, veille des JOJ : « Le croyant fort est meilleur et plus aimé d'Allah »","chapo":"Demain, Dakar ouvre les Jeux olympiques de la jeunesse. En ce vendredi, un hadith rappelle que la force, du corps comme de la foi, est un bien quand elle est mise au service de ce qui est utile.","date":"2026-10-30","min":2,"c":["#0f5b45","#d9b45a"],"texte":["Le Prophète ﷺ a dit : « Le croyant fort est meilleur et plus aimé d'Allah que le croyant faible, et en chacun il y a du bien. Recherche avec ardeur ce qui t'est utile, demande l'aide d'Allah et ne te décourage pas. » (Rapporté par Muslim, d'après Abû Hurayra.)","Les savants expliquent que cette force est d'abord celle de la foi, de la volonté et de la persévérance dans le bien. Elle n'exclut pas la force du corps, que l'on entretient pour mieux servir sa famille et sa communauté.","À la veille de ces Jeux, où des jeunes du monde entier viennent montrer ce que l'effort et la discipline permettent, ce hadith invite chacun à chercher ce qui est utile, à s'appuyer sur Allah et à ne pas baisser les bras.","Et comme chaque vendredi : le grand bain, le parfum, la prière en assemblée, de nombreuses prières sur le Prophète ﷺ et la lecture de la sourate al-Kahf. « Celui qui lit la sourate al-Kahf le vendredi, une lumière l'éclairera d'un vendredi à l'autre. » (Al-Hâkim et al-Bayhaqî, authentifié par al-Albânî.)"],"rappelEncadre":{"texte":"« Le croyant fort est meilleur et plus aimé d'Allah que le croyant faible, et en chacun il y a du bien. »","ref":"Sahîh Muslim, n° 2664","degre":"Hadith authentique (sahîh)","sens":"Chercher ce qui est utile, compter sur Allah et ne jamais se décourager."},"srcTxt":["Sahîh Muslim, n° 2664 (le croyant fort)","Al-Hâkim et al-Bayhaqî, authentifié par al-Albânî dans Sahîh al-Jâmi' (sourate al-Kahf)"],"src":[{"n":"Mais quand ? : Vendredi, sept recommandations du Prophète ﷺ pour bien vivre le jour de la Jumu'a","u":"https://maisquand.com/a/vendredi-sept-recommandations-du-prophete-pour-bien/"}],"rappelDu":"2026-10-30"},
 {"id":"bourse-mairie-de-dakar-comment-ca-marche","cat":"Éducation","titre":"« Bourse Mairie de Dakar » : comment ça marche, et comment vérifier qu'une école y donne droit","chapo":"En cette période de rentrée, les affiches promettant une « Bourse Mairie de Dakar » se multiplient sur WhatsApp et les réseaux sociaux, souvent publiées par des écoles privées. Les bourses de la Ville existent bel et bien, mais elles obéissent à des règles précises. Voici comment s'y retrouver.","date":"2026-10-29","min":3,"c":["#1d4e6b","#5aa2c8"],"texte":["La Ville de Dakar aide chaque année des jeunes à financer leurs études. Ce dispositif est géré par sa Direction de l'Éducation et de l'Aide à l'Insertion (DEI), installée au building communal, à la Médina. Il prend deux formes principales : la prise en charge d'études dans des établissements au Sénégal, et une allocation pour les étudiants inscrits à l'étranger.","Première règle : c'est la Ville qui accorde la bourse, pas l'école. Selon la Ville, le dépôt d'un dossier ne garantit pas son attribution, et les dossiers incomplets ne sont pas acceptés. Une école peut vous aider à constituer votre dossier, mais elle ne peut pas vous promettre la bourse.","Deuxième règle, nouvelle cette année : toutes les écoles ne donnent pas droit à la bourse. Selon une note de la DEI datée du 21 août 2026, rapportée par la presse, les écoles, centres de formation et universités privés qui veulent accueillir des boursiers de la Ville doivent désormais se faire référencer sur une plateforme en ligne. Ils doivent y fournir leur agrément ou leur autorisation d'ouverture, ainsi que la liste de leurs filières accréditées par l'État. Sans cette validation, la formation n'est pas prise en compte pour les bourses municipales.","Les pièces généralement demandées pour une prise en charge au Sénégal sont : une lettre manuscrite adressée au maire, un certificat d'inscription, une facture pro forma de l'école, les derniers diplômes et les notes de la dernière année, une copie de la carte d'identité et un certificat de résidence. Selon la situation de la famille, d'autres pièces peuvent être demandées : acte de décès pour un orphelin, attestation de chômage d'un parent, etc. Les dates de dépôt changent d'une année à l'autre : en 2025, elles allaient du 15 au 29 octobre.","Pour les étudiants inscrits à l'étranger, la Ville verse une allocation annuelle d'environ 1,3 million de francs CFA (2 000 euros), selon le portail officiel Sénégal Services. Les demandes se déposent de juillet à novembre."],"conseils":[["Qui publie ?","Si les numéros de téléphone sont ceux d'une école et non ceux de la Ville, c'est une publicité."],["L'école est-elle référencée ?","Demandez-lui la preuve de son référencement auprès de la Ville, ou renseignez-vous directement à la DEI."],["La filière est-elle accréditée ?","Vérifiez-le sur le site de l'ANAQ-Sup (anaqsup.sn), qui évalue les formations du supérieur."],["La date limite est-elle officielle ?","Seule la Ville fixe les dates de dépôt des bourses municipales. Une date affichée par une école peut être celle de ses propres inscriptions."],["Ne payez jamais pour « obtenir » une bourse","Les dossiers se déposent directement auprès de la Ville."]],"sait":["La Ville de Dakar finance des études au Sénégal et à l'étranger, par sa Direction de l'Éducation et de l'Aide à l'Insertion.","Depuis le 21 août 2026, les écoles privées doivent être référencées sur une plateforme de la Ville pour accueillir des boursiers, selon la presse.","Le dépôt d'un dossier ne garantit pas l'obtention de la bourse."],"saitPas":["Les dates officielles de la campagne de bourses 2026-2027 : la Ville ne les a pas encore publiées, à notre connaissance.","La liste des écoles référencées : elle n'est pas publique à ce jour."],"src":[{"n":"Ville de Dakar : demande de bourse (DEI)","u":"https://villededakar.sn/dei/demande-de-bourse/"},{"n":"Portail des bourses de la Ville de Dakar","u":"https://www.boursevillededakar.sn/fr"},{"n":"Sénégal Services : allocation municipale d'études à l'étranger","u":"https://senegalservices.sn/demarche/demander-loctroi-dune-allocation-municipale-detudes-a-letranger"},{"n":"Senego : inscription obligatoire sur une plateforme pour les établissements de bourses","u":"https://senego.com/ville-de-dakar-inscription-obligatoire-sur-une-plateforme-pour-les-etablissements-de-bourses_1997641.html"},{"n":"L'Actu Acho : nouvelle procédure pour les établissements bénéficiaires des bourses","u":"https://www.lactuacho.com/ville-de-dakar-nouvelle-procedure-pour-les-etablissements-beneficiaires-des-bourses-appeles-a-sinscrire-sur-une-plateforme-numerique/"},{"n":"Guindima : bourse Ville de Dakar 2025/2026, le dossier","u":"https://guindima.sn/news/article/bourse-ville-de-dakar-20252026-dossier-de-prise-en-charge-detudes-et-aide-scolaire-a-letranger/"},{"n":"Sama Bac : la Mairie de Dakar offre des bourses d'études (2025-2026)","u":"https://samabac.sn/la-mairie-de-dakar-offre-des-bourses-detudes-aux-etudiants-pour-lannee-2025-2026"},{"n":"ANAQ-Sup : Autorité nationale d'assurance qualité de l'enseignement supérieur","u":"https://anaqsup.sn/"}],"photo":"images/articles/bourse-mairie-de-dakar-comment-ca-marche-mvtp5f1m.jpg","maj":"2026-10-29","srcTxt":["Visuel : Mais quand ?"]},
 {"id":"joj-dakar-2026-chantiers-livres-inquietudes-morales","cat":"Sport","titre":"JOJ Dakar 2026 : des chantiers livrés, des inquiétudes morales et des mesures pour protéger les jeunes","chapo":"Samedi 31 octobre, Dakar ouvre les premiers Jeux olympiques de la jeunesse organisés en Afrique. Où en sont les travaux ? Et que répondre à ceux qui craignent que l'événement n'attire la débauche ? Voici ce que disent les faits.","date":"2026-10-28","min":3,"c":["#0b6e8a","#4fb3d1"],"texte":["Du 31 octobre au 13 novembre, quelque 2 700 athlètes âgés de 15 à 18 ans sont attendus à Dakar, Diamniadio et Saly. C'est une première pour le continent africain.","Les travaux. Le principal chantier, le Village olympique de Diamniadio, a longtemps inquiété : en juin, le gouvernement le jugeait encore « une réelle préoccupation ». Le Premier ministre avait alors fixé une feuille de route de 30 mesures et des dates butoirs strictes. Le 29 août, le président Bassirou Diomaye Faye a officiellement réceptionné le Village, qui compte 546 chambres et 2 079 lits, ainsi que le Centre équestre.","À Dakar, le stade Iba-Mar-Diop et la piscine olympique ont été rénovés. À Saly, la SAPCO a aménagé la plage ouest pour le beach-volley, le triathlon, l'aviron, la voile et la lutte. Les travaux routiers devaient être terminés le 30 septembre et la liaison du TER vers l'aéroport AIBD mise en service avant le 27 septembre. Nous n'avons pas trouvé de bilan officiel confirmant que ces deux échéances ont été tenues. Environ 6 000 volontaires ont été mobilisés.","Les inquiétudes. L'arrivée de milliers de visiteurs étrangers suscite des craintes chez une partie de la population. L'ONG islamique Jamra a appelé les organisateurs à la vigilance face aux symboles et messages LGBT pendant les Jeux, au nom des valeurs culturelles et religieuses du pays. Son responsable, Mame Makhtar Guèye, a demandé aux autorités de prendre des mesures préventives. D'autres voix religieuses insistent plutôt sur les valeurs olympiques d'amitié et de respect : c'est le cas d'un texte publié par l'Église de Dakar.","Les mesures de protection. Les athlètes sont mineurs, et c'est sur ce point que les autorités ont agi concrètement. Les ministères de la Justice et du Tourisme ont signé avec les professionnels du secteur une charte contre les abus sexuels sur les enfants liés au tourisme. Hôtels et agences doivent signaler toute situation suspecte, et une coordination est prévue avec la Guinée, la Guinée-Bissau et la Gambie. Saly, ville hôte, est particulièrement concernée. Par ailleurs, la Brigade des mœurs a mené ces dernières semaines des opérations contre des réseaux de proxénétisme à Dakar, sans que la police ne les relie aux Jeux.","Le gouvernement, lui, présente les JOJ comme une vitrine pour le pays. Le président Faye les décrit comme « une célébration vivante du sport, de la jeunesse, de la culture et des valeurs de paix et de fraternité »."],"sait":["Les JOJ ont lieu du 31 octobre au 13 novembre, à Dakar, Diamniadio et Saly.","Le Village olympique et le Centre équestre ont été réceptionnés le 29 août.","Une charte contre les abus sexuels sur mineurs liés au tourisme a été signée par les ministères de la Justice et du Tourisme.","Jamra a demandé des mesures préventives contre les symboles LGBT."],"saitPas":["Si toutes les routes et la liaison TER vers l'AIBD sont prêtes : aucun bilan officiel publié à ce jour.","Quelles mesures concrètes les autorités prendront en réponse à la demande de Jamra.","Le nombre de visiteurs étrangers attendus."],"att":"joj","src":[{"n":"Agence Ecofin : le Village olympique et le Centre équestre livrés à deux mois des JOJ","u":"https://www.agenceecofin.com/actualites-infrastructures/0809-141372-dakar-2026-le-village-olympique-et-le-centre-equestre-livres-a-deux-mois-des-joj"},{"n":"Primature : les 30 mesures du Premier ministre pour finaliser les préparatifs","u":"https://primature.sn/publications/actualites/joj-dakar-2026-les-30-mesures-du-premier-ministre-pour-finaliser-les"},{"n":"PressAfrik : le Premier ministre fixe les ultimatums pour la livraison des chantiers","u":"https://www.pressafrik.com/JOJ-Dakar-2026-le-Premier-ministre-fixe-les-ultimatums-pour-la-livraison-des-chantiers_a309735.amp.html"},{"n":"RTS : la SAPCO accélère l'aménagement du site de Saly","u":"https://www.rts.sn/actualite/detail/a-la-une/amenagement-du-site-de-saly-la-sapco-accelere-les-preparatifs-des-joj-dakar-2026"},{"n":"APS : 97 % des travaux réalisés, selon le COJOJ","u":"https://aps.sn/joj-dakar-2026-97-des-travaux-realises-les-sites-seront-livres-fin-avril-cojoj/"},{"n":"Le Soleil : au cœur des préparatifs à Kër Ayo avec les volontaires","u":"https://lesoleil.sn/actualites/sports/dakar2026/joj-dakar-2026-plongee-au-coeur-des-preparatifs-a-ker-ayo-avec-larmee-des-volontaires/"},{"n":"Emedia : Jamra appelle à la vigilance sur les symboles LGBT","u":"https://emedia.sn/joj-dakar-2026-jamra-appelle-a-la-vigilance-sur-les-symboles-lgbt/"},{"n":"Église de Dakar : JOJ Dakar 2026","u":"https://olympics26-eglisedakar.org/"},{"n":"Le Soleil : une charte signée pour prévenir les abus sexuels sur les enfants","u":"https://lesoleil.sn/actualites/societe-fait-divers/joj-dakar-2026-une-charte-signee-pour-prevenir-les-abus-sexuels-sur-les-enfants/"},{"n":"APS : les acteurs de la protection de l'enfance mobilisés","u":"https://aps.sn/joj-dakar-2026-les-acteurs-de-la-protection-de-lenfance-mobilises-contre-les-abus-sexuels-dans-le-tourisme/"},{"n":"PressAfrik : 10 personnes interpellées pour proxénétisme à Dakar","u":"https://www.pressafrik.com/Dakar-10-personnes-interpellees-pour-proxenetisme-et-incitation-a-la-debauche_a311281.html"},{"n":"Senegal7 : la déclaration du président Diomaye Faye","u":"https://senegal7.com/joj-dakar-2026-sera-une-celebration-vivante-du-sport-de-la-jeunesse-de-la-culture-et-des-valeurs-de-paix-et-de-fraternite-pr-diomaye-faye/"}],"maj":"2026-10-28","photo":"images/articles/joj-dakar-2026-chantiers-livres-inquietudes-morales-mvrzn96x.jpg"},
 {"id":"conseil-des-ministres-du-28-octobre-joj-loi-de-finances","cat":"Société","titre":"Conseil des ministres du 28 octobre : les JOJ, la loi de finances et la « stabilité sociale » au menu","chapo":"Le président Bassirou Diomaye Faye a présidé ce mercredi le Conseil des ministres, à trois jours de l'ouverture des Jeux olympiques de la jeunesse. Il a aussi demandé au gouvernement d'assurer la mise en œuvre des projets prévus dans la loi de finances rectificative 2026 et la loi de finances 2027, alors que la première reste bloquée à l'Assemblée.","date":"2026-10-28","min":4,"c":["#0f4a35","#2f9e5b"],"texte":["Le Conseil des ministres s'est réuni ce mercredi 28 octobre au Palais de la République, sous la présidence du chef de l'État.","Les Jeux olympiques de la jeunesse ont occupé une large place. Le président a souhaité la bienvenue aux délégations, à trois jours de la cérémonie d'ouverture du samedi 31 octobre. Il a demandé au gouvernement et au comité d'organisation de veiller au bon déroulement du programme sportif et culturel. Il a aussi insisté sur le sommet de Dakar « Sport pour le développement », prévu le même jour, et renouvelé son appel à l'unité nationale et à la mobilisation de tous autour des Jeux.","Sur les finances publiques, le président a demandé au Premier ministre de prendre les dispositions juridiques nécessaires pour que les politiques, programmes et projets inscrits dans la loi de finances rectificative 2026 et dans le projet de loi de finances 2027, déposés à l'Assemblée nationale, soient mis en œuvre. Cette demande intervient au lendemain du renvoi en commission de la loi de finances rectificative, faute d'accord entre le gouvernement et les députés de Pastef. Le communiqué ne précise pas quelles dispositions juridiques sont envisagées.","Sous le titre « Continuité des pouvoirs publics, relance économique et stabilité sociale », le communiqué appelle aussi à intensifier la relance de l'économie dans un climat social apaisé. Le président a en outre évoqué la sécurité civile, avec l'inauguration récente d'une compagnie de sapeurs-pompiers à Diamniadio.","Côté nominations, le Conseil a procédé à une quarantaine de mesures individuelles dans douze ministères. Parmi les plus marquantes : le général de corps d'armée (2S) Mbaye Cissé est nommé ambassadeur du Sénégal au Canada, avec résidence à Ottawa ; le journaliste Babou Faye devient président du conseil d'administration de l'Agence de presse sénégalaise (APS), en remplacement de Sadikh Top ; Gilbert Sidy Lamine Mbengue est nommé directeur général des Sports, à trois jours des JOJ ; Ibrahima Badiane prend la direction du Grand Théâtre national. La liste complète, ministère par ministère, figure ci-dessous."],"sait":["Le Conseil des ministres s'est tenu le 28 octobre sous la présidence de Bassirou Diomaye Faye.","Le président a demandé la mise en œuvre des projets de la loi de finances rectificative 2026 et de la loi de finances 2027.","Les JOJ s'ouvrent le 31 octobre, le même jour que le sommet « Sport pour le développement ».","Le Conseil a procédé à une quarantaine de nominations dans douze ministères, dont celles de Mbaye Cissé (ambassadeur au Canada) et de Babou Faye (APS)."],"saitPas":["Quelles « dispositions juridiques » le gouvernement compte prendre pour la loi de finances rectificative, toujours en commission."],"src":[{"n":"SenePlus : le communiqué du Conseil des ministres du mercredi 28 octobre 2026","u":"https://www.seneplus.com/article/le-communique-du-conseil-des-ministres-du-mercredi-28-octobre-2026"},{"n":"Senego : le communiqué du mercredi 28 octobre 2026","u":"https://senego.com/conseil-des-ministres-voici-le-communique-du-mercredi-28-octobre-2026_2018362.html"},{"n":"SENTV : le communiqué du mercredi 28 octobre 2026","u":"https://www.sentv.info/le-communique-du-conseil-des-ministres-du-mercredi-28-octobre-2026/"},{"n":"Senegal7 : communiqué du Conseil des ministres du 28 octobre 2026","u":"https://senegal7.com/communique-du-conseil-des-ministres-du-mercredi-28-octobre-2026/"},{"n":"Dakaractu : les nominations en Conseil des ministres du 28 octobre 2026","u":"https://www.dakaractu.com/Les-nominations-en-Conseil-des-Ministres-de-ce-Mercredi-28-octobre-2026_a277575.html"},{"n":"Le Soleil : les mesures individuelles du Conseil des ministres du 28 octobre 2026","u":"https://lesoleil.sn/actualites/les-mesures-individuelles-du-conseil-des-ministres-du-28-octobre-2026/"},{"n":"PressAfrik : le général Mbaye Cissé nommé ambassadeur au Canada, Sadikh Top remplacé par Babou Faye","u":"https://www.pressafrik.com/Le-General-Mbaye-Cisse-nomme-ambassadeur-du-Senegal-au-Canada-Sadikh-Top-remplace-par-Babou-Faye_a313727.html"},{"n":"Mais quand ? : LFR 2026, le texte renvoyé en commission","u":"https://maisquand.com/a/lfr-2026-pas-de-vote-le-texte-renvoye-en-commission/"}],"maj":"2026-10-29","photo":"images/articles/conseil-des-ministres-du-28-octobre-joj-loi-de-finances-mvspob10.jpg","conseils":[["Économie, Finances et Plan","**Hahmadou Bamba Tine**, inspecteur du Trésor principal, directeur général de la Coopération économique et du Développement des partenariats et du secteur privé. À cette direction générale : **Cheikh Ahmed Tidiane Senghor**, coordonnateur ; **Malick Sarr**, directeur de l'Administration et du Personnel ; **Maam Swadu Sakho Jimbira**, directrice de la Coopération et des Partenariats économiques ; **Babacar Sène**, directeur du Développement du secteur privé ; **Papa Mamadou Gueye**, directeur des Partenariats public-privé."],["Intégration africaine, Affaires étrangères et Sénégalais de l'extérieur","Le général de corps d'armée (2S) **Mbaye Cissé**, ambassadeur extraordinaire et plénipotentiaire au Canada, avec résidence à Ottawa."],["Famille, Action sociale et Solidarités","**Mamadou Selly Ly**, secrétaire général de l'Agence sénégalaise de la Couverture sanitaire universelle (SEN CSU)."],["Transports terrestres et aériens","**Abdoulaye Diop**, directeur général du Fonds pour le Développement des Transports terrestres (FDTT)."],["Culture, Tourisme et Artisanat","**Ibrahima Badiane**, directeur général du Grand Théâtre national, en remplacement de Serigne Fall Gueye ; **Hugues Diaz**, directeur général de la Culture ; **Ndeye Khoudia Diagne**, directrice des Arts, en remplacement de Hugues Diaz ; **Fama Cissé Thiam**, directrice du Livre et de la Promotion de la lecture, en remplacement d'Ibrahima Moctala Lo, admis à la retraite ; **Oumar Diallo**, président du conseil de surveillance de l'Agence pour la Promotion et le Développement de l'Artisanat, en remplacement de Sissao Diane."],["Santé et Hygiène publique","**Mor Fall**, président du conseil d'administration de la Pharmacie nationale d'approvisionnement (PNA), en remplacement de Mamadou Sane ; Pr **Mamadou Fall**, directeur du Centre national antipoison ; Dr **Ndeye Fatou Seck**, directrice de la Qualité, de la Sécurité et de l'Hygiène hospitalière ; Dr **Fatou Ndong Diouck**, directrice de l'hôpital Thierno Mansour Barro de Mbour, en remplacement du Dr Thérèse Aïda Ndiaye ; **Alassane Mamadou Thiam**, président du conseil d'administration du Centre national antipoison ; Dr **Yoro Diagne**, directeur du Centre hospitalier régional de Ziguinchor, en remplacement du Dr Gabriel Senghor ; Dr **Mouhamadou Abdoulaye Sakho**, directeur de l'hôpital Mame Abdou Aziz Dabakh de Tivaouane, en remplacement du Dr Yoro Diagne ; **Mouhamed Abdallah Gueye**, directeur des Établissements publics de santé ; Dr **Ousmane Diop**, directeur du Centre hospitalier régional de Matam."],["Communication et Relations avec les Institutions","**Babou Faye**, journaliste, président du conseil d'administration de l'Agence de presse sénégalaise (APS), en remplacement de Sadikh Top."],["Enseignement supérieur, Recherche et Innovation","**Diamé Signate**, ancien directeur général de l'Agence de développement local, directeur du Centre régional des Œuvres universitaires sociales de l'Université du Sénégal oriental."],["Agriculture, Souveraineté alimentaire et Élevage","**Djidiack Faye**, coordonnateur national du Programme des Domaines agricoles communautaires (PRODAC), en remplacement de Cheikh Ahmadou Bamba Ngom."],["Jeunesse et Sports","**Gilbert Sidy Lamine Mbengue**, directeur général des Sports, en remplacement de Mama Laye Mbaye ; **Souleymane Boun Daouda Diop**, président du conseil d'administration de l'Office de gestion des infrastructures sportives, en remplacement d'Amady Ahmadou Diop ; **Mandiaye Ndiaye**, directeur du Sport de haut niveau, en remplacement de Cheikh Tahirou Fall ; **Serigne Ali Cissé Diène**, directeur du Centre national d'éducation populaire et sportive (CNEPS), en remplacement de Nalla Socé Fall."],["Microfinance et Économie sociale et solidaire","**Aminata Fall**, directrice générale du Fonds national de la Microfinance (FONAMIF), en remplacement d'Amadou Tidiane Diallo ; **El Hadji Habib Kandji**, secrétaire général du Fonds de développement de la Microfinance islamique."],["Urbanisme, Collectivités territoriales et Aménagement des territoires","**Adama Sarr**, ingénieur topographe, directeur général de l'Agence nationale de l'Aménagement du territoire (ANAT), en remplacement de Tidiane Sidibé."]]},
 {"id":"immeubles-qui-s-effondrent-14000-batiments","cat":"Société","titre":"Immeubles qui s'effondrent : 14 000 bâtiments à diagnostiquer d'urgence au Sénégal","chapo":"Après le drame de la Médina, où un vendeur de café a été tué par la chute d'un balcon le 16 octobre, la question revient avec force : combien d'immeubles menacent de s'effondrer, et que fait l'État ? Selon le ministre de l'Urbanisme, un audit national en a recensé 14 000 à diagnostiquer d'urgence.","date":"2026-10-27","min":3,"c":["#5b3a6e","#a983c2"],"texte":["Le 16 octobre au soir, le balcon du troisième étage d'un immeuble de la Médina, rue 17 angle 20, près du marché Tilène, s'est effondré. Un vendeur de café installé en contrebas a été tué, trois personnes ont été blessées. Le procureur a ordonné une enquête, dont les conclusions ne sont pas encore connues.","Ce drame n'est pas isolé. En janvier 2024, l'effondrement d'un immeuble en travaux à Khar Yalla, à Dakar, avait fait au moins cinq morts, sept selon certains médias. Les autorités locales avaient alors recensé 43 bâtiments menaçant ruine dans ce seul quartier. En mai 2025, c'est un immeuble de cinq étages qui s'est écroulé à Ngor.","L'ampleur du problème est désormais chiffrée. Lors du salon Senhabitat, ce mois-ci, le ministre de l'Urbanisme a annoncé qu'un audit national avait identifié 14 000 bâtiments à diagnostiquer d'urgence, selon plusieurs médias. Il y a quelques années, les statistiques officielles n'en comptaient qu'environ 1 450, dont plus de 600 à Dakar.","Selon la presse, une première série de 14 opérations prioritaires, d'un coût de 24,6 milliards de francs CFA, est en cours à Dakar, notamment à la Médina, à Colobane, à Biscuiterie et à Grand-Dakar. Elle vise à reconstruire les bâtiments dangereux et à reloger leurs habitants.","Les communes agissent aussi. Fin août, le maire de Dakar, Abass Fall, a ordonné la démolition systématique des bâtiments menaçant ruine et un recensement complet dans sa commune. Selon Pulse, une cinquantaine de bâtiments doivent être démolis dans le département de Dakar. En juin, le ministre de l'Intérieur avait demandé le recensement de tous les bâtiments à risque dans la région de Saint-Louis.","Comment ça marche ? Quand un bâtiment est jugé dangereux, le maire de la commune prend un « arrêté de péril », qui peut aller jusqu'à l'évacuation et la démolition. Ce sont ensuite le préfet ou le sous-préfet qui organisent la démolition. Mais entre l'arrêté et le départ des habitants, les mois, voire les années, passent souvent, faute de solution de relogement.","Les signes qui doivent alerter : des fissures qui s'élargissent sur les murs ou les poteaux, du béton qui s'effrite et laisse voir des fers rouillés, des balcons ou des dalles qui s'affaissent, des infiltrations d'eau répétées après les pluies. En cas de danger immédiat, éloignez-vous et appelez les sapeurs-pompiers au 18. Pour un bâtiment qui inquiète, signalez-le à la mairie de votre commune."],"sait":["Un audit national a identifié 14 000 bâtiments à diagnostiquer d'urgence, selon le ministre de l'Urbanisme cité par la presse.","14 opérations prioritaires (24,6 milliards de francs CFA) sont annoncées à Dakar, dont la Médina.","La mairie de Dakar a ordonné des démolitions et un recensement complet fin août.","Une enquête est ouverte sur l'effondrement de la Médina du 16 octobre."],"saitPas":["La liste des 14 000 bâtiments : elle n'a pas été rendue publique, et l'on ne sait pas si votre quartier est concerné.","Le calendrier des diagnostics, des démolitions et des relogements.","Les conclusions de l'enquête sur l'immeuble de la Médina, et si une sommation d'évacuation le visait déjà."],"srcTxt":["Photo : effondrement d'un immeuble à Dakar (archives), transmise à la rédaction."],"src":[{"n":"Pulse : 14 000 édifices menacent ruine au Sénégal","u":"https://www.pulse.sn/article/14000-edifices-menacent-ruine-au-senegal-2026102306584269289"},{"n":"Bénin Web TV : 14 000 bâtiments à diagnostiquer d'urgence face au risque de ruine","u":"https://beninwebtv.com/senegal-14-000-batiments-a-diagnostiquer-durgence-face-au-risque-de-ruine/"},{"n":"Dekkbi, d'après L'Observateur : un audit identifie 14 000 édifices menaçant ruine","u":"https://dekkbi.com/?p=80146"},{"n":"Pulse : département de Dakar, 50 bâtiments menaçant ruine seront démolis","u":"https://www.pulse.sn/article/departement-de-dakar-50-batiments-menacant-ruine-seront-demolis-2026082812214750960"},{"n":"Xalaat TV : le maire Abass Fall ordonne la démolition systématique des bâtiments menaçant ruine","u":"https://www.xalaattv.net/2026/08/27/securite-a-dakar-le-maire-abass-fall-ordonne-la-demolition-systematique-des-batiments-menacant-ruine/"},{"n":"allAfrica : le ministre de l'Intérieur invite au respect des normes de construction","u":"https://fr.allafrica.com/stories/202606170203.html"},{"n":"Dakaractu : l'effondrement d'un balcon relance la polémique sur les immeubles menaçant ruine","u":"https://www.dakaractu.com/Drame-a-la-Medina-l-effondrement-d-un-balcon-relance-la-polemique-sur-les-immeubles-menacant-ruine_a277149.html"},{"n":"VOA Afrique : l'effondrement d'un immeuble à Dakar (Khar Yalla, 2024)","u":"https://www.voaafrique.com/a/s%C3%A9n%C3%A9gal-sept-morts-dans-l-effondrement-d-un-immeuble-%C3%A0-dakar/7464769.html"},{"n":"APS : effondrement d'un immeuble de cinq étages à Ngor (2025)","u":"https://aps.sn/effondrement-dun-immeuble-de-cinq-etages-a-ngor-medias/"},{"n":"Seneinfo : plus de 1 440 bâtiments menacent ruine (ancien chiffre)","u":"https://www.seneinfo.net/senegal-plus-de-1440-batiments-menacent-ruine/"},{"n":"Mais quand ? : Médina, un vendeur de café tué par la chute d'un balcon","u":"https://maisquand.com/a/medina-un-vendeur-de-cafe-tue-par/"}],"photo":"images/articles/immeubles-qui-s-effondrent-14000-batiments.jpg","pos":"center"},
 {"id":"lfr-2026-pas-de-vote-le-texte-renvoye-en-commission","cat":"Société","titre":"LFR 2026 : pas de vote, le texte renvoyé en commission à la demande du gouvernement","chapo":"La séance plénière de ce mardi 27 octobre devait trancher le sort du budget rectificatif 2026. Elle s'est achevée sans vote : le ministre des Finances, Cheikh Diba, a obtenu le renvoi du texte en commission pour de nouvelles discussions avec les députés.","date":"2026-10-27","min":3,"c":["#0f4a35","#2f9e5b"],"texte":["Les députés étaient réunis ce mardi matin en séance plénière pour examiner le projet de loi n° 40/2026 portant loi de finances rectificative (LFR) 2026. Le 23 octobre, la commission des finances et du contrôle budgétaire avait rejeté ce texte, avec les voix du groupe Pastef-Les Patriotes, majoritaire.","La séance a d'abord été brièvement interrompue. Pendant la lecture du rapport de la commission, de la fumée s'est dégagée d'une cabine de l'hémicycle. Les travaux ont été suspendus quelques minutes, puis ont repris. Aucun blessé n'a été signalé, et l'origine de la fumée n'avait pas été précisée en fin de journée.","Pendant la discussion générale, le ministre des Finances, Cheikh Diba, a demandé le renvoi du texte devant la commission des finances. Il s'est appuyé sur l'article 84 du règlement intérieur de l'Assemblée nationale, qui permet au gouvernement de faire cette demande jusqu'à la clôture de la discussion générale. Il a invoqué la nécessité de « discussions complémentaires dans les plus brefs délais ». Selon lui, cette décision n'est « ni un désengagement de l'exécutif ni une remise en cause du rôle du Parlement ».","Le renvoi étant de droit, le président de l'Assemblée nationale, Ousmane Sonko, en a pris acte. C'est désormais la Conférence des présidents qui doit fixer les dates des nouveaux travaux en commission, puis de la prochaine séance plénière.","Le différend porte sur le contenu du budget rectificatif. Le groupe Pastef, qui détient 130 des 165 sièges, dit accepter le principe d'une révision. Il réclame en revanche des garanties sur les fonds spéciaux, plus de transparence et le réexamen de coupes dans les dépenses sociales et d'investissement. Ce bras de fer entre le gouvernement et sa propre majorité est au cœur de la tribune de Malick Sonko, « Quand le gouvernement joue au pompier et PASTEF au pyromane ! », publiée sur Mais quand ?.","Mise à jour du 30 octobre. La Commission des finances et du contrôle budgétaire de l'Assemblée nationale est convoquée ce vendredi 30 octobre à 15 heures, salle Marie Joséphine Diallo du nouveau bâtiment, pour réexaminer le projet de loi n° 40/2026. C'est l'unique point à l'ordre du jour, selon la convocation datée du 29 octobre et signée par le président de la commission, Alphonse Mané Sambou.","Entre-temps, le 28 octobre, le président Bassirou Diomaye Faye a demandé en Conseil des ministres au Premier ministre de prendre « les dispositions juridiques nécessaires » pour mettre en œuvre la loi de finances rectificative 2026 et la loi de finances 2027, sans préciser lesquelles.","Au cœur du blocage figurent les fonds spéciaux. Le 19 octobre, Ousmane Sonko avait prévenu que Pastef ne voterait aucun budget sans garanties légales sur leur utilisation. Une loi organique sur leur contrôle, votée par les députés le 1er octobre, a été déclarée contraire à la Constitution le 15 octobre pour des raisons de procédure, selon la presse."],"sait":["La plénière du 27 octobre s'est terminée sans vote : le texte est renvoyé en commission à la demande du gouvernement (article 84 du règlement intérieur).","La commission des finances avait rejeté le projet le 23 octobre.","Une fumée a interrompu la séance quelques minutes, sans blessé signalé.","Si le texte était finalement rejeté, la loi de finances initiale 2026 resterait en vigueur.","La Commission des finances se réunit de nouveau le 30 octobre à 15 heures pour réexaminer le texte."],"saitPas":["Ce que la Commission décidera le 30 octobre, et la date de la nouvelle séance plénière.","Si le gouvernement a modifié le texte pour répondre aux demandes de Pastef, notamment sur les fonds spéciaux.","Quelles « dispositions juridiques » le gouvernement envisage, comme l'a demandé le président le 28 octobre."],"src":[{"n":"APS : LFR 2026, le texte renvoyé en commission pour des discussions complémentaires","u":"https://aps.sn/lfr-2026-le-texte-renvoye-en-commission-pour-des-discussions-complementaires/"},{"n":"Le Soleil : LFR 2026, le texte renvoyé en commission pour de nouvelles discussions","u":"https://lesoleil.sn/actualites/lfr-2026-le-texte-renvoye-en-commission-pour-de-nouvelles-discussions/"},{"n":"Seneweb : Cheikh Diba demande le renvoi en commission, la plénière ajournée","u":"https://www.seneweb.com/fr/news/Politique/lfr-2026-cheikh-diba-demande-le-renvoi-en-commission-la-pleniere-ajournee_n_999001884.html"},{"n":"Emedia : le projet de loi renvoyé en commission à la demande du ministre des Finances","u":"https://emedia.sn/lfr-2026-le-projet-de-loi-renvoye-en-commission-a-la-demande-du-ministre-des-finances/"},{"n":"Dakaractu : de la fumée dans la salle, la plénière suspendue quelques minutes","u":"https://www.dakaractu.com/Assemblee-nationale-De-la-fumee-dans-la-salle-la-pleniere-sur-la-LFR-2026-suspendue-quelques-minutes_a277509.html"},{"n":"Mais quand ? : la tribune de Malick Sonko sur la LFR 2026","u":"https://maisquand.com/a/tribune-quand-le-gouvernement-joue-au-pompier/"},{"n":"Dakaractu : convocation de la Commission des finances pour le 30 octobre"},{"n":"Mais quand ? : Conseil des ministres du 28 octobre","u":"https://maisquand.com/a/conseil-des-ministres-du-28-octobre-joj-loi-de-finances/"},{"n":"Xalima : Sonko prévient que Pastef ne votera pas les budgets sans garanties légales","u":"https://xalimasn.com/2026/10/19/fonds-speciaux-sonko-previent-que-pastef-ne-votera-pas-les-budgets-sans-garanties-legales/"},{"n":"SenePlus : Pastef fait adopter sa réforme du contrôle des fonds spéciaux","u":"https://www.seneplus.com/article/pastef-fait-adopter-sa-reforme-du-controle-des-fonds-speciaux"}],"maj":"2026-10-30","photo":"images/articles/lfr-2026-pas-de-vote-le-texte-renvoye-en-commission-mvr69k6k.jpg","plans":[{"u":"images/articles/convocation-commission-finances-lfr-2026.jpg","t":"La convocation de la Commission des finances et du contrôle budgétaire pour le vendredi 30 octobre 2026 à 15 heures, datée du 29 octobre et signée par son président, Alphonse Mané Sambou."}]},
 {"id":"cherte-de-la-vie-pourquoi-les-chiffres-de-l-ansd","cat":"Société","titre":"Cherté de la vie : pourquoi les chiffres de l'ANSD ne ressemblent pas à votre panier","chapo":"Selon l'ANSD, les prix n'ont augmenté que d'environ 1 % en un an. Pourtant, au marché, à la boutique ou devant la facture d'électricité, beaucoup de familles ont le sentiment inverse. Ce que disent vraiment les chiffres, et quand arrivent ceux d'octobre.","date":"2026-10-27","min":3,"c":["#0f4a35","#2f9e5b"],"texte":["L'Agence nationale de la statistique et de la démographie (ANSD) mesure chaque mois l'évolution des prix à la consommation. Selon sa dernière publication, parue le 9 octobre, les prix de septembre 2026 étaient en hausse d'environ 1 % par rapport à septembre 2025. En août, la hausse sur un an était de 1,2 %.","Sur un an, la hausse paraît donc faible. Mais sur un seul mois, septembre a été plus marqué : les prix ont augmenté d'environ 1 % par rapport à août, selon l'ANSD. D'après la presse qui a analysé la note, la hausse est plus forte pour les produits alimentaires (+2 % en un mois), l'électricité (+3,8 %) et les carburants (+4,4 %). Or ce sont justement les dépenses que les ménages font le plus souvent, et celles qu'ils remarquent le plus.","Plusieurs raisons expliquent le décalage entre le chiffre officiel et le ressenti. D'abord, l'indice est une moyenne sur des centaines de produits et de services : si certains baissent, ils compensent ceux qui montent. Ensuite, 1 % de plus chaque année s'ajoute aux fortes hausses des années précédentes : les prix ne reviennent pas en arrière, ils montent moins vite. Enfin, une famille qui consacre l'essentiel de son budget à la nourriture, au transport et à l'électricité ressent davantage la hausse de ces produits que la moyenne nationale.","Septembre est aussi la période de soudure, avant les récoltes, où les produits frais sont souvent plus chers. Selon la presse, l'État a mobilisé plus de 7,2 milliards de francs CFA d'aide pour les ménages vulnérables pendant cette période.","Les chiffres d'octobre diront si la hausse du mois de septembre se confirme ou s'il s'agissait d'un pic passager. L'ANSD les publiera au plus tard le 10 novembre. Mais quand ? suit cette date pour vous."],"sait":["Selon l'ANSD, les prix ont augmenté d'environ 1 % sur un an en septembre 2026 (1,2 % en août).","En septembre, la hausse sur un mois a surtout porté sur l'alimentation, l'électricité et les carburants.","Les chiffres d'octobre paraîtront au plus tard le 10 novembre."],"saitPas":["Le chiffre exact de la hausse sur un mois : l'ANSD affiche 1,0 %, certains médias écrivent 1,1 %. Nous n'avons pas pu consulter la note complète.","Si la hausse de septembre va durer en octobre.","Si le gouvernement prépare de nouvelles mesures sur les prix."],"att":"ansd-prix-octobre","src":[{"n":"ANSD : indice harmonisé des prix à la consommation (IHPC)","u":"https://www.ansd.sn/Indicateur/indice-harmonise-des-prix-la-consommation-ihpc-base-100-en-2023"},{"n":"Agence Ecofin : l'inflation globale annuelle ralentit à 1 % en septembre 2026","u":"https://www.agenceecofin.com/actualites/1610-142512-senegal-l-inflation-globale-annuelle-ralentit-a-1-en-septembre-2026"},{"n":"Agence Ecofin : l'inflation atteint 1,2 % sur un an (août 2026)","u":"https://www.agenceecofin.com/actualites/1509-141582-senegal-l-inflation-atteint-1-2-sur-un-an-portee-par-l-alimentation-les-services-et-le-transport"},{"n":"Senego : l'ANSD annonce une hausse des prix de 1,1 % en septembre 2026","u":"https://senego.com/lansd-annonce-une-hausse-des-prix-de-11-en-septembre-2026_2013625.html"},{"n":"Seneweb : légumes et électricité en hausse en septembre","u":"https://www.seneweb.com/en/news/Economie/inflation-les-prix-a-la-consommation-augmentent-de-11-en-septembre-les-legumes-et-lelectricite-en-hausse_n_999000803.html"}],"maj":"2026-10-27","photo":"images/articles/cherte-de-la-vie-pourquoi-les-chiffres-de-l-ansd-mvr8s7mm.jpg","srcTxt":["Photo transmise à la rédaction."]},
 {"id":"la-semaine-en-dates-26-octobre-1er-novembre","cat":"Société","titre":"La semaine en dates : ce qui vous attend du 26 octobre au 1er novembre","chapo":"Les Jeux olympiques de la jeunesse s'ouvrent samedi à Diamniadio : premières épreuves, cérémonie, routes réservées… Voici les dates à retenir cette semaine.","date":"2026-10-26","min":1,"c":["#5b3a6e","#a983c2"],"texte":["Une seule date domine cette semaine : le samedi 31 octobre, le Sénégal ouvre les Jeux olympiques de la jeunesse (JOJ) Dakar 2026, premier événement olympique organisé en Afrique. Voici ce qu'il faut savoir, jour par jour.","Vendredi 30 octobre : les premières épreuves. Avant même la cérémonie, les premières compétitions débutent, notamment les qualifications de Baseball5.","Samedi 31 octobre : la cérémonie d'ouverture. Elle se tient au stade Abdoulaye Wade de Diamniadio, en fin d'après-midi (17 h 45 selon la billetterie officielle), en présence du président Bassirou Diomaye Faye et de la présidente du CIO, Kirsty Coventry. Au programme : parade des athlètes, musique, danse et allumage de la vasque.","Ce jour-là, la circulation sera modifiée. Sur l'autoroute de l'Avenir, entre la Patte d'Oie et l'AIBD, la voie de gauche est réservée aux véhicules olympiques de 7 h à 19 h en direction de Diamniadio, puis dans l'autre sens de 19 h à 23 h 30. La sortie n° 11, qui dessert le stade, est réservée aux véhicules accrédités de 7 h à 23 h 30. Pour rejoindre les sites, empruntez les sorties n° 10 et n° 12, qui restent ouvertes à tous.","Dimanche 1er novembre : jour férié de la Toussaint, et premières épreuves à Saly, avec le beach-volley et l'aviron en mer.","À noter pour la semaine prochaine : les 7, 8 et 10 novembre, plusieurs tronçons de la Corniche Ouest seront fermés de 6 h à 16 h pour les épreuves sur route. Les Lions, eux, reprennent les éliminatoires de la CAN 2027 à partir du 9 novembre.","Les JOJ se poursuivent jusqu'au 13 novembre. Toutes les dates suivies sont sur la page « Mais quand ? » du site."],"sait":["Cérémonie d'ouverture des JOJ : samedi 31 octobre, stade Abdoulaye Wade, Diamniadio.","Restrictions sur l'autoroute de l'Avenir le 31 octobre ; sorties n° 10 et n° 12 ouvertes à tous.","Les JOJ se déroulent jusqu'au 13 novembre, entre Dakar, Diamniadio et Saly."],"saitPas":["L'heure exacte du début de la cérémonie : 17 h 45 selon la billetterie, 18 h selon d'autres sources.","Si des mesures particulières (écoles, administrations) seront annoncées pour les jours de compétition."],"src":[{"n":"Olympics.com : 5 choses à savoir sur la cérémonie d'ouverture","u":"https://www.olympics.com/fr/dakar-2026/actualite/5-choses-a-savoir-sur-la-ceremonie-d-ouverture-des-joj-dakar-2026"},{"n":"Billetterie officielle Dakar 2026","u":"https://tickets.dakar2026.org/fr"},{"n":"SENTV : l'autoroute de l'Avenir et plusieurs axes sous restrictions le 31 octobre","u":"https://www.sentv.info/joj-dakar-2026-lautoroute-de-lavenir-et-plusieurs-axes-routiers-sous-restrictions-le-31-octobre/"},{"n":"Le Petit Journal : la capitale se prépare à d'importants changements de circulation","u":"https://lepetitjournal.com/dakar/joj-dakar-2026-la-capitale-se-prepare-dimportants-changements-de-circulation-456308"}],"att":"joj","photo":"images/articles/semaine-en-dates-26-octobre.jpg","pos":"center","srcTxt":["Visuel : Mais quand ?"]},
 {"id":"tribune-quand-le-gouvernement-joue-au-pompier","cat":"Opinion","titre":"Tribune : « Quand le gouvernement joue au pompier et PASTEF au pyromane ! »","chapo":"Opinion · Contribution de Malick Sonko, analyste politique, sur la loi de finances rectificative (LFR) 2026. Ce texte n'engage que son auteur.","date":"2026-10-26","min":3,"c":["#3d4a5c","#8fa3bf"],"texte":["Il fallait oser ! Un gouvernement qui invoque les contraintes financières pour justifier des arbitrages douloureux et des députés de son propre camp en rupture de ban qui menacent de bloquer les mesures censées répondre à cette situation. Bienvenue dans le théâtre de la Loi de finances rectificative (LFR) 2026, où les pyromanes politiques se découvrent soudain une vocation de pompiers.","D’un côté, l’Exécutif invoque les réalités budgétaires et la nécessité de revoir certaines dépenses. De l’autre, des responsables de PASTEF dénoncent les coupes dans les investissements et contestent les choix gouvernementaux. Chacun brandit l’intérêt du peuple, mais personne ne semble pressé d’assumer le prix de ses exigences.","Car enfin, qui gouverne ce pays ? Qui définit les priorités et répond des résultats ? Le gouvernement certes, mais aussi la majorité qui l’a porté au pouvoir revendique son projet. On ne peut réclamer les honneurs de la gouvernance quand tout va bien et se défausser de ses conséquences lorsque les arbitrages deviennent impopulaires. La politique n’est pas un buffet où chacun se sert dans les promesses et laisse aux autres l’addition.","Bien entendu, les députés ont le droit de contester le budget, de proposer des amendements et même de rejeter le texte. C’est leur rôle. Mais encore faut-il avancer des solutions crédibles, chiffrées et compatibles avec les ressources disponibles. Réclamer davantage d’investissements sans expliquer comment les financer relève davantage de la posture que de la responsabilité.","Si les coupes sont injustifiées, qu’on le démontre. Si des investissements doivent être préservés, qu’on indique les économies à réaliser ailleurs. Si le gouvernement s’est trompé, qu’on établisse ses erreurs. Mais que l’on cesse de transformer chaque désaccord budgétaire en concours de vertu politique.","Le plus troublant est que ceux qui contestent aujourd’hui les arbitrages appartiennent au camp qui a fait de la rupture avec les pratiques du passé son principal argument de légitimité. Or, gouverner, ce n’est pas seulement dénoncer hier : c’est répondre de ce qui se passe aujourd’hui. On ne peut durablement exercer le pouvoir tout en se comportant comme une opposition à soi-même.","À force de vouloir conserver les bénéfices du pouvoir sans en assumer les difficultés, chacun cherche à se positionner du côté du peuple. Mais le budget de l’État n’est ni un slogan de meeting ni un instrument de chantage politique. Il engage les investissements, les services publics et la crédibilité financière du Sénégal. Un blocage ne ferait pas disparaître les contraintes ; il risquerait d’aggraver les incertitudes.","On ne peut pas allumer l’incendie politique, puis se présenter tous comme les pompiers. Le gouvernement doit justifier ses arbitrages ; sa majorité doit assumer ses responsabilités et formuler des alternatives sérieuses. Le Sénégal mérite mieux qu’une guerre de positionnement entre les différentes composantes du pouvoir.","Pendant que les responsables politiques se renvoient la balle, la facture, elle, finit toujours par arriver chez les citoyens. Gouverner, ce n’est pas souffler sur les braises le matin et réclamer les applaudissements des pompiers le soir. C’est prévenir l’incendie, en assumer la gestion et répondre de ses conséquences.","Malick SONKO","Analyste politique"],"srcTxt":["Contribution parue dans la presse écrite, reprise avec l'accord de l'auteur.","Ce texte n'engage que son auteur.","Photo transmise à la rédaction."],"src":[{"n":"Le Soleil : PLFR 2026, Pastef réclame des garanties sur la dette et les dépenses publiques","u":"https://lesoleil.sn/actualites/economie/plfr-2026-pastef-reclame-des-garanties-sur-la-dette-et-les-depenses-publiques/"},{"n":"SenePlus : LFR 2026, Pastef refuse le texte en l'état et pose ses conditions","u":"https://www.seneplus.com/article/lfr-2026-pastef-refuse-le-texte-en-letat-et-pose-ses-conditions"},{"n":"Vie publique Sénégal : projet de loi de finances rectificative (PLFR) 2026","u":"https://www.vie-publique.sn/documents/14075/projet-loi-finances-rectificative-plfr-2026-senegal"}],"sait":["Le 23 octobre 2026, après deux jours de travaux en commission, le groupe parlementaire Pastef-Les Patriotes a refusé d'adopter en l'état le projet de loi de finances rectificative 2026.","Le groupe dit ne pas rejeter la révision du budget sur le principe, mais demande notamment le réexamen des coupes dans la santé, l'éducation, l'hydraulique et les infrastructures, ainsi que des explications sur les déficits prévus.","Le projet revoit les prévisions du budget initial en raison d'un contexte international défavorable ; le déficit y est porté à 7,6 % du PIB, contre 5,4 % prévus au départ."],"saitPas":["Le montant exact des coupes dans l'investissement : plus de 500 milliards de francs CFA selon Pastef, chiffre que nous n'avons pas pu vérifier dans le texte officiel.","Si le gouvernement modifiera le texte avant le vote en séance plénière, et quand ce vote aura lieu."],"maj":"2026-10-26","photo":"images/articles/tribune-quand-le-gouvernement-joue-au-pompier.jpg","pos":"center"},
 {"id":"tribune-la-guinee-creuse-des-rails-le-senegal","cat":"Opinion","titre":"Tribune : « La Guinée creuse des rails, le Sénégal creuse le passé »","chapo":"Opinion · Tribune de Malick Sonko, analyste politique. Ce texte n'engage que son auteur.","date":"2026-10-24","min":2,"c":["#3d4a5c","#8fa3bf"],"texte":["Le lundi 12 octobre 2026, en Guinée, le président inaugure un train sur un corridor de plus de 650 kilomètres.","À Dakar, une semaine auparavant, on inaugurait une autre spécialité nationale : le procès politique de l’ancien régime.","À Conakry, on traverse un tunnel de douze kilomètres. À Dakar, on creuse dans les vieux dossiers. Là-bas, le rail avance. Ici, les auditions défilent. Eux font avancer les trains ; nous faisons défiler le paysage des prédécesseurs.","Six commissions d’enquête parlementaire, des anciens ministres à la barre, des révélations en série. À ce rythme, nous finirons par connaître par cœur les fautes du passé, sans jamais apprendre à construire l’avenir.","Le paradoxe est saisissant : nous voulons une administration irréprochable, mais nous fabriquons des fonctionnaires qui n’osent plus rien signer. Nous exigeons des résultats, tout en enseignant aux décideurs que l’inaction est la meilleure assurance contre les ennuis. Au Sénégal, celui qui ne fait rien ne risque rien. Celui qui entreprend risque un jour de devoir s’en expliquer devant les caméras. Pendant ce temps, les investisseurs hésitent.","Nous voulons un État qui avance, mais nous transformons chaque décision en pièce à conviction.","Qu’on ne s’y trompe pas : la reddition des comptes est indispensable. Mais nous disposons déjà de plusieurs organes de contrôle : IGE, Cour des comptes, OFNAC, inspections internes et autres structures compétentes. Une commission d’enquête parlementaire n’est ni un tribunal ni un programme de développement. Elle ne construit ni route, ni hôpital, ni emploi. Mille commissions d’enquête ne constitueront jamais un projet de société.","Pendant que nous jugeons le passé, la dette avoisine 130 % du PIB et la croissance hors hydrocarbures plafonne. Le pétrole coule, mais la prospérité ne jaillit pas du sous-sol par miracle. Il faut des décisions, des investissements et des responsables capables d’agir.","La Guinée n’est pas un modèle parfait, et Simandou ne résoudra pas tous ses problèmes. Mais ce chantier rappelle une vérité gênante : un pays doit aussi savoir où il va.","Notre ambition ne peut pas être de produire davantage de procès-verbaux que de projets, davantage de convocations que de réalisations.","À force de chercher qui a fait dérailler le pays, nous risquons d’oublier de poser les rails.","Que la justice juge, que le Parlement contrôle et que l’administration construise. Les générations futures nous demanderont non seulement qui nous avons convoqué, mais ce que nous avons accompli.","Car un pays peut finir par solder tous ses comptes avec le passé et rester débiteur envers son avenir.","Malick SONKO","Analyste politique"],"srcTxt":["Tribune publiée initialement dans Le Quotidien (16 octobre 2026), reprise avec l'accord de l'auteur.","Ce texte n'engage que son auteur."],"src":[{"n":"Le Quotidien : « La Guinée creuse des rails, le Sénégal creuse le passé »","u":"https://liiquotidien.com/2026/10/16/la-guinee-creuse-des-rails-le-senegal-creuse-le-passe/"},{"n":"Alwihda Info : le président Doumbouya inaugure le train du TransGuinéen et le tunnel de Kindia","u":"https://www.alwihdainfo.com/guinee-le-president-mamadi-doumbouya-inaugure-le-train-du-transguineen-et-le-tunnel-de-kindia/"},{"n":"Le Soleil : gestion de la dette publique, une stabilisation à 101 % visée en 2028","u":"https://lesoleil.sn/actualites/economie/gestion-de-la-dette-publique-une-stabilisation-a-101-visee-en-2028/"}],"photo":"images/articles/tribune-la-guinee-creuse-des-rails-le-senegal-mvmgvpr9.jpg","sait":["Le 12 octobre 2026, le président guinéen Mamadi Doumbouya a inauguré le train du TransGuinéen ; selon la présidence, le corridor ferroviaire à double voie dépasse 650 km, avec un tunnel d'environ 12 km à Kindia.","Ce corridor sert d'abord au projet minier de Simandou (minerai de fer).","La dette publique du Sénégal tourne autour de 130 % du PIB (de 128 à 132 % selon le périmètre retenu) ; le gouvernement vise environ 101 % en 2028.","Plusieurs commissions d'enquête parlementaire auditionnent actuellement d'anciens responsables à l'Assemblée nationale."],"saitPas":["Le nombre exact de commissions d'enquête en cours : l'auteur en cite six, nous ne l'avons pas vérifié.","L'effet réel de ces enquêtes sur les investisseurs : c'est l'analyse de l'auteur, aucune étude ne le mesure à ce jour.","Quand les trains de voyageurs circuleront régulièrement en Guinée : le ministre des Transports évoque 2027."],"maj":"2026-10-24"},
 {"id":"greve-a-senelec-le-gouverneur-de-dakar","cat":"Société","titre":"Grève à Senelec : le gouverneur de Dakar réquisitionne des agents pour maintenir le courant","chapo":"Par un arrêté signé le 20 octobre, le gouverneur Ousmane Kane réquisitionne des agents de Senelec du 21 au 23 octobre, à la demande de la direction, pour assurer la fourniture d'électricité pendant la grève.","date":"2026-10-21","min":2,"c":["#5b3a6e","#a983c2"],"texte":["À la veille de la grève annoncée à Senelec, l'État a pris les devants. Le gouverneur de la région de Dakar, Ousmane Kane, a signé le mardi 20 octobre un arrêté portant réquisition de certains agents de la société nationale d'électricité, du 21 au 23 octobre inclus.","Selon l'arrêté n° 00197, les agents concernés, désignés sur une liste nominative annexée au texte, doivent assurer « la continuité des services essentiels de fourniture d'électricité ainsi que la sécurité des installations et des équipements ». Ils sont tenus d'accomplir les missions indispensables au maintien du service pendant toute la durée de la mesure.","La réquisition a été demandée par le directeur général de Senelec lui-même, dans une lettre datée du même jour. Le gouverneur s'appuie notamment sur la loi de 1969 relative aux réquisitions de personnes, de biens et de services, et sur l'article 439 du nouveau Code du travail, qui encadre la réquisition des travailleurs grévistes. C'est au directeur général qu'il revient de notifier les ordres de réquisition aux agents.","La grève de 72 heures est portée par le front syndical FSDT, rejoint par le SUTELEC, présenté comme le syndicat majoritaire de l'entreprise. Les travailleurs réclament notamment le paiement de la prime sur le résultat annuel bénéficiaire 2025, et contestent le contrat AKILEE ainsi que le projet de filialisation de la société.","La direction de Senelec affirme n'avoir reçu aucun préavis de grève en bonne et due forme, alors que le Code du travail exige un délai de 30 jours. Le 19 octobre, le ministre de l'Énergie, Abdourahmane Diouf, avait demandé aux syndicats de surseoir à leur mouvement en attendant un arbitrage du président de la République sur la prime.","Dans un communiqué publié le même jour, Senelec assure que « toutes les dispositions nécessaires ont été prises » pour garantir la fourniture d'électricité pendant ces trois jours. Mais quand ? suivra le déroulement de la grève."],"sait":["Arrêté n° 00197 signé le 20 octobre 2026 par le gouverneur de la région de Dakar, Ousmane Kane.","Des agents de Senelec, désignés sur une liste nominative, sont réquisitionnés du 21 au 23 octobre inclus.","La réquisition a été demandée par le directeur général de Senelec.","La grève de 72 heures est portée par le FSDT, rejoint par le SUTELEC."],"saitPas":["Le nombre d'agents réquisitionnés.","Si la grève sera suivie, et si des coupures auront lieu.","La réaction des syndicats à cette réquisition."],"srcTxt":["Document : arrêté n° 00197/GRD/SP/AS du gouverneur de la région de Dakar, 20 octobre 2026","Communiqué de Senelec du 20 octobre 2026"],"src":[{"n":"Seneweb : le gouverneur de Dakar réquisitionne des agents (arrêté)","u":"http://www.seneweb.com/fr/news/Energie/greve-a-la-senelec-le-gouverneur-de-dakar-requisitionne-des-agents-arrete_n_999001304.html"},{"n":"Wannel TV : le gouverneur de Dakar réquisitionne des agents de la Senelec","u":"https://www.wannel.tv/greve-des-21-22-et-23-octobre-le-gouverneur-de-dakar-requisitionne-des-agents-de-la-senelec/"},{"n":"APS : le gouvernement appelle les syndicats à surseoir à leur menace de grève","u":"https://aps.sn/senelec-le-gouvernement-appelle-les-syndicats-a-surseoir-a-leur-menace-de-greve/"},{"n":"Seneweb : la Direction générale réagit à la menace de grève du SUTELEC","u":"https://seneweb.com/fr/news/Societe/senelec-la-direction-generale-reagit-a-la-menace-de-greve-du-sutelec-prevue-du-21-au-23-octobre_n_999001188.html"}],"maj":"2026-10-21","photo":"images/articles/greve-a-senelec-le-gouverneur-de-dakar-mvhv4q2y.jpg"},
 {"id":"migration-irreguliere-les-pirogues-continuent-de-partir","cat":"Société","titre":"Migration irrégulière : les pirogues continuent de partir, les autorités attendues au tournant","chapo":"Secours au large de Djiffère, interception au Maroc avec 124 Sénégalais à bord : les départs vers l'Espagne se succèdent depuis fin septembre, alors que la communication du gouvernement se fait attendre.","date":"2026-10-20","min":1,"c":["#5b3a6e","#a983c2"],"texte":["Les départs de pirogues vers l'Espagne ne faiblissent pas. En moins de trois semaines, plusieurs embarcations parties des côtes sénégalaises ont été secourues ou interceptées en mer, avec des centaines de personnes à bord.","Le 29 septembre, la Marine nationale a secouru une pirogue transportant 134 migrants à environ 90 kilomètres au nord-ouest de Dakar. Le jeudi 8 octobre, elle a porté secours à une autre embarcation avec 124 personnes à bord, à environ 37 kilomètres au large de Djiffère, dans la région de Fatick. Les passagers ont été débarqués à la base navale Amiral Faye Gassama, puis remis aux services compétents.","Une semaine plus tard, le jeudi 15 octobre, la Marine royale marocaine a intercepté une pirogue transportant 200 migrants, dont 124 Sénégalais. Les autorités marocaines ont signalé un grand nombre de femmes et de mineurs parmi les passagers.","Les chiffres de l'Organisation internationale pour les migrations (OIM) confirment que le phénomène reste très actif. Pour avril et mai 2026, ses équipes ont recensé huit départs et une pirogue aperçue en haute mer, soit 1 475 personnes au total, ainsi que 880 personnes impliquées dans des préparatifs de départ. Sur la même période, 1 544 migrants sont arrivés aux Canaries par la mer, un chiffre presque identique à celui de 2025 (1 559).","Face à cette recrudescence, Seneweb relève que la communication des autorités sénégalaises se fait attendre. Mais quand ? n'a pas trouvé, à ce jour, de déclaration officielle récente du gouvernement sur ces nouveaux dé
