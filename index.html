<style>
/* Layout : en-tête collant, une grande « à la une » puis une grille d'articles ; vue article dans la même page */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#dde3e8;
  --accent:#1f6b3a; --accent-soft:#e3f1e7; --sun:#e2a02b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#16222a; --ink:#e6edf2; --muted:#93a4b1; --line:#253540;
  --accent:#6fcf94; --accent-soft:#173a28; --sun:#f0b84f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#16222a; --ink:#e6edf2; --muted:#93a4b1; --line:#253540;
  --accent:#6fcf94; --accent-soft:#173a28; --sun:#f0b84f; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo{flex-direction:column;align-items:flex-start;gap:0;line-height:1}
.logo .name{font-size:1.75rem}
.logo em{font-style:normal;color:var(--sun);display:inline-block;transform:rotate(8deg) translateY(-1px);margin-left:1px}
.logo .slogan{font-family:var(--mono);font-weight:500;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.date{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.search{flex:1 1 220px;max-width:320px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav button{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:.9rem}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Sur ordinateur, pas de glissement au doigt : les rubriques passent à la ligne au lieu de sortir du cadre. */
@media (min-width:721px){nav#cats{flex-wrap:wrap;overflow-x:visible}}

main{padding-block:28px 48px;display:grid;gap:32px}
.note{font-family:var(--mono);font-size:.75rem;color:var(--muted);background:var(--accent-soft);padding:8px 12px;border-radius:6px}

.une{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;cursor:pointer;text-decoration:none}
.une .img{aspect-ratio:16/10}
.une h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.1;margin:.3em 0;text-wrap:balance}
.une p{color:var(--muted);margin:0;max-width:60ch}
@media (max-width:720px){.une{grid-template-columns:1fr}}

.img{width:100%;max-width:100%;border-radius:10px;position:relative;overflow:hidden}
.img svg,.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.img span{z-index:1;text-shadow:0 1px 3px #0009;position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:.7rem;color:#fff;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.cat{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

h3.sec{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:28px 24px}
.card{display:grid;gap:8px;text-decoration:none;align-content:start}
.card .img{aspect-ratio:3/2}
.card h4{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.25;margin:0;text-wrap:balance}
.card:hover h4,.une:hover h2{color:var(--accent)}
.empty{color:var(--muted)}

article{max-width:68ch;margin:0 auto;display:grid;gap:14px}
article h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.08;margin:0;text-wrap:balance}
article .chapo{font-size:1.15rem;color:var(--muted);margin:0}
article .img{aspect-ratio:16/9}
article .txt p{margin:0 0 1em}
.back{justify-self:start;border:none;background:none;color:var(--accent);cursor:pointer;font-family:var(--display);font-weight:600;padding:0}

/* Rappel du jour : bandeau vert et or, même rendu en clair et en sombre */
.rappel{--rg:#0f4a35;--rg2:#0b3828;--gold:#d8b45a;--cream:#f7f1e1;background:radial-gradient(120% 140% at 100% 0%,#17644a 0%,var(--rg) 45%,var(--rg2) 100%);color:var(--cream);border-radius:14px;padding:28px clamp(18px,4vw,40px);display:grid;grid-template-columns:auto 1fr;gap:20px 36px;text-decoration:none;position:relative;overflow:hidden}
.rappel::after{content:"";position:absolute;inset:8px;border:1px solid #d8b45a55;border-radius:10px;pointer-events:none}
.rappel .when{display:grid;align-content:start;justify-items:center;text-align:center;gap:2px;padding:14px 18px;border:1.5px solid var(--gold);border-radius:60px 60px 10px 10px;min-width:120px}
.rappel .when b{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--gold)}
.rappel .when small{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.rappel .when hr{width:60%;border:0;border-top:1px solid #d8b45a88;margin:6px 0}
.rappel .eyebrow{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.rappel h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.1rem);margin:.15em 0 .5em;line-height:1.1}
.ar{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;direction:rtl;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.6;color:var(--gold)}
.rappel .fr{font-style:italic;margin:0}
.rappel .ref{font-family:var(--mono);font-size:.72rem;opacity:.8}
.rappel .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px;align-items:start}
.rappel .cols>div{min-width:0}
.rappel .more{font-family:var(--display);font-weight:600;color:var(--gold)}
.rappel:hover .more{text-decoration:underline}
@media (max-width:720px){.rappel{grid-template-columns:1fr}.rappel .when{justify-self:start;border-radius:10px;grid-auto-flow:column;align-items:baseline;gap:8px;padding:8px 14px}.rappel .when hr{display:none}.rappel .when b{font-size:1.6rem}.rappel .cols{grid-template-columns:1fr}}
.rp{display:grid;gap:18px}
.rp section{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--surface);display:grid;gap:8px}
.rp section.dark{background:#0f4a35;color:#f7f1e1;border-color:#0f4a35;text-align:center}
.rp h2{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0}
.rp .dark h2{color:#d8b45a}
.rp blockquote{margin:0;font-size:1.2rem;line-height:1.5}
.rp .ar{color:var(--accent)}.rp .dark .ar{color:#d8b45a}
.rp .src{font-family:var(--mono);font-size:.75rem;color:var(--muted)}.rp .dark .src{color:#d8cfb4}
.vid{margin:0;background:#0d1114;border-radius:12px;padding:12px;display:grid;justify-items:center;gap:8px}
.vid video{width:100%;max-width:420px;max-height:78vh;border-radius:8px;background:#000;display:block}
.vids{display:grid;gap:12px}
@media (min-width:720px){.vids{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.vid figcaption{font-family:var(--mono);font-size:.72rem;color:#b9c3ca;text-transform:uppercase;letter-spacing:.08em}
.play{position:absolute;z-index:1;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:1rem;padding-left:3px;border:2px solid #fff}
.duo{display:grid;grid-template-columns:1fr 1.25fr;gap:24px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
.panel h3 em{font-style:normal;color:var(--sun)}
.panel .sub{margin:0;color:var(--muted);font-size:.92rem}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.panel .fine{margin:0;font-size:.78rem;color:var(--muted)}
.sel select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--display);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.prieres li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.prieres li b{font-family:var(--mono);font-size:1.05rem}
.prieres li.lev{color:var(--muted);font-size:.9rem}
.prieres li.next{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dates li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.dates li:first-child{border-top:0}
.dates .cd{display:grid;justify-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 0;line-height:1}
.dates .cd b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.dates .cd small{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.dates .dt{display:grid;min-width:0}
.dates .dt span{font-size:.85rem;color:var(--muted)}
.dates .tag{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
@media (max-width:420px){.dates .tag{display:none}.dates li{grid-template-columns:56px 1fr}}
.lnk{font-family:var(--display);font-weight:600;color:var(--accent);text-decoration:none;font-size:.92rem}
.lnk:hover{text-decoration:underline}
nav .mqbtn{border-color:var(--sun)}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.share span{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.share a,.share button{font-family:var(--display);font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:999px;text-decoration:none;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.share .wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.share .fb{background:#2d5fc4;border-color:#2d5fc4;color:#fff}
.cpin{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:0;flex:1 1 200px}
.filtres{display:flex;flex-wrap:wrap;gap:6px}
.filtres button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.85rem}
.filtres button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates li.vide{display:block;color:var(--muted);border:0}
.dates .obs{font-style:normal;font-size:.84rem;line-height:1.45;margin-top:6px;padding:6px 10px;border-left:3px solid var(--sun);background:var(--accent-soft);border-radius:0 6px 6px 0}
.dates .obs b{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500;color:var(--accent)}
.dates li{grid-template-columns:64px 1fr auto}
.dates .act{display:grid;gap:6px;justify-items:end;align-content:center}
.suivre{font-family:var(--display);font-weight:600;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.suivre[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.dates .dt .fiab{font-size:.68rem;color:var(--muted)}
.fiab{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.03em;color:var(--muted);margin-top:3px}
.fiab i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.fiab.haut i{background:#2f9e5b}.fiab.moy i{background:var(--sun)}.fiab.bas i{background:#d9622b}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:8px;border-top:1px solid var(--line)}
.mq-hero{display:grid;gap:6px;padding-block:6px 4px}
.mq-hero h1{font-size:clamp(2rem,5.5vw,3.2rem)}
.mq-hero .by{margin:0;font-family:var(--mono);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mq-intro{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mq-intro section{min-width:0}
.mq-intro h2,.h2{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0 0 6px}
.h2{margin-top:10px}
.mq-intro p{margin:0}
@media (max-width:680px){.mq-intro{grid-template-columns:1fr}}
.etapes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:e;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.etapes li{counter-increment:e;padding:14px 16px;display:grid;gap:4px;align-content:start;border-left:1px solid var(--line);min-width:0}
.etapes li:first-child{border-left:0}
.etapes li b{font-family:var(--display);font-size:1.05rem}
.etapes li b::before{content:counter(e);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sun);color:#1d1a10;font-size:.75rem;margin-right:8px;vertical-align:2px}
.etapes li span{font-size:.88rem;color:var(--muted);line-height:1.45}
@media (max-width:680px){.etapes{grid-template-columns:1fr 1fr}.etapes li:nth-child(3){border-left:0}.etapes li:nth-child(n+3){border-top:1px solid var(--line)}}
.ask{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px;display:grid;gap:10px}
.ask label{font-family:var(--display);font-weight:800;font-size:1.3rem}
.ask input{width:100%;padding:12px 14px;border-radius:10px;border:0;font-size:1.05rem;background:var(--surface);color:var(--ink)}
.exemples{font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center;opacity:.95}
.exemples button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.82rem}
.mes{border-color:var(--sun)}
@media (max-width:480px){.dates li{grid-template-columns:52px 1fr}.dates .act{grid-column:2;justify-items:start;grid-auto-flow:column;justify-content:start}}
/* ===== Rubrique Mais quand ? : lignes cliquables, fiches et actualité des dates ===== */
[hidden]{display:none!important}
.dates li{position:relative}
.rowlink{position:absolute;inset:0;z-index:0;border-radius:8px}
.rowlink:focus-visible{outline:2px solid var(--accent)}
.dates .act{position:relative;z-index:1}
.dates li:hover strong{color:var(--accent)}
.dates .dt strong{font-family:var(--display);font-weight:600;line-height:1.25}
.majs{display:grid;gap:12px}
.majc{display:grid;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none}
.majc h4{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.25;margin:0;text-wrap:balance}
.majc p{margin:0;color:var(--muted);font-size:.92rem}
.majc:hover h4{color:var(--accent)}

.resol{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.resol .ok{width:24px;height:24px;border-radius:50%;background:#2f9e5b;color:#fff;display:grid;place-items:center;font-size:.8rem}

a.back{text-decoration:none}
.answer{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}

@media (max-width:560px){.answer{grid-template-columns:auto 1fr}.answer .suivre{grid-column:1/-1;justify-self:start}}
.pobs{margin:0;font-size:.92rem;line-height:1.5;padding:10px 14px;border-left:3px solid var(--sun);background:var(--accent-soft);border-radius:0 8px 8px 0}
.pobs b{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500;color:var(--accent)}
.blk{display:grid;gap:8px}
.blk h2{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0}
.srcs{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.95rem}
.srcs a{color:var(--accent)}
.hist{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px}

.partgrid{display:grid;gap:12px}

.partc{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-decoration:none}

.partc .lg{width:56px;height:56px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-weight:800;font-size:1.4rem;color:#14212b}

.partc .url{font-family:var(--mono);font-size:.72rem;color:var(--accent)}
.offre{display:grid;gap:12px;padding:0;margin:0;list-style:none}

footer .foot a{color:var(--accent);font-family:var(--display);font-weight:600}
/* ===== Vrai ou faux ? ===== */
.stamp{display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:5px 10px;border-radius:6px;border:2px solid currentColor;transform:rotate(-3deg);white-space:nowrap;background:var(--surface)}

.verdict p{margin:0;font-size:1.02rem}
@media (max-width:520px){.verdict{grid-template-columns:1fr}}
.pp{margin:0}
.preuves{margin:0;padding-left:18px;display:grid;gap:6px}
nav .vfbtn{border-color:#c8372d}

.conseils{list-style:none;counter-reset:c;margin:0;padding:0;display:grid;gap:14px}

.conseils strong{font-family:var(--display);font-weight:600;font-size:1.08rem}
.conseils p{margin:0;line-height:1.5}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.85rem}

<script>
const ARTICLES = [
 {"id":"fann-point-e-amitie-apres-les-pluies-le","cat":"Éducation","titre":"Fann-Point E-Amitié : après les pluies, le lycée Fadilou Mbacké et les écoles de la commune font le ménage","chapo":"Élèves, professeurs, parents et agents de Promoville se sont retrouvés ce samedi 17 octobre pour nettoyer le lycée franco-arabe Fadilou Mbacké, à Dakar. La plupart des écoles de la commune ont organisé une journée semblable.","date":"2026-10-17","min":1,"c":["#1d4e6b","#5aa2c8"],"texte":["Balais, gants et sacs-poubelle : ce samedi 17 octobre, le lycée franco-arabe Fadilou Mbacké, dans la commune de Fann-Point E-Amitié à Dakar, a fait sa grande toilette. À l'initiative du gouvernement scolaire, élèves, professeurs et parents d'élèves étaient conviés dès 9 heures pour une journée de nettoyage de l'établissement.","L'opération arrive après les fortes pluies du début du mois. Les inondations avaient touché de nombreuses écoles dans le pays, au point que le ministère de l'Éducation nationale avait repoussé la rentrée du 7 au 12 octobre. Feuilles, papiers et déchets s'étaient accumulés dans les cours et les salles de classe.","Dans les classes, les élèves, masqués et gantés, ont balayé les sols et ramassé les déchets entre les tables-bancs. Ils ont été épaulés par des agents de Promoville, reconnaissables à leurs gilets de sécurité, venus aider à remettre les salles en état.","Le lycée n'est pas un cas isolé. Selon l'association des parents d'élèves, la plupart des écoles de la commune de Fann-Point E-Amitié ont, elles aussi, organisé une journée de nettoiement pour effacer les traces de l'hivernage, notamment les écoles Ahmadou Bamba Mbakhane Diop 1, 2 et 3.","« Un cadre propre, un meilleur apprentissage ! » : c'est le message choisi par le gouvernement scolaire pour cette journée. Un rappel simple : on apprend mieux dans une classe propre et saine, et l'entretien de l'école est l'affaire de tous.","Une mobilisation qui mérite d'être reproduite ailleurs, alors que beaucoup d'écoles du pays se remettent encore des dégâts des pluies."],"sait":["La journée de nettoyage du lycée a eu lieu le samedi 17 octobre 2026, à partir de 9 heures.","Elle était organisée par le gouvernement scolaire, avec les élèves, les professeurs et les parents d'élèves.","Des agents de Promoville ont participé au nettoyage des salles de classe.","La plupart des écoles de la commune de Fann-Point E-Amitié ont organisé une journée de nettoiement, dont les écoles Ahmadou Bamba Mbakhane Diop 1, 2 et 3."],"srcTxt":["Photo : Association des parents d'élèves du lycée Fadilou Mbacké","Association des parents d'élèves du lycée Fadilou Mbacké","Affiche du gouvernement scolaire du lycée","Ministère de l'Éducation nationale : report de la rentrée au 12 octobre (communiqué du 6 octobre 2026)"],"photo":"images/articles/lycee-fadilou-mbacke-nettoyage.jpg","pos":"center 50%"},
 {"id":"joj-dakar-2026-a-deux-semaines-des-2","cat":"Sport","titre":"JOJ Dakar 2026 : à deux semaines des Jeux, la gendarmerie passe en revue son dispositif de sécurité","chapo":"Le général Martin Faye, Haut-commandant de la Gendarmerie nationale, a inspecté cette semaine les sites des Jeux olympiques de la jeunesse placés sous la responsabilité de ses unités, de l'aéroport au stade Abdoulaye Wade.","date":"2026-10-17","min":1,"c":["#1f6b3a","#e2a02b"],"texte":["À deux semaines de l'ouverture des Jeux olympiques de la jeunesse (JOJ) Dakar 2026, prévue le 31 octobre, la Gendarmerie nationale vérifie que tout est prêt. Son Haut-commandant, le général de division Martin Faye, a fait cette semaine le tour des sites dont la sécurité est confiée à ses unités.","La visite a commencé à l'aéroport, porte d'entrée des délégations. Elle s'est poursuivie au stade Abdoulaye Wade de Diamniadio, qui accueillera la cérémonie d'ouverture, puis au Village olympique, à la gare de Diamniadio, au Centre des expositions et au centre équestre. Selon plusieurs médias, le péage de Rufisque faisait aussi partie du parcours.","À chaque étape, les commandants d'unités ont présenté leur dispositif : surveillance des sites, coordination entre les services et maintien de l'ordre.","À la fin de sa tournée, le général Martin Faye a salué l'engagement des gendarmes mobilisés. Il leur a demandé de garder un haut niveau de vigilance et de discipline, pour que les Jeux se déroulent dans un environnement sûr et accueillant.","Les JOJ Dakar 2026 se tiendront du 31 octobre au 13 novembre. C'est la première fois qu'un événement olympique est organisé en Afrique."],"sait":["Le général Martin Faye, Haut-commandant de la Gendarmerie nationale, a inspecté les sites des JOJ confiés à la gendarmerie.","Sites visités : aéroport, stade Abdoulaye Wade, Village olympique, gare de Diamniadio, Centre des expositions, centre équestre (et le péage de Rufisque selon certains médias).","Les Jeux ont lieu du 31 octobre au 13 novembre 2026."],"saitPas":["Le nombre de gendarmes mobilisés pendant les Jeux.","Le jour exact de la visite : mercredi 14 octobre selon Le Soleil, jeudi 15 selon l'APS."],"srcTxt":["PressAfrik, Senegal7, Dakar92 (octobre 2026)"],"src":[{"n":"Le Soleil : le général Martin Faye inspecte le dispositif sécuritaire","u":"https://lesoleil.sn/actualites/sports/dakar2026/joj-dakar-2026-le-general-martin-faye-inspecte-le-dispositif-securitaire/"},{"n":"APS : le Haut-commandant évalue le dispositif sécuritaire de la Gendarmerie nationale","u":"https://aps.sn/dakar-2026-le-haut-commandant-evalue-le-dispositif-securitaire-de-la-gendarmerie-nationale/"}],"att":"joj","maj":"2026-10-17","photo":"images/articles/joj-dakar-2026-a-deux-semaines-des-2-mvc9fmqy.jpg"},
 {"id":"intelligence-artificielle-a-dakar-un-appel-a","cat":"Emploi","titre":"Intelligence artificielle : à Dakar, un appel à anticiper les changements dans le monde du travail","chapo":"Réunis jeudi à Dakar, des décideurs et des responsables des ressources humaines ont plaidé pour adapter les compétences et faire évoluer les règles face à l’arrivée de l’intelligence artificielle dans les entreprises.","date":"2026-10-16","min":1,"c":["#1d2f5c","#5a78b8"],"texte":["L'intelligence artificielle (IA) change déjà la façon de travailler, et il vaut mieux s'y préparer que la subir. C'est le message principal de la « Rencontre des décideurs Dakar 2026 », tenue ce jeudi 15 octobre dans la capitale sénégalaise.","L'événement était organisé par Skello, une plateforme de gestion des équipes, en partenariat avec Business France et avec le soutien de l'ambassade de France au Sénégal et en Gambie. Son thème : « Construire les ressources humaines de demain : innovations RH & IA, performance et impact ».","La rencontre s'est tenue sous la présidence de Me Abdoulaye Tine, ministre-conseiller et porte-parole de la Présidence de la République. Selon l'APS, un plaidoyer a été fait pour que le cadre juridique évolue afin d'accompagner ces changements et d'en limiter les risques. Me Abdoulaye Tine a proposé la création d'une commission réunissant plusieurs disciplines pour réfléchir à l'encadrement de cette technologie.","Plusieurs tâches des services RH pourraient être automatisées prochainement : l'administration du personnel, la gestion de la paie, le recrutement, la formation et l'analyse des données. Pour Pape Mactar Guèye, représentant de Skello au Sénégal, il faut donc adapter les compétences et redéfinir certains postes pour limiter les risques. Selon lui, l'automatisation peut aussi libérer du temps aux responsables RH pour mieux s'occuper des personnes, de la formation des équipes et du développement des compétences.","Les échanges ont également porté sur l'emploi des jeunes et sur la protection des données personnelles. Une idée est revenue : l'IA ne remplacera pas forcément l'humain, mais ceux qui ne sauront pas utiliser ces outils risquent d'être dépassés."],"sait":["La rencontre a eu lieu le jeudi 15 octobre 2026 à Dakar.","Elle était organisée par Skello avec Business France, avec le soutien de l'ambassade de France.","Elle était présidée par Me Abdoulaye Tine, porte-parole de la Présidence.","La paie, le recrutement et l'administration du personnel font partie des tâches jugées automatisables.","Une commission sur l'encadrement de l'IA a été proposée."],"saitPas":["Si la commission proposée sera effectivement créée, et quand.","Quelles règles précises pourraient être adoptées au Sénégal.","Combien d'emplois pourraient être concernés."],"srcTxt":["Agence de presse sénégalaise (APS), reprise par MSN, octobre 2026","APA News, « Sénégal : l'IA au cœur des débats sur l'avenir des ressources humaines »","SenePlus, « Sénégal, l'intelligence artificielle bouscule les métiers des ressources humaines »"],"photo":"images/articles/intelligence-artificielle-a-dakar-un-appel-a.jpg"},
 {"id":"le-blanc-et-le-vert-les-couleurs","cat":"Spiritualité","titre":"Le blanc et le vert : les couleurs portées et recommandées par le Prophète ﷺ","chapo":"Le blanc, le Prophète ﷺ l'a recommandé à ses compagnons ; le vert, il l'a porté, et le Coran le décrit comme une couleur du Paradis. Ce que disent les textes.","date":"2026-10-17","min":1,"c":["#0f5b45","#d9b45a"],"texte":["Le Prophète ﷺ a recommandé une couleur à ses compagnons : le blanc. Selon Ibn 'Abbâs, il a dit : « Portez des vêtements blancs, car ils sont parmi vos meilleurs vêtements, et enveloppez-y vos morts. » Dans une autre version rapportée par Samura ibn Jundub, il précise : « Portez des vêtements blancs, car ils sont plus purs et plus beaux. »","Le blanc accompagne aussi des moments importants. Lorsque l'ange Jibrîl est venu enseigner la religion aux compagnons, ceux-ci l'ont décrit comme un homme « aux vêtements d'une blancheur éclatante ». Et à sa mort, le Prophète ﷺ a été enveloppé dans trois étoffes blanches du Yémen, selon 'Aïcha.","Le vert, lui, est la couleur que le Prophète ﷺ a été vu porter. Abû Rimtha raconte : « J'ai vu le Prophète ﷺ, il portait deux vêtements verts. »","Le Coran associe aussi le vert au Paradis. Ses habitants « porteront des vêtements verts de soie fine et de brocart » (sourate Al-Kahf, verset 31 ; sourate Al-Insân, verset 21), et ils seront « accoudés sur des coussins verts » (sourate Ar-Rahmân, verset 76).","Porter du blanc est une recommandation, pas une obligation : les autres couleurs restent permises. Mais choisir un vêtement blanc et propre, pour la prière du vendredi ou un jour de fête, c'est suivre un conseil du Prophète ﷺ.","Qu'Allah nous accorde de suivre sa Sunna, jusque dans les petits gestes du quotidien."],"srcTxt":["Hadith d'Ibn 'Abbâs sur le blanc : Abû Dâwûd (n° 4061), At-Tirmidhî (n° 994)","Hadith de Samura ibn Jundub : At-Tirmidhî (n° 2810), An-Nasâ'î (n° 1896)","Hadith de Jibrîl : Muslim (n° 8)","Linceul du Prophète ﷺ, rapporté par 'Aïcha : Al-Bukhârî (n° 1264), Muslim (n° 941)","Hadith d'Abû Rimtha sur les vêtements verts : Abû Dâwûd (n° 4065), At-Tirmidhî (n° 2812)","Coran : sourate 18, verset 31 ; sourate 76, verset 21 ; sourate 55, verset 76"],"rappelDu":"2026-10-17","maj":"2026-10-17","photo":"images/articles/le-blanc-et-le-vert-les-couleurs-mvc9nsv1.jpg"},
 {"id":"dakar-la-priere-de-takussan-avancee-a","cat":"Spiritualité","titre":"Dakar : la prière de Takussan avancée à 16 h 45 dans la plupart des mosquées","chapo":"Depuis le jeudi 15 octobre, la prière de l'après-midi est fixée à 16 h 45 au lieu de 17 h dans la plupart des mosquées de Dakar. Un changement à prendre en compte dans l'organisation de la journée.","date":"2026-10-15","min":1,"c":["#0f5b45","#d9b45a"],"texte":["Les fidèles de Dakar doivent régler leur montre. Depuis le jeudi 15 octobre 2026, la prière de Takussan ('asr, la prière de l'après-midi) est célébrée à 16 h 45 dans la plupart des mosquées de la capitale, contre 17 h jusqu'ici.","L'information a été diffusée par un message relayé sur WhatsApp, qui invite les fidèles à « tenir compte de ce nouvel horaire dans l'organisation de nos activités ».","Ce changement suit le rythme des saisons. À l'approche de l'hiver, les journées raccourcissent et l'heure de la prière de l'après-midi avance. Les mosquées ajustent donc l'horaire de la prière en commun pour rester dans le temps de la prière.","Pour les travailleurs, les élèves et tous ceux qui organisent leur après-midi autour de la prière, ce quart d'heure compte : rendez-vous, sorties de bureau et trajets sont à prévoir un peu plus tôt.","L'horaire peut varier d'une mosquée à l'autre. En cas de doute, renseignez-vous auprès de l'imam ou du comité de votre mosquée."],"sait":["Depuis le 15 octobre 2026, la prière de Takussan est fixée à 16 h 45 dans la plupart des mosquées de Dakar.","L'horaire précédent était 17 h."],"saitPas":["La liste exacte des mosquées concernées.","Jusqu'à quand cet horaire restera en vigueur."],"srcTxt":["Annonce diffusée à la mosquée de Fass Delorme, 15 octobre 2026"],"photo":"images/articles/dakar-la-priere-de-takussan-avancee-a.jpg"},
 {"id":"vendredi-sept-recommandations-du-prophete-pour-bien","cat":"Spiritualité","titre":"Vendredi : sept recommandations du Prophète ﷺ pour bien vivre le jour de la Jumu'a","chapo":"Le vendredi est le meilleur jour de la semaine. Bain, parfum, prière, lecture de la sourate al-Kahf, invocations : voici les pratiques recommandées, avec leurs sources.","date":"2026-10-15","min":2,"c":["#0f5b45","#d9b45a"],"texte":["Le Prophète ﷺ a dit : « Le meilleur jour sur lequel le soleil se soit levé est le vendredi. » (Rapporté par Muslim.) Ce jour a ses pratiques propres. En voici sept, à garder en tête pour demain.","1. Faire le grand bain (ghusl). « Le bain du vendredi est un devoir pour tout pubère. » (Al-Bukhârî et Muslim.) Il se fait avant de partir à la prière.","2. Se parfumer, se brosser les dents et porter ses plus beaux habits. Le Prophète ﷺ a associé au bain du vendredi l'usage du siwak et du parfum, chacun selon ses moyens. (Al-Bukhârî et Muslim.)","3. Partir tôt à la mosquée. Celui qui s'y rend à la première heure a la récompense de celui qui offre un chameau, puis une vache, un bélier, une poule, et enfin un œuf pour les derniers arrivés. Quand l'imam sort, les anges ferment leurs registres pour écouter le sermon. (Al-Bukhârî et Muslim.)","4. Écouter le sermon en silence. « Si tu dis à ton voisin \"Tais-toi !\" pendant que l'imam prêche, tu as commis une futilité. » (Al-Bukhârî et Muslim.) On évite aussi d'enjamber les fidèles assis pour avancer.","5. Lire la sourate al-Kahf. « Celui qui lit la sourate al-Kahf le jour du vendredi, une lumière l'éclairera entre les deux vendredis. » (Al-Hâkim et al-Bayhaqî, authentifié par al-Albânî.) La lecture peut se faire du coucher du soleil jeudi jusqu'au coucher du soleil vendredi.","6. Multiplier les prières sur le Prophète ﷺ. « Multipliez les prières sur moi le jour du vendredi, car vos prières me sont présentées. » (Abû Dâwûd et an-Nasâ'î.)","7. Rechercher l'heure de l'exaucement. « Il y a le vendredi une heure où aucun musulman ne demande un bien à Allah sans qu'Il le lui accorde. » (Al-Bukhârî et Muslim.) Selon un autre hadith, on la recherche particulièrement à la dernière heure après la prière du 'asr. (Abû Dâwûd.)","À éviter : jeûner le vendredi seul, sans jeûner aussi la veille ou le lendemain, sauf si ce jour tombe sur un jeûne habituel. (Al-Bukhârî et Muslim.)","Jumu'a mubârak à tous nos lecteurs."],"srcTxt":["Sahîh al-Bukhârî et Sahîh Muslim (bain, parfum, arrivée à la mosquée, silence pendant le sermon, heure de l'exaucement, jeûne)","Sahîh Muslim (meilleur jour de la semaine)","Sunan Abî Dâwûd et Sunan an-Nasâ'î (prières sur le Prophète ﷺ, heure après le 'asr)","Al-Hâkim et al-Bayhaqî, authentifié par al-Albânî dans Sahîh al-Jâmi' (sourate al-Kahf)"],"maj":"2026-10-15","photo":"images/articles/vendredi-sept-recommandations-du-prophete-pour-bien-mva1dacd.jpg","rappelDu":"2026-10-16"},
 {"id":"joj-dakar-2026-a-deux-semaines-des","cat":"Sport","titre":"JOJ Dakar 2026 : à deux semaines des Jeux, les abords de la piscine olympique du Point E encore en chantier","chapo":"Pelleteuses, tas de terre, eau stagnante : à l'approche de l'ouverture des Jeux le 31 octobre, les finitions se poursuivent et plusieurs rues du Point E restent dégradées.","date":"2026-10-15","min":1,"c":["#1f6b3a","#e2a02b"],"texte":["Les Jeux olympiques de la jeunesse (JOJ) Dakar 2026 s'ouvrent le 31 octobre et se tiendront jusqu'au 13 novembre. À un peu plus de deux semaines de l'événement, les abords de la piscine olympique du Point E offrent encore le visage d'un chantier.","Ce mercredi 15 octobre, une pelleteuse était à l'œuvre au milieu d'une rue éventrée. Des tas de terre et de gravier occupent la chaussée, des regards en béton attendent d'être posés, et les piétons se frayent un passage entre les déblais.","Plus loin, l'eau stagne sur des rues sablonneuses, obligeant les passants à longer les murs. Sur certaines voies goudronnées, le sable des chantiers voisins recouvre le bitume. Des immeubles en construction bordent plusieurs de ces rues, avec leurs palissades et leurs tas de gravier.","Les travaux de finition se poursuivent donc dans un quartier qui verra passer athlètes, délégations et public pendant les Jeux. Reste à savoir si les routes seront remises en état d'ici le 31 octobre.","Nous suivons ce chantier et mettrons cet article à jour dès que les autorités ou le comité d'organisation communiqueront un calendrier de fin des travaux."],"sait":["Les JOJ Dakar 2026 se tiennent du 31 octobre au 13 novembre.","Le 15 octobre, des travaux étaient encore en cours aux abords de la piscine olympique du Point E.","Plusieurs rues du quartier sont dégradées : déblais, eau stagnante, sable sur la chaussée."],"saitPas":["La date de fin des travaux de voirie autour de la piscine olympique.","Si les rues seront remises en état avant l'ouverture des Jeux, le 31 octobre."],"srcTxt":["Photo et vidéos : Mais quand ?, 15 octobre 2026","Constat de la rédaction sur place, Point E, 15 octobre 2026"],"photo":"images/articles/joj-dakar-2026-a-deux-semaines-des-mv9v8bae.jpg","maj":"2026-10-15"},
 {"id":"m-apollo","photo":"images/apollo.jpg","pos":"center 50%","src":["apollo1","apollo2"],"srcTxt":["Infographie de prévention transmise à la rédaction"],"cat":"Santé","titre":"Conjonctivite « Apollo » : cinq règles pour se protéger à l'école et à la maison","chapo":"Des médecins signalent une hausse des cas sur l'axe Dakar-Touba-Kaolack au moment de la rentrée. Voici les gestes simples pour limiter la contagion.","date":"2026-10-13","min":3,"c":["#7a1f2b","#e2a02b"],"sait":["Des médecins signalent une hausse des cas de conjonctivite, appelée « Apollo », sur l'axe Dakar-Touba-Kaolack, juste avant la rentrée scolaire.","À Touba, une ophtalmologue a fait état de 15 à 20 cas critiques en deux semaines, contre 2 à 5 en temps normal.","La maladie se transmet par les sécrétions des yeux et les objets touchés (mains, téléphones, poignées, serviettes, mouchoirs). Regarder une personne malade ne transmet pas la maladie."],"saitPas":["L'ampleur réelle à l'échelle nationale : le ministère de la Santé indiquait le 10 octobre n'avoir reçu aucun signalement officiel.","Si des mesures particulières seront prises dans les écoles."],"texte":["Yeux rouges, démangeaisons, larmoiements, paupières collées au réveil : ce sont les signes typiques de la conjonctivite, que beaucoup appellent « Apollo ». Elle est très contagieuse, surtout dans les lieux où l'on vit en groupe, comme les écoles, au moment où plus de 4 millions d'élèves reprennent les cours.","Voici cinq règles simples pour se protéger et protéger les autres, avec leur traduction en wolof."],"conseils":[["Se laver les mains régulièrement","Avec de l'eau et du savon, surtout en rentrant à la maison et avant de toucher son visage. Wolof : « Damal laab sa loxo ci savon, wàcc ci yoon. »"],["Ne pas toucher ni frotter ses yeux","Les mains transportent le virus d'un œil à l'autre et d'une personne à l'autre. Wolof : « Bul dóor sa bët ak sa loxo. »"],["Utiliser sa propre serviette","Ne partagez ni serviettes, ni mouchoirs, ni maquillage. Wolof : « Jëfandikoo sa serviette bu bopp, bul coowalé. »"],["Rester à la maison si l'on est malade","Un enfant malade contamine vite sa classe : mieux vaut quelques jours de repos. Wolof : « Desal ci kër bi nga fee baré. »"],["Protéger ses yeux","Des lunettes de soleil peuvent soulager les yeux sensibles à la lumière et limiter les contacts avec les mains. Wolof : « Sol lunettes bi ngir aaral sa bët ci bëj. »"]],"apres":["Dès les premiers signes, consultez un professionnel de santé ou rendez-vous au poste de santé le plus proche. N'utilisez pas de collyre ou de remède sans avis médical : certains produits peuvent aggraver l'inflammation.","Les traductions en wolof proviennent de l'infographie de prévention qui circule ; signalez-nous toute correction."]},
 {"id":"m-meteo-mer","photo":"images/orage-mer.jpg","pos":"center 45%","srcTxt":["D'après une publication pédagogique sur la météo transmise à la rédaction","Photo : ciel orageux au Sénégal, transmise à la rédaction"],"cat":"Météo","titre":"Le saviez-vous ? Pourquoi certains orages passent à côté de Dakar, Mbour ou Saint-Louis","chapo":"Partis de l'est du Sahel, des systèmes orageux traversent le pays mais déversent leurs pluies en mer. Explications, et une leçon qui dépasse la météo.","date":"2026-10-14","min":3,"c":["#3a4652","#e2a02b"],"sait":["Pendant l'hivernage, de nombreux systèmes orageux naissent ou s'organisent à l'est du Sahel et se déplacent d'est en ouest jusqu'au Sénégal.","À l'approche du littoral, les vents (notamment de secteur nord) et l'état de l'atmosphère peuvent modifier leur trajectoire et leur organisation.","Une perturbation qui devait arroser la côte peut alors concentrer ses pluies, ses rafales et parfois une forte houle en mer.","Au-dessus des eaux chaudes de l'Atlantique, certains de ces systèmes peuvent s'intensifier jusqu'au stade de tempête tropicale, voire de cyclone."],"texte":["Vous avez peut-être déjà vu un ciel menaçant arriver de l'est, des éclairs à l'horizon… puis rien, ou presque, à Dakar, Mbour ou Saint-Louis. Ce n'est pas une erreur de prévision au sens strict : c'est l'une des grandes difficultés de la météo en zone côtière.","Les systèmes orageux qui traversent le Sahel progressent vers l'ouest. Au moment d'atteindre la côte, ils rencontrent des conditions différentes : des vents de direction et de force variables, et une atmosphère dont la structure (température, humidité) change entre la terre et l'océan. Un seul paramètre qui bascule suffit parfois à déplacer le cœur de l'orage de quelques dizaines de kilomètres, vers le large.","Résultat : les fortes pluies, les vents violents et la houle se produisent en mer, au détriment des côtes qui attendaient la pluie, et au risque des pêcheurs et des navigateurs.","Certains de ces systèmes, en poursuivant leur route au-dessus d'un océan chaud, trouvent des conditions favorables pour s'organiser davantage. C'est ainsi que naissent une partie des tempêtes tropicales et des cyclones de l'Atlantique, parfois à quelques centaines de kilomètres seulement de nos côtes.","C'est pourquoi les prévisions sont mises à jour plusieurs fois par jour : la veille météorologique permet d'affiner le scénario et d'alerter à temps, surtout ceux qui vont en mer.","La leçon dépasse la météo. Comme le malade qui suit son bilan de santé, le sportif qui adapte son entraînement ou le père de famille qui réajuste son budget, chacun doit savoir réévaluer ses plans. Alors que l'hivernage touche à sa fin, l'atmosphère rappelle que demain peut toujours réserver des surprises."],"apres":["Pêcheurs, navigateurs, voyageurs : avant de prendre la mer, consultez les derniers bulletins et avis de l'ANACIM, le service météorologique national, et respectez les alertes de houle et de vents forts."]},
 {"id":"m-hommes-vc","photo":"images/homme-chambre.jpg","pos":"60% 55%","src":["pamj","ansd"],"srcTxt":["Soumah M. M. et al., « Les violences conjugales à Dakar », Pan African Medical Journal, 2015 ; 22:182","Photo d'illustration transmise à la rédaction"],"cat":"Société","titre":"Violences conjugales : les hommes aussi, un tabou peu documenté au Sénégal","chapo":"Une étude menée à Dakar a recensé presque autant d'hommes que de femmes parmi les victimes. Mais la honte et le « soutoura » poussent la plupart à se taire.","date":"2026-10-13","min":3,"c":["#2b2f3a","#e2a02b"],"sait":["Une étude publiée en 2015 dans le Pan African Medical Journal a interrogé 161 personnes en couple à Dakar (hôpitaux Aristide Le Dantec et Fann, et visites à domicile), entre décembre 2012 et janvier 2013.","Sur ces 161 personnes, 60 se sont déclarées victimes de violences conjugales : 31 femmes (51,7 %) et 29 hommes (48,3 %).","Les violences les plus fréquentes relevées étaient physiques (coups de poing, coups de pied, objets à portée de main), mais aussi le contrôle de l'argent et du temps, les menaces, les humiliations et les insultes.","L'enquête nationale de référence de l'ANSD, publiée fin 2025, porte sur les violences faites aux femmes : 3 femmes sur 10 déclarent en avoir subi au cours des 12 mois précédents."],"saitPas":["Combien d'hommes sont concernés à l'échelle du pays : aucune enquête nationale ne mesure les violences conjugales subies par les hommes.","Si les chiffres de l'étude de Dakar sont représentatifs : les auteurs la présentent comme une étude préliminaire, sur un petit échantillon, et signalent la réticence des participants à répondre."],"texte":["Les violences conjugales subies par les hommes restent un sujet peu étudié au Sénégal et largement sous-estimé. Physiques, verbales ou psychologiques, elles sont très rarement signalées à la police, à la gendarmerie ou aux associations.","La raison principale tient à la honte et à la peur du ridicule. Dans une société où l'homme est censé être fort et chef de famille, se dire victime de sa conjointe reste difficile à avouer. Le poids du « soutoura », la discrétion, pousse aussi à régler les conflits en famille, à l'amiable, plutôt que devant la justice.","Les données sont rares. L'étude dakaroise publiée en 2015 montre que les hommes peuvent aussi être exposés à des violences au sein du couple : parmi les 60 victimes identifiées, 29 étaient des hommes. Les auteurs relèvent des facteurs de risque liés au jeune âge, aux jeunes couples, à la précarité et aux inégalités, et concluent que la prise en charge des victimes et la prévention restent insuffisantes.","Ces chiffres ne permettent pas de dire que les hommes sont autant touchés que les femmes à l'échelle du pays. Les enquêtes officielles, centrées sur les violences faites aux femmes et aux filles, montrent qu'elles constituent la grande majorité des victimes recensées. Elles rappellent surtout qu'aucune victime ne devrait rester invisible.","Il existe par ailleurs très peu de cellules d'écoute ou de lieux d'accueil pensés pour accompagner les hommes victimes de violences domestiques."],"apres":["Une victime, homme ou femme, peut porter plainte auprès de la police ou de la gendarmerie, et faire constater ses blessures par un médecin, en demandant un certificat médical.","Vous êtes concerné ou vous travaillez sur ce sujet (association, médecin, juriste) ? Écrivez-nous : nous voulons documenter cette réalité avec des témoignages et des chiffres vérifiés."]},
 {"id":"m-president","photo":"images/president.jpg","pos":"center 30%","srcTxt":["Message publié sur la page Facebook officielle du président Bassirou Diomaye Faye, le 12 octobre 2026","Photo : page Facebook officielle du président de la République"],"cat":"Éducation","titre":"Rentrée scolaire : le message du président Diomaye Faye aux élèves, aux enseignants et aux parents","chapo":"« C'est à l'école que le Sénégal de demain prend forme », a écrit le chef de l'État le jour de la reprise des cours.","date":"2026-10-12","min":2,"c":["#0b4f6e","#e2a02b"],"texte":["Le jour de la rentrée, le lundi 12 octobre 2026, le président de la République Bassirou Diomaye Faye a adressé un message aux élèves, aux enseignants et aux parents sur sa page Facebook officielle. Le voici en intégralité :","« Ce matin, nos enfants ont repris le chemin de l'école. À chacune et à chacun, je souhaite une belle et fructueuse année scolaire. »","« Aux enseignants qui les accueillent aujourd'hui, j'exprime ma reconnaissance pour leur engagement quotidien au service de la Nation. Aux parents, qui ont fait tant d'efforts pour préparer cette rentrée, je dis toute ma considération. »","« C'est à l'école que le Sénégal de demain prend forme. L'État continue d'y investir pour que chaque enfant, où qu'il vive, apprenne dans de bonnes conditions et ait sa chance. »","« Chers élèves, soyez curieux, travaillez avec sérieux, respectez vos maîtres et vos camarades. Le pays compte sur vous, et je crois en vous. Bonne rentrée à toutes et à tous. »","Cette rentrée avait été reportée du 7 au 12 octobre en raison des inondations, pour laisser le temps de remettre en état les établissements touchés."]},
 {"id":"m-connect","photo":"images/connect.jpg","pos":"center 35%","cta":{"t":"Remplir le formulaire de candidature Connect'Emploi 2026","u":"https://forcen.jotform.com/262784400500550"},"srcTxt":["Formulaire officiel de candidature Connect'Emploi 2026 (forcen.jotform.com), consulté le 13 octobre 2026","Photo d'illustration : stand Force-N lors d'un précédent événement, transmise à la rédaction"],"cat":"Emploi","titre":"Connect'Emploi 2026 : les candidatures sont ouvertes pour rencontrer des entreprises","chapo":"Demandeurs d'emploi, jeunes diplômés, étudiants ou personnes en reconversion peuvent s'inscrire pour participer au salon, au Grand Théâtre de Dakar ou en ligne.","date":"2026-10-13","min":3,"c":["#1d3d5c","#e2a02b"],"sait":["Un formulaire de candidature « participant » au salon Connect'Emploi 2026 est en ligne, sur un compte de formulaires au nom de Force-N.","Le salon se tient en présentiel au Grand Théâtre de Dakar et en ligne : on peut choisir l'un, l'autre ou les deux.","Le formulaire est ouvert aux niveaux du BFEM au doctorat, à toutes les régions du Sénégal et aux personnes résidant à l'étranger.","Un CV au format PDF, d'une à deux pages, est demandé."],"saitPas":["Les dates du salon et la date limite d'inscription : elles ne figurent pas sur le formulaire.","La liste des entreprises participantes et le nombre d'offres proposées."],"texte":["Les candidatures sont ouvertes pour participer au salon Connect'Emploi 2026. Le formulaire en ligne doit permettre aux organisateurs d'« identifier rapidement » les profils qui correspondent aux opportunités proposées par les entreprises participantes, et de mettre les candidats en relation avec elles.","Le salon s'adresse à un large public : demandeurs d'emploi, jeunes diplômés, étudiants, salariés, entrepreneurs et personnes en reconversion, du niveau BFEM au doctorat. Les candidats peuvent y participer en présentiel au Grand Théâtre de Dakar, en ligne, ou les deux. Le formulaire prend aussi en compte les personnes en situation de handicap, réfugiées ou déplacées."],"conseils":[["Préparez votre CV en PDF","Une à deux pages maximum, au format PDF uniquement. Relisez-le et vérifiez que votre numéro de téléphone et votre e-mail sont à jour."],["Rassemblez vos informations","Le formulaire demande votre identité, votre région et votre ville, votre niveau et domaine d'études, vos compétences, votre expérience et le poste que vous recherchez."],["Soyez précis sur le poste recherché","Indiquez clairement le type d'opportunité (emploi, stage…), le poste visé et les régions où vous êtes disponible : c'est ce qui sert à vous mettre en relation avec les entreprises."],["Choisissez votre mode de participation","Présentiel au Grand Théâtre de Dakar, en ligne, ou les deux. Si vous êtes hors de Dakar, la participation en ligne vous ouvre aussi des opportunités."],["Méfiez-vous des faux intermédiaires","Ne payez jamais pour « réserver » une place ou obtenir un entretien. Utilisez uniquement le lien officiel du formulaire."]],"apres":["Nous ajouterons les dates du salon dans la rubrique Mais quand ? dès qu'elles seront annoncées."]},
 {"id":"m-parente","photo":"images/articles/m-parente-mva3a3fz.jpg","pos":"center 45%","cat":"Spiritualité","srcTxt":["Photo d'illustration transmise à la rédaction","Hadith rapporté par At-Tirmidhî (1979), jugé authentique par Al-Albânî"],"titre":"Maintenir les liens de parenté, une source de bénédictions","chapo":"Un hadith rappelle ce que l'on gagne à rester proche de sa famille.","date":"2026-10-13","min":1,"c":["#3a2a10","#e2a02b"],"texte":["Le Messager d'Allah ﷺ a dit : « Maintenir les liens de parenté est une cause d'amour dans la famille, d'enrichissement des biens et de prolongation de la durée de vie. »","Rendre visite à ses proches, prendre de leurs nouvelles, les aider quand ils sont dans le besoin, régler les brouilles : ces gestes simples entretiennent la famille et, selon ce hadith, attirent la bénédiction sur nos biens et sur notre vie.","Pourquoi ne pas appeler aujourd'hui un parent dont vous n'avez pas eu de nouvelles depuis longtemps ?"],"maj":"2026-10-15"},
 {"id":"m-hypocrite","photo":"images/masque.jpg","pos":"center 40%","cat":"Spiritualité","srcTxt":["Photo d'illustration transmise à la rédaction","Hadith rapporté par Al-Boukhârî (34) et Mouslim (58)"],"titre":"Les quatre caractéristiques de l'hypocrite","chapo":"Un hadith qui invite chacun à surveiller sa parole, ses engagements et ses colères.","date":"2026-10-13","min":2,"c":["#2b2410","#e2a02b"],"texte":["D'après 'Abd Allâh ibn 'Amr (qu'Allah les agrée), le Prophète ﷺ a dit : « Quatre caractéristiques : celui qui les possède toutes est un hypocrite accompli ; celui qui en possède une possède une caractéristique de l'hypocrisie jusqu'à ce qu'il l'abandonne. »"],"conseils":[["Lorsqu'il parle, il ment","La parole engage : la sincérité est le premier signe de la foi."],["Lorsqu'il conclut un pacte, il trahit","Respecter un accord, même modeste, c'est préserver la confiance entre les gens."],["Lorsqu'il promet, il manque à sa promesse","Mieux vaut promettre peu et tenir, que promettre beaucoup et décevoir."],["Lorsqu'il se dispute, il dépasse les limites","Le désaccord n'autorise ni l'insulte ni l'injustice."]],"apres":["Ce hadith n'est pas fait pour juger les autres, mais pour s'examiner soi-même et corriger ses propres défauts."]},
 {"id":"m-envie","photo":"images/mains-levees.jpg","pos":"center 50%","cat":"Spiritualité","srcTxt":["Photo d'illustration transmise à la rédaction","Hadith rapporté par Al-Boukhârî (7141) et Mouslim (815)"],"titre":"L'envie n'est permise que dans deux cas","chapo":"Désirer le bien qu'Allah a donné à un autre, sans lui souhaiter de le perdre : c'est l'envie louable.","date":"2026-10-13","min":1,"c":["#0f4a35","#e2a02b"],"texte":["Le Messager d'Allah ﷺ a dit : « L'envie n'est permise que dans deux cas : un homme à qui Allah a enseigné le Coran et qui le récite durant la nuit et le jour, et un homme à qui Allah a donné des richesses qu'il dépense dans le bien durant la nuit et le jour. »","L'envie dont il est question ici, que les savants appellent ghibta, consiste à souhaiter avoir le même bien que l'autre, sans désirer qu'il le perde. Elle se distingue de la jalousie blâmable, qui souhaite la disparition du bienfait chez autrui.","Ce hadith oriente nos ambitions vers deux choses : la connaissance et la pratique du Coran, et la richesse mise au service du bien."]},
 {"id":"m-rentree","photo":"images/rentree.jpg","pos":"center 30%","src":["rentree","revue12"],"cat":"Éducation","titre":"Rentrée scolaire : plus de 4 millions d'élèves reprennent les cours ce lundi","chapo":"Reportée d'une semaine à cause des inondations, la rentrée a lieu ce lundi 12 octobre sur tout le territoire.","date":"2026-10-12","min":2,"c":["#0b4f6e","#3a8fb7"],"sait":["Les cours devaient commencer le mercredi 7 octobre 2026.","Le mardi 6 octobre, le ministère de l'Éducation nationale les a reportés au lundi 12 octobre, sur l'ensemble du territoire.","Le report est dû aux intempéries : il fallait assurer la sécurité des élèves et nettoyer, désinfecter et remettre en état les établissements touchés.","Plus de 4 millions d'élèves sont concernés par cette rentrée 2026-2027."],"saitPas":["Le nombre d'écoles sinistrées qui ne sont pas encore prêtes à accueillir les élèves.","Les aménagements prévus pour les établissements concernés par les JOJ Dakar 2026 (à partir du 31 octobre)."],"texte":["La rentrée des classes 2026-2027 a lieu ce lundi 12 octobre dans tout le Sénégal. Initialement prévue le mercredi 7 octobre, elle avait été reportée par le ministère de l'Éducation nationale dans un communiqué publié le mardi 6 octobre.","Le ministère a invoqué l'évolution de la situation météorologique et les remontées des inspections d'académie. Le délai devait permettre de nettoyer, désinfecter et remettre en état les établissements touchés par les inondations, et d'assurer la sécurité des élèves.","Toutes les académies n'étaient pas touchées avec la même intensité. Le ministère a pourtant choisi une date unique pour tout le pays, afin que les élèves reprennent les cours dans les mêmes conditions partout. Il a aussi appelé à une mobilisation citoyenne pour préparer les écoles.","Le ministère souhaite enfin préserver au maximum le temps d'apprentissage avant les Jeux olympiques de la jeunesse Dakar 2026, qui débutent le 31 octobre et pourraient perturber certains établissements."]},
 {"id":"m-ddd","att":"greve-ddd","photo":"images/ddd.jpg","pos":"center 40%","src":["ddd","fsdt"],"srcTxt":["Photo d'illustration transmise à la rédaction"],"cat":"Société","titre":"Dakar Dem Dikk : une grève de 72 heures annoncée les 21, 22 et 23 octobre","chapo":"Sans réponse des autorités à leurs revendications, les travailleurs de la société de transport menacent de paralyser le réseau.","date":"2026-10-12","min":2,"c":["#1d3d5c","#e2a02b"],"sait":["Le Front syndical pour la défense des travailleurs annonce une grève générale de 72 heures à Dakar Dem Dikk, du mercredi 21 au vendredi 23 octobre 2026.","La grève sera déclenchée si aucune réponse satisfaisante n'est apportée d'ici là.","Les syndicats réclament notamment la transformation des CDD en CDI, la mensualisation des indemnités de logement, la revalorisation des pensions de retraite et la révision du Code de la sécurité sociale."],"saitPas":["Si des négociations sont en cours avec la direction ou le gouvernement.","Si un service minimum sera assuré sur certaines lignes.","Le lien exact avec la grève générale nationale annoncée aux mêmes dates par le FSDT."],"texte":["Le Front syndical pour la défense des travailleurs menace de déclencher une grève générale de 72 heures à Dakar Dem Dikk, les mercredi 21, jeudi 22 et vendredi 23 octobre 2026, faute de réponse des autorités à ses revendications. Si elle a lieu, elle pourrait paralyser l'ensemble du réseau de bus.","Les syndicats réclament la transformation des CDD en CDI, la mensualisation des indemnités de logement avec une indemnité pour tous, la revalorisation des pensions de retraite et la révision du Code de la sécurité sociale. Ils demandent aussi une augmentation des salaires, le paiement des primes non versées, dont la prime de rendement 2025, et la signature de l'accord d'établissement, attendue depuis mai.","Ces dates coïncident avec la grève générale de 72 heures à laquelle appelle le Front syndical pour la défense du travail (FSDT), qui regroupe dix centrales syndicales, pour les secteurs public, privé et informel.","Pour les usagers, la question reste ouverte : mais quand saura-t-on si la grève est maintenue ? Nous suivons la date dans la rubrique Mais quand ? et la mettrons à jour dès qu'une décision sera annoncée."]},
 {"id":"m-cyber","photo":"images/cyber.jpg","pos":"60% 40%","cta":{"t":"Faire un signalement sur signalementcyber.dgpn.sn","u":"https://signalementcyber.dgpn.sn/"},"src":["cyber1","cyber2"],"srcTxt":["Plateforme officielle : signalementcyber.dgpn.sn","Photo d'illustration transmise à la rédaction"],"cat":"Tech","titre":"Arnaque, piratage, chantage en ligne : comment le signaler à la police","chapo":"Depuis février 2026, la Police nationale propose une plateforme pour signaler en ligne les infractions cybercriminelles. Voici à quoi elle sert et comment bien s'y préparer.","date":"2026-10-12","min":3,"c":["#14324a","#2f9e5b"],"sait":["La plateforme se trouve à l'adresse signalementcyber.dgpn.sn. Elle a été lancée officiellement le jeudi 12 février 2026.","Elle a été développée par la Police nationale, à l'initiative de la Division spéciale de lutte contre la cybercriminalité (DSC), avec l'appui de l'UNICEF.","Elle permet un pré-signalement en ligne, de manière sécurisée et confidentielle, avant de déposer si nécessaire une plainte auprès des services compétents."],"saitPas":["Si le signalement peut être fait de façon anonyme.","Le délai de traitement d'un signalement et la manière dont la victime est tenue informée."],"texte":["Arnaque au mobile money, compte WhatsApp piraté, faux recrutement, chantage avec des photos intimes : ces situations sont devenues courantes. Depuis le 12 février 2026, la Police nationale met à la disposition des citoyens une plateforme pour les signaler en ligne : signalementcyber.dgpn.sn.","La plateforme couvre une longue liste d'infractions : escroqueries, arnaques au mobile money et accès frauduleux à un compte mobile money, piratage de comptes, usurpation d'identité, SIM swap, harcèlement en ligne, diffamation, extorsion numérique, diffusion non autorisée de contenus ou de contenus obscènes, contenus haineux, escroquerie sentimentale, faux investissements, faux recrutements, paiements frauduleux et fausses ventes en ligne. Elle accorde une attention particulière à la protection des enfants, et la cyberpédopornographie peut y être signalée.","Avant de faire un signalement, rassemblez les preuves : captures d'écran des messages et des profils, numéros de téléphone utilisés, liens, références des transactions mobile money ou bancaires, dates et heures. Ne supprimez rien, même si les messages sont gênants : ce sont des éléments pour l'enquête.","Quelques réflexes à garder : ne cédez jamais à un chantage en payant, car la demande recommence en général. Ne communiquez jamais votre code secret ou un code reçu par SMS. En cas de vol d'argent, prévenez immédiatement votre opérateur ou votre banque pour tenter de bloquer l'opération.","Le signalement en ligne est un premier pas : il peut être suivi d'une plainte auprès des services de police compétents. En cas de danger immédiat, rendez-vous au commissariat le plus proche ou appelez le 17."]},
 {"id":"m-mit","photo":"images/awa.jpg","pos":"60% 35%","src":["forcen"],"srcTxt":["Vidéo de Force-N relayée par le compte Vie Publique SN sur X (12 octobre 2026)","Photo : capture de la vidéo de Force-N"],"cat":"Éducation","titre":"Selon Force-N, Awa Ndiaye, 17 ans, est admise au MIT","chapo":"Le programme numérique de l'UN-CHK présente le parcours d'une élève de Terminale S1 qui prévoit d'étudier l'intelligence artificielle aux États-Unis.","date":"2026-10-12","min":2,"c":["#5c1d2e","#e2a02b"],"sait":["Force-N, programme de l'Université numérique Cheikh Hamidou Kane (UN-CHK) soutenu par la Fondation Mastercard, a diffusé une vidéo présentant le parcours d'Awa Ndiaye.","La publication, relayée le 12 octobre 2026 par le compte Vie Publique SN, annonce son admission au Massachusetts Institute of Technology (MIT).","Selon cette publication, Awa Ndiaye, 17 ans, est en Terminale S1 et prévoit d'y suivre un bachelor en intelligence artificielle après le baccalauréat."],"saitPas":["Le MIT n'a pas confirmé publiquement cette admission, et nous n'avons pas pu la vérifier de façon indépendante.","Le type d'admission et la rentrée concernée : le MIT publie habituellement ses décisions de premier cycle vers la mi-décembre et en mars.","Nous n'avons pas encore trouvé de trace publique de ses distinctions (Concours général, Olympiades, Robotics for Good Youth Challenge)."],"texte":["Le programme Force-N a mis en avant le parcours d'Awa Ndiaye, une élève sénégalaise de 17 ans en Terminale S1, présentée comme admise au Massachusetts Institute of Technology (MIT), l'université américaine de Cambridge, près de Boston, réputée pour les sciences, l'ingénierie et l'intelligence artificielle.","Dans la vidéo, la jeune fille raconte que son parcours scolaire a commencé dans son village, à l'école maternelle et primaire. La publication cite plusieurs distinctions : un premier prix au Concours général en sciences physiques, une médaille d'argent aux Olympiades nationales de mathématiques et une 9ᵉ place internationale au Robotics for Good Youth Challenge, à Genève. Après le baccalauréat, elle prévoit un bachelor en intelligence artificielle.","Nous n'avons pas encore pu confirmer cette admission auprès du MIT, ni ses distinctions auprès des organisateurs. Nous mettrons cet article à jour dès que nous aurons ces confirmations."]},
 {"id":"a8","sait":["Une conférence de presse s'est tenue le vendredi 9 octobre 2026, à l'appel d'une organisation sénégalaise de solidarité avec la cause palestinienne.","Une intervenante a répondu aux questions de plusieurs médias (voir la vidéo).","La banderole appelait à la « solidarité avec la Palestine » et dénonçait un « génocide à Gaza »."],"saitPas":["Le nom exact de l'organisation et celui de l'intervenante.","Le lieu précis de la conférence.","Les actions annoncées à la suite de cette prise de parole."],"srcTxt":["Vidéo transmise à la rédaction le 9 octobre 2026"],"photo":"images/conference.jpg","video":"images/conference.mp4","pos":"center 35%","cat":"International","titre":"Conférence de presse : des militantes appellent à la solidarité avec la Palestine","chapo":"Face aux micros des médias, une organisation sénégalaise de soutien au peuple palestinien a pris la parole ce vendredi.","date":"2026-10-09","min":3,"c":["#1f3b2d","#4a7a5c"],"texte":["Une conférence de presse s'est tenue ce vendredi 9 octobre 2026, à l'appel d'une organisation sénégalaise de solidarité avec la cause palestinienne.","Devant une banderole aux couleurs palestiniennes appelant à la « solidarité avec la Palestine » et dénonçant un « génocide à Gaza », une intervenante, keffieh sur les épaules, a répondu aux questions des journalistes de plusieurs médias.","Les organisatrices ont appelé à la mobilisation et au soutien de la population de Gaza. Regardez un extrait de la prise de parole dans la vidéo ci-dessus."]},
 {"id":"a5","photo":"images/paiement.jpg","srcTxt":["Conseils de la rédaction"],"cat":"Tech","titre":"Paiement mobile : cinq conseils pour éviter les arnaques","chapo":"Faux SMS, faux agents, codes demandés par téléphone : les bons réflexes à adopter.","date":"2026-10-03","min":4,"c":["#1f5a3a","#4fb37e"],"cta":{"t":"Victime d'une arnaque ? Signalez-la sur signalementcyber.dgpn.sn","u":"https://signalementcyber.dgpn.sn/"},"texte":["Les arnaques au paiement mobile se multiplient, le plus souvent par SMS, par appel ou sur WhatsApp. Les escrocs se font passer pour un agent, pour le service client ou pour un proche, et comptent sur la précipitation de leur victime. Voici cinq réflexes simples pour vous protéger."],"conseils":[["Ne communiquez jamais votre code secret","Ni à un agent, ni au service client, ni à un proche par message. Aucun opérateur ne vous le demandera, même pour « débloquer » ou « vérifier » votre compte. Ne donnez pas non plus un code reçu par SMS."],["Vérifiez votre solde avant de « rembourser »","Vous recevez un message annonçant un transfert, puis un appel vous demandant de renvoyer l'argent « envoyé par erreur » ? Ouvrez votre application et vérifiez votre solde : un faux SMS peut parfaitement imiter le message de l'opérateur."],["Rappelez vous-même le service client","Si quelqu'un se présente comme le service client, raccrochez et appelez le numéro officiel affiché dans l'application de votre opérateur. Les vrais services ne vous appellent pas d'un numéro personnel."],["Ne cliquez pas sur les liens trop beaux pour être vrais","Bonus, gain, remboursement, cadeau : ne cliquez pas sur les liens reçus par SMS ou WhatsApp, et n'installez jamais une application en dehors de la boutique officielle de votre téléphone."],["Protégez votre téléphone et votre puce","Verrouillez votre téléphone avec un code, ne le prêtez pas déverrouillé, et réagissez vite si votre puce cesse soudain de fonctionner sans raison : contactez immédiatement votre opérateur, car il peut s'agir d'un vol de numéro (SIM swap)."]],"apres":["Si vous êtes victime d'une arnaque, prévenez tout de suite votre opérateur pour tenter de bloquer l'opération, gardez toutes les preuves (captures, numéros, références de transaction) et signalez les faits à la police, en ligne ou au commissariat.","Article mis à jour le 12 octobre 2026."]},
 {"id":"m-joj","sait":["Les Jeux se déroulent du 31 octobre au 13 novembre 2026 (le baseball5 dès le 30 octobre).","La cérémonie d'ouverture a lieu le samedi 31 octobre au stade Abdoulaye Wade de Diamniadio.","Les épreuves se répartissent entre Dakar, Diamniadio et Saly."],"saitPas":["Le programme détaillé de la cérémonie d'ouverture.","Les conditions d'accès du public : nous ne les avons pas encore confirmées."],"att":"joj","src":["apa"],"cat":"Sport","titre":"JOJ Dakar 2026 : la cérémonie d'ouverture fixée au samedi 31 octobre","chapo":"La date et le lieu sont confirmés : les Jeux olympiques de la jeunesse s'ouvriront au stade Abdoulaye Wade de Diamniadio.","date":"2026-10-11","min":2,"c":["#0d4f8b","#e2a02b"],"texte":["Les Jeux olympiques de la jeunesse se dérouleront du 31 octobre au 13 novembre 2026, soit 14 jours de compétition. Le baseball5 commence dès le 30 octobre.","La cérémonie d'ouverture aura lieu le samedi 31 octobre au stade Abdoulaye Wade de Diamniadio.","Les épreuves se répartissent entre Dakar (Iba Mar Diop, Tour de l'Œuf, Corniche Ouest), Diamniadio (Dakar Arena, centre équestre, Centre des expositions) et Saly pour les sports de plage et nautiques. Le village olympique est installé à l'Université Amadou-Mahtar-Mbow."]},
 {"id":"m-lions","sait":["Le Sénégal a fait 1-1 contre le Mozambique (25 septembre) puis gagné 1-0 en Éthiopie (29 septembre).","Les journées 3 et 4 se jouent pendant la fenêtre du 9 au 17 novembre 2026.","Le groupe J réunit le Sénégal, le Mozambique, le Soudan et l'Éthiopie."],"saitPas":["Les jours exacts, l'adversaire et les stades des journées 3 et 4."],"att":"lions-nov","src":["can","rts"],"cat":"Sport","titre":"Lions : la suite des éliminatoires de la CAN 2027 entre le 9 et le 17 novembre","chapo":"La période est connue, pas encore les jours exacts des matchs.","date":"2026-10-11","min":2,"c":["#1f6b3a","#e2a02b"],"texte":["Après un nul 1-1 contre le Mozambique le 25 septembre et une victoire 1-0 en Éthiopie le 29 septembre, les Lions disputeront les journées 3 et 4 du groupe J pendant la fenêtre du 9 au 17 novembre 2026.","Le Sénégal partage son groupe avec le Mozambique, le Soudan et l'Éthiopie. Les journées 5 et 6 suivront entre le 22 et le 30 mars 2027.","Dès que la fédération publiera les dates et les lieux, la date passera en fiabilité élevée dans la rubrique « Mais quand ? »."]},
 {"id":"m-examens","photo":"images/examens.jpg","pos":"center 40%","srcTxt":["Photo d'illustration transmise à la rédaction"],"sait":["En 2026 : CFEE le 17 juin, second groupe du Bac le 9 juillet, BFEM le 21 juillet.","Les épreuves d'EPS du Bac 2026 se sont tenues de mi à fin mai selon les régions."],"saitPas":["Le calendrier officiel 2027, pas encore publié.","Si 2027 suivra exactement le même rythme que 2026."],"att":"bac","src":["cfee","bac2","bfem","bac"],"cat":"Éducation","titre":"Examens 2027 : ce que l'on peut déjà prévoir","chapo":"Le calendrier officiel n'est pas publié. Voici les dates probables, déduites de 2026.","date":"2026-10-11","min":3,"c":["#0b4f6e","#3a8fb7"],"texte":["En 2026, le CFEE et l'entrée en sixième ont commencé le 17 juin, le second groupe du Bac le 9 juillet et le BFEM le 21 juillet. Les épreuves d'EPS du Bac s'étaient tenues de mi à fin mai selon les régions.","Si le calendrier suit le même rythme, on peut attendre en 2027 : l'EPS vers le 10 mai, le CFEE vers le 16 juin, les écrits du Bac vers le 29 juin, le BFEM vers le 20 juillet et les résultats définitifs du Bac vers la fin juillet.","Ces dates sont affichées en fiabilité faible dans la rubrique « Mais quand ? ». Elles seront remplacées dès la publication du calendrier officiel par le ministère de l'Éducation nationale et l'Office du Bac."]},
 {"id":"m-police","photo":"images/police.jpg","pos":"center 30%","srcTxt":["Photo d'illustration transmise à la rédaction"],"sait":["Le dépôt des dossiers a lieu en général fin juin.","Le calendrier indicatif place les commissaires fin août, les sous-officiers fin septembre et les agents mi-novembre."],"saitPas":["La date exacte du concours des agents en 2026.","La liste des centres d'examen."],"att":"police-agents","src":["police"],"cat":"Emploi","titre":"Concours de police : les agents attendus vers la mi-novembre","chapo":"Le calendrier indicatif place l'épreuve des agents vers la mi-novembre.","date":"2026-10-11","min":2,"c":["#1d2f5c","#5a78b8"],"texte":["Pour les concours de la police, le dépôt des dossiers a lieu en général fin juin. Les épreuves suivent : commissaires (Master 2) fin août, sous-officiers (Bac) fin septembre, agents (BFEM) mi-novembre.","Ce calendrier reste indicatif. Les candidats doivent vérifier leur convocation et les communiqués sur fonctionpublique.gouv.sn ou au Journal officiel."]},
 {"id":"a7","rappel":true,"cat":"Spiritualité","titre":"Le rappel du jour : les six droits du musulman sur son frère","chapo":"Un hadith, un verset et une invocation pour vivre la fraternité au quotidien.","date":"2026-10-13","hijri":"Début de Joumâda al-Oûlâ 1448 H","min":2,"c":["#0f4a35","#d8b45a"],"hadith":{"texte":"Les droits du musulman sur son frère musulman sont au nombre de six : lorsque tu le rencontres, salue-le ; lorsqu'il t'invite, réponds à son invitation ; lorsqu'il te demande conseil, conseille-le ; lorsqu'il éternue et loue Allah, invoque pour lui ; lorsqu'il tombe malade, rends-lui visite ; et lorsqu'il meurt, accompagne-le.","ar":"حَقُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ سِتٌّ: إِذَا لَقِيتَهُ فَسَلِّمْ عَلَيْهِ، وَإِذَا دَعَاكَ فَأَجِبْهُ، وَإِذَا اسْتَنْصَحَكَ فَانْصَحْ لَهُ، وَإِذَا عَطَسَ فَحَمِدَ اللَّهَ فَشَمِّتْهُ، وَإِذَا مَرِضَ فَعُدْهُ، وَإِذَا مَاتَ فَاتَّبِعْهُ","source":"Sahih Muslim (2162)"},"rap":{"titre":"La fraternité se vit en actes.","texte":"Saluer, répondre à une invitation, donner un conseil sincère, invoquer pour celui qui éternue, visiter le malade, accompagner le défunt : six gestes simples qui tissent les liens entre les gens."},"verset":{"ar":"وَذَكِّرْ فَإِنَّ الذِّكْرَىٰ تَنفَعُ الْمُؤْمِنِينَ","fr":"Et rappelle ; car le rappel profite aux croyants.","ref":"Sourate Adh-Dhâriyât, 51:55"},"retenir":"Aujourd'hui, choisis l'un de ces six droits et accomplis-le : un salut, une visite, un conseil.","doua":{"ar":"اللَّهُمَّ أَلِّفْ بَيْنَ قُلُوبِنَا، وَأَصْلِحْ ذَاتَ بَيْنِنَا","fr":"Ô Allah, unis nos cœurs et répare ce qui est entre nous."},"texte":[]},
];
/* Les rubriques du menu, dans l'ordre. Un article garde sa catégorie (Santé, Météo…),
   affichée sur sa carte ; RANGE dit dans quelle rubrique il se classe.
   Une catégorie absente de RANGE ne crée pas de rubrique : l'article n'apparaît que dans « Toutes ». */

let cat = "Toutes", q = "";
const $ = s => document.querySelector(s);

/* Calcul des heures de prière (méthode Ligue islamique mondiale : Fajr 18°, Icha 17°, Asr chaféite). */
function prayerTimes(date, lat, lng, tz){
  const dr=Math.PI/180, sin=d=>Math.sin(d*dr), cos=d=>Math.cos(d*dr), tan=d=>Math.tan(d*dr),
    asin=x=>Math.asin(x)/dr, acos=x=>Math.acos(x)/dr, atan2=(y,x)=>Math.atan2(y,x)/dr, acot=x=>Math.atan(1/x)/dr,
    fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  let Y=y,M=m; if(M<=2){Y-=1;M+=12}
  const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const JD=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5 - lng/(15*24);
  const sun=jd=>{const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),
    L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;
    return {decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)}};
  const mid=t=>fix(12-sun(JD+t).eqt,24);
  const angleTime=(ang,t,ccw)=>{const dec=sun(JD+t).decl,noon=mid(t),T=acos((-sin(ang)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/15;return noon+(ccw?-T:T)};
  const asr=t=>{const dec=sun(JD+t).decl;return angleTime(-acot(1+tan(Math.abs(lat-dec))),t)};
  const adj=h=>h+tz-lng/15;
  const r={fajr:angleTime(18,5/24,true),lever:angleTime(0.833,6/24,true),dhuhr:mid(12/24)+1/60,asr:asr(13/24),maghrib:angleTime(0.833,18/24),isha:angleTime(17,18/24)};
  for(const k in r){r[k]=adj(r[k])}
  r.maghrib+=1/60;
  return r;
}
const hhmm=h=>{h=((h%24)+24)%24;let H=Math.floor(h),Mn=Math.round((h-H)*60);if(Mn===60){H=(H+1)%24;Mn=0}return String(H).padStart(2,"0")+":"+String(Mn).padStart(2,"0")};
