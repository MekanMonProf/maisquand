  return `<section class="panel dates" aria-labelledby="mq-t">
    <div class="ph"><h3 id="mq-t">Mais quand <em>?</em></h3><a href="#dates" class="lnk">Toutes les dates →</a></div>
    <p class="sub">Les prochaines dates à retenir</p>
    <ul>${aVenir().slice(0,4).map(x=>dateRow(x,{court:true})).join("")}</ul>
  </section>`;
}

/* Page de la rubrique */
let filtreDate="Tout", mqQuestion="";
const FILTRES=["Tout","Examen","Concours","Formation","Sport","Religion","Culture","Fête","National"];
const LBL={Tout:"Tout",Examen:"Examens",Concours:"Concours",Formation:"Formations",Sport:"Sport",Religion:"Religion",Culture:"Culture","Fête":"Fêtes",National:"National"};
function majDates(){
  const liste=aVenir().filter(x=>(filtreDate==="Tout"||x.c===filtreDate)&&correspond(x,mqQuestion)), mes=aVenir().filter(estSuivi);
  const m=$("#mes"); if(m) m.innerHTML=mes.length?`<ul>${mes.map(x=>dateRow(x)).join("")}</ul>`:`<p class="sub">Vous ne suivez encore aucune attente. Appuyez sur « + Suivre » à côté d'une date pour la retrouver ici à chaque visite.</p>`;
  const n=$("#mes-n"); if(n) n.textContent=mes.length?`(${mes.length})`:"";
  const l=$("#liste"); if(l) l.innerHTML=liste.length?liste.map(x=>dateRow(x)).join(""):`<li class="vide">Aucune date ne correspond${mqQuestion?` à « ${esc(mqQuestion)} »`:" à ce filtre"}. Essayez un autre mot : Bac, Tabaski, Lions, police…</li>`;
  document.querySelectorAll(".filtres button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filtreDate));
}
function renderDates(){
  const lies=ARTICLES.filter(a=>a.att);
  $("#app").innerHTML=`<article class="mq" style="max-width:780px">
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <div class="mq-hero"><span class="cat">MaisQuand</span><h1>Transformer chaque attente en confiance.</h1><p class="by">Par KemanHicks</p></div>
    <div class="mq-intro">
      <section><h2>Le problème</h2><p>Chaque jour, des millions de personnes attendent un résultat d'examen, une décision administrative ou un événement public. Cette attente est presque toujours accompagnée d'incertitude : informations dispersées, dates rarement fiables, rumeurs qui circulent plus vite que les confirmations. Aujourd'hui, aucun outil ne permet de transformer une recherche ponctuelle en un suivi structuré, dans le temps.</p></section>
      <section><h2>Notre idée</h2><p>MaisQuand transforme une simple recherche en « attente structurée ». L'utilisateur pose sa question une seule fois ; le système la suit, compare les sources disponibles, évalue leur fiabilité, et ne le prévient que lorsqu'un changement significatif survient, jusqu'à la résolution.</p></section>
    </div>
    <ol class="etapes">
      <li><b>Recherche</b><span>L'utilisateur pose une question simple, en langage naturel.</span></li>
      <li><b>Attente</b><span>La recherche devient un objet suivi dans le temps, avec un niveau de fiabilité.</span></li>
      <li><b>Suivi</b><span>Le système surveille l'évolution, sans que l'utilisateur ait à revenir vérifier.</span></li>
      <li><b>Résolution</b><span>Une notification arrive au bon moment, ni trop tôt ni trop tard.</span></li>
    </ol>
    <section class="ask">
      <label for="mqq">Posez votre question</label>
      <div class="askrow"><input id="mqq" type="search" placeholder="Ex. : Mais quand c'est le Bac ?" value="${esc(mqQuestion)}" autocomplete="off"></div>
      <div class="exemples">Exemples : ${["Bac","Tabaski","Lions","Police","Campusen"].map(e=>`<button type="button" data-q="${e}">${e}</button>`).join("")}</div>
    </section>
    <section class="panel dates mes"><div class="ph"><h3>Mes attentes suivies <span id="mes-n"></span></h3></div><div id="mes"></div></section>
    <h2 class="h2">Toutes les attentes</h2>
    <div class="filtres" role="group" aria-label="Filtrer les dates">${FILTRES.map(f=>`<button type="button" data-f="${f}" aria-pressed="${f===filtreDate}">${LBL[f]}</button>`).join("")}</div>
    <section class="panel dates"><ul id="liste"></ul>
    <div class="legende"><span class="fiab haut"><i></i>Élevée : date confirmée</span><span class="fiab moy"><i></i>Moyenne : estimée (calendrier lunaire) ou jour à préciser</span><span class="fiab bas"><i></i>Faible : déduite des années précédentes</span></div>
    <p class="fine">Touchez une date pour voir ses sources et son historique. Les dates sont remplacées dès qu'une source officielle les confirme. Les alertes automatiques arriveront avec la version en ligne ; pour l'instant, vos attentes suivies sont gardées sur cet appareil.</p></section>
    ${lies.length?`<h2 class="h2">L'actualité des dates</h2><div class="majs">${lies.map(majCard).join("")}</div>`:""}
    <h2 class="h2">Résolues récemment</h2>
    <ul class="resol">${RESOLUES.map(r=>`<li><span class="ok" aria-hidden="true">✓</span><div><strong>${esc(r.q)}</strong><p>${esc(r.r)}</p>${r.src&&r.src.u?`<a href="${esc(r.src.u)}" target="_blank" rel="noopener" class="srcl">Source : ${esc(r.src.n)}</a>`:r.src?`<span class="srcl">Source : ${esc(r.src.n)}</span>`:""}</div></li>`).join("")}</ul>
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"};
  majDates();
  window.scrollTo(0,0);
}
function majCard(a){const x=attById(a.att);return `<a class="majc" href="#${a.id}"><span class="meta">${fmt(a.date)} · ${a.cat}</span><h4>${esc(a.titre)}</h4><p>${esc(a.chapo)}</p>${x?`<span class="lie">↳ ${esc(x.q)}</span>`:""}</a>`}

/* Fiche d'une date */
function renderAtt(x){
  const j=joursAvant(x.d), lies=articlesDe(x.id);
  $("#app").innerHTML=`<article>
    <a class="back" href="#dates">← Mais quand ?</a>
    <span class="cat">${x.c} · Mais quand ?</span>
    <h1>${esc(x.q)}</h1>
    <div class="answer">
      <div class="big"><b>${j<0?"Passée":j===0?"Aujourd'hui":j}</b>${j>0?`<small>${j===1?"jour":"jours"} restants</small>`:""}</div>
      <div><p class="when">${new Date(x.d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>${fiabTag(x)}${x.note?`<p class="anote">${esc(x.note)}</p>`:""}</div>
      ${btnSuivre(x)}
    </div>
    ${x.obs?`<p class="pobs"><b>Observation :</b> ${esc(x.obs)}</p>`:""}
    <section class="blk"><h2>Sources</h2><ul class="srcs">${srcLinks(x.src)}</ul></section>
    ${(x.hist||[]).length?`<section class="blk"><h2>Historique</h2><ol class="hist">${x.hist.map(([d,t])=>`<li><span>${fmt(d)}</span>${esc(t)}</li>`).join("")}</ol></section>`:""}
    ${lies.length?`<section class="blk"><h2>Articles liés</h2><div class="majs">${lies.map(majCard).join("")}</div></section>`:""}
    ${shareBar({titre:x.q,id:"att-"+x.id})}
  </article>`;
  window.scrollTo(0,0);
}

document.addEventListener("input",e=>{ if(e.target.id==="mqq"){ mqQuestion=e.target.value.trim(); majDates(); } });
document.addEventListener("click",e=>{
  const ex=e.target.closest(".exemples button"); if(ex){ mqQuestion=ex.dataset.q; $("#mqq").value=mqQuestion; majDates(); return; }
  const fb=e.target.closest(".filtres button"); if(fb){ filtreDate=fb.dataset.f; majDates(); return; }
  const sb=e.target.closest(".suivre"); if(sb){ e.preventDefault(); const k=sb.dataset.k; suivis=suivis.includes(k)?suivis.filter(x=>x!==k):[...suivis,k]; try{localStorage.setItem("mq-suivis3",JSON.stringify(suivis))}catch(_){}
    document.querySelectorAll(`.suivre[data-k="${k}"]`).forEach(b=>{const on=suivis.includes(k);b.setAttribute("aria-pressed",on);b.textContent=on?"✓ Suivi":"+ Suivre"}); majDates(); }
});


/* ===== Confiance : encadré, règles, corrections ===== */
function saitBox(a){
  if(!a.sait&&!a.saitPas) return "";
  return `<div class="sait">
    ${a.sait?`<section class="oui"><h2>Ce qu'on sait</h2><ul>${a.sait.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:""}
    ${a.saitPas?`<section class="non"><h2>Ce qu'on ne sait pas encore</h2><ul>${a.saitPas.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:""}
  </div>`;
}
const CORRECTIONS=[]; /* {d:"2026-10-12", article:"id", txt:"Ce qui a été corrigé"} */
function renderRegles(){
  $("#app").innerHTML=`<article>
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">Mais quand ?</span><h1>Nos règles</h1>
    <p class="chapo">Mais quand ? est un site d'information sénégalais créé par KemanHicks. Nous ne cherchons pas à être les plus rapides, mais les plus fiables. Voici les règles que nous nous imposons, pour que vous puissiez nous juger dessus.</p>
    <ol class="regles7">
      <li><b>Nous citons toujours nos sources.</b> Chaque article indique d'où vient l'information, avec un lien quand c'est possible.</li>
      <li><b>Nous séparons ce que l'on sait de ce que l'on ne sait pas encore.</b> Les sujets importants commencent par ces deux encadrés.</li>
      <li><b>Une rumeur n'est jamais présentée comme un fait.</b> Tant qu'une information n'est pas confirmée, nous le disons.</li>
      <li><b>Nos titres disent ce que contient l'article.</b> Pas de titre trompeur pour attirer les clics.</li>
      <li><b>Les dates affichent leur niveau de fiabilité.</b> Dans la rubrique « Mais quand ? », chaque date est confirmée, estimée ou approximative, et nous le montrons.</li>
      <li><b>Nous corrigeons nos erreurs publiquement.</b> Toute correction importante est signalée dans l'article et listée sur la page Corrections.</li>
      <li><b>Nous distinguons l'information de l'opinion.</b> Un texte d'opinion est toujours présenté comme tel.</li>
      <li><b>Les contenus payés sont toujours signalés.</b> Un partenaire ou un annonceur est présenté comme tel, et il n'intervient pas dans nos articles.</li>
    </ol>
    <p><a href="#corrections">Voir les corrections →</a></p>
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"}; window.scrollTo(0,0);
}
function renderCorrections(){
  $("#app").innerHTML=`<article>
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">Mais quand ?</span><h1>Corrections</h1>
    <p class="chapo">Quand nous nous trompons, nous le disons ici : la date, l'article concerné et ce qui a été corrigé.</p>
    ${CORRECTIONS.length?`<ul class="corrs">${CORRECTIONS.map(c=>{const a=ARTICLES.find(x=>x.id===c.article);return `<li><span class="meta">${fmt(c.d)}</span>${a?`<a href="#${a.id}">${esc(a.titre)}</a>`:""}<p>${esc(c.txt)}</p></li>`}).join("")}</ul>`:`<p class="vide-c">Aucune correction pour l'instant. Si vous repérez une erreur, signalez-la-nous : elle sera vérifiée, corrigée et listée ici.</p>`}

  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"}; window.scrollTo(0,0);
}

function vfCard(v){return `<a class="vfc" href="#${v.id}">${stamp(v)}<div><span class="meta">${v.cat} · ${fmt(v.d)}</span><h4>${esc(v.claim)}</h4></div></a>`}
/* ===== Partenaires =====
   Un partenaire par ligne, géré depuis admin/partenaires.html. logo est facultatif (sinon, l'initiale
   s'affiche sur la couleur indiquée). couleurNom : la couleur de la marque pour son nom.
   lien remplace l'adresse affichée, pour un lien trop long.
   texte : une phrase, écrite ou validée par le partenaire. */
const PARTENAIRES = [
 {"nom":"Waqf Dolel Xamxam","url":"https://www.waqfdolelxamxam.sn/","logo":"images/partenaires/waqf-dolel-xamxam.png","texte":"Finance les daaras et l'éducation gratuite, des petites classes jusqu'au doctorat."},
 {"nom":"Barakasouq","url":"https://barakasouq.com/","logo":"images/partenaires/barakasouq.png","couleurNom":"#a19710","texte":"Boutique en ligne : maison et électroménager, bébé, mode, beauté et high-tech, au même endroit."},
 {"nom":"Taaral Boutique","url":"https://whatsapp.com/channel/0029VbDbk3x65yD4t29VJW3J","lien":"Chaîne WhatsApp","logo":"images/partenaires/taaral-boutique.png","texte":"Mode féminine pudique : robes longues, hijabs, parfums et accessoires."},
 {"nom":"Ndougalma","url":"https://whatsapp.com/channel/0029Vb9VDnQ1NCrVwZspDe0X","lien":"Chaîne WhatsApp","logo":"images/partenaires/ndougalma.png","texte":"Fruits, légumes frais et produits du quotidien, à Dakar et Touba."},
];
/* Coordonnées pour les annonceurs (modifiables depuis admin/partenaires.html). Laissées vides, la page le dit sans afficher de numéro. */
const CONTACT_PUB = {"whatsapp":"","email":""};
const hote = u => u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
const couleurOk = c => /^#[0-9a-f]{3,8}$/i.test(c||"");
function partCard(p){
  return `<a class="partc" href="${esc(p.url)}" target="_blank" rel="sponsored noopener">
    <span class="lg"${!p.logo&&couleurOk(p.couleur)?` style="background:${p.couleur};color:#fff"`:""}>${p.logo?`<img src="${esc(p.logo)}" alt="" loading="lazy">`:esc(p.nom.charAt(0))}</span>
    <span><h4${couleurOk(p.couleurNom)?` style="color:${p.couleurNom}"`:""}>${esc(p.nom)}</h4>${p.texte?`<p>${esc(p.texte)}</p>`:""}<span class="url">${esc(p.lien||hote(p.url))} ↗</span></span>
  </a>`;
}
function partBand(){
  if(!PARTENAIRES.length) return "";
  return `<aside class="parts" aria-label="Nos partenaires">
    <div class="ph"><span class="tag">Partenaires · contenu non rédactionnel</span><a class="lnk" href="#annoncer">Annoncer chez nous →</a></div>
    <div class="partgrid">${PARTENAIRES.map(partCard).join("")}</div>
  </aside>`;
}
function renderAnnoncer(){
  const c=CONTACT_PUB, wa=c.whatsapp.replace(/[^0-9]/g,"");
  const contact = wa||c.email
    ? `<p>${wa?`WhatsApp : <a href="https://wa.me/${wa}">${esc(c.whatsapp)}</a>`:""}${wa&&c.email?" · ":""}${c.email?`E-mail : <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:""}</p>`
    : `<p class="empty">Les coordonnées pour les annonceurs seront bientôt indiquées ici.</p>`;
  $("#app").innerHTML=`<article>
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">Mais quand ?</span><h1>Annoncer chez nous</h1>
    <p class="chapo">Mais quand ? vit aussi grâce à ses partenaires. Nous leur réservons une place visible, sans jamais la confondre avec l'information.</p>
    <ul class="offre">
      <li><b>Un emplacement partenaire sur la page d'accueil</b>, avec votre logo, une phrase et un lien vers votre site.</li>
      <li><b>Un contenu sponsorisé</b>, toujours marqué comme tel et rangé dans la rubrique qui lui correspond.</li>
    </ul>
    <p>Un partenaire ne relit pas nos articles et n'influence pas notre traitement de l'information. C'est l'une de <a href="#regles">nos règles</a>.</p>
    <h3 class="sec">Nous contacter</h3>
    ${contact}
    ${PARTENAIRES.length?`<h3 class="sec">Ils nous font confiance</h3><div class="partgrid">${PARTENAIRES.map(partCard).join("")}</div>`:""}
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"}; window.scrollTo(0,0);
}
function vfBand(){
  return `<section class="vfband" aria-labelledby="vf-t">
    <div class="ph"><h3 id="vf-t">Vrai ou faux ?</h3><a class="lnk" href="#vrai-faux">Toutes les vérifications →</a></div>
    <p class="sub">Les rumeurs qui circulent sur WhatsApp et les réseaux, vérifiées avec leurs sources.</p>
    <div class="vfgrid">${VERIFS.slice(0,3).map(vfCard).join("")}</div>
  </section>`;
}
function renderVF(){
  $("#app").innerHTML=`<article style="max-width:780px">
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">Vrai ou faux ?</span><h1>Les rumeurs vérifiées</h1>
    <p class="chapo">Une information vous semble douteuse ? Nous la vérifions, nous montrons comment, et nous citons nos sources.</p>
    <div class="legende vfleg">${Object.keys(VERDICTS).map(k=>`<span class="stamp ${k}">${VERDICTS[k]}</span>`).join("")}</div>
    <p class="fine">Faux : contredit par des preuves. Trompeur : en partie vrai, mais présenté de façon à induire en erreur. Non vérifié : impossible à confirmer ou à démentir pour l'instant. Vrai : confirmé par des sources fiables.</p>
    <div class="vflist">${VERIFS.map(vfCard).join("")}</div>
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"}; window.scrollTo(0,0);
}
function renderVFOne(v){
  const x=v.att&&typeof attById==="function"?attById(v.att):null;
  $("#app").innerHTML=`<article>
    <a class="back" href="#vrai-faux">← Vrai ou faux ?</a>
    <span class="cat">Vrai ou faux ? · ${v.cat}</span>
    <h1>${esc(v.claim)}</h1>
    <div class="verdict ${v.verdict}"><span class="stamp ${v.verdict} big">${VERDICTS[v.verdict]}</span><p>${esc(v.conclusion)}</p></div>
    <span class="meta">Vérification publiée le ${fmt(v.d)}</span>
    <section class="blk"><h2>Ce qui circule</h2><p class="pp">${esc(v.circule)}</p></section>
    <section class="blk"><h2>Ce que nous avons vérifié</h2><ul class="preuves">${v.preuves.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
    <p class="pobs"><b>Le bon réflexe :</b> ${esc(v.reflexe)}</p>
    ${x?`<a class="attcard" href="#att-${x.id}">${cdBox(x)}<div><span class="meta">Mais quand ? · date suivie</span><strong>${esc(x.q)}</strong>${fiabTag(x)}</div></a>`:""}
    <section class="blk"><h2>Sources</h2><ul class="srcs">${v.src.map(s=>`<li>${s.u?`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a>`:esc(s.n)}</li>`).join("")}</ul></section>
    <p class="regle-lien">Comment nous travaillons : <a href="#regles">nos règles</a> · <a href="#corrections">corrections</a></p>
    ${shareBar({titre:VERDICTS[v.verdict]+" : "+v.claim,id:v.id})}
  </article>`;
  window.scrollTo(0,0);
}

/* Partage */
/* Adresse publique d'une page : chaque article, vérification et date a sa propre page
   (/a/…, /v/…, /d/…), générée à chaque mise à jour par outils/pages.mjs. */
const lienArticle=a=>"https://maisquand.com/"+(a.id.startsWith("att-")?"d/"+a.id.slice(4):a.id.startsWith("vf-")?"v/"+a.id:"a/"+a.id)+"/";
function shareBar(a){
  const url=lienArticle(a), txt=a.titre+" — Mais quand ?";
  return `<div class="share"><span>Partager</span>
    <a class="wa" href="https://wa.me/?text=${encodeURIComponent(txt+"\n"+url)}" target="_blank" rel="noopener">WhatsApp</a>
    <a class="fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">Facebook</a>
    <button type="button" class="cp" data-url="${url}">Copier le lien</button></div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest(".cp"); if(!b) return;
  const done=()=>{b.textContent="Lien copié"; setTimeout(()=>b.textContent="Copier le lien",2000)};
  try{navigator.clipboard.writeText(b.dataset.url).then(done,()=>{prompt0(b)})}catch(_){prompt0(b)}});
function prompt0(b){b.outerHTML=`<input class="cpin" readonly value="${b.dataset.url}" onfocus="this.select()">`}

function renderCats(){
  const k=cleRoute(), onDates=k==="#dates"||k.startsWith("#att-");
  const onVF=k==="#vrai-faux"||k.startsWith("#vf-");
  $("#cats").innerHTML = CATS.map(c=>`<button type="button" aria-pressed="${!onDates&&!onVF&&c===cat}" data-c="${c}">${c}</button>`).join("")+`<button type="button" class="vfbtn" aria-pressed="${onVF}" data-r="vrai-faux">Vrai ou faux ?</button>`+`<button type="button" class="mqbtn" aria-pressed="${onDates}" data-r="dates">Mais quand ?</button>`;
}
$("#cats").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.r){ location.hash=b.dataset.r; return; }
  cat=b.dataset.c; location.hash="accueil"; renderCats(); renderHome();
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase(); if(cleRoute() && cleRoute()!=="#accueil") location.hash="accueil"; renderHome();});

function rappelBand(r){
  /* Un article ordinaire peut aussi servir de rappel du jour, à la date de son champ rappelDu. */
  const d = new Date((r.rappel ? r.date : r.rappelDu)+"T12:00:00");
  const corps = r.rappel ? `<h2>${esc(r.rap.titre)}</h2>
      <div class="cols">
        <div><div class="ar" lang="ar" style="font-size:clamp(1.3rem,2.6vw,1.7rem)">${r.verset.ar}</div><p class="fr">« ${esc(r.verset.fr)} »</p><span class="ref">${r.verset.ref}</span></div>
        <div><p class="fr">« ${esc(r.hadith.texte)} »</p><span class="ref">${r.hadith.source}</span><p style="margin:14px 0 0"><span class="more">Lire le rappel complet →</span></p></div>
      </div>`
    : `<h2>${esc(r.titre)}</h2><p class="fr" style="max-width:62ch">${esc(r.chapo)}</p><p style="margin:14px 0 0"><span class="more">Lire le rappel complet →</span></p>`;
  return `<a class="rappel" href="#${r.id}">
    <div class="when"><small>${d.toLocaleDateString("fr-FR",{weekday:"long"})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</small>${r.hijri?`<hr><small>${r.hijri}</small>`:""}</div>
    <div style="min-width:0">
      <span class="eyebrow">Le rappel du jour · Spiritualité</span>
      ${corps}
    </div>
  </a>`;
}
function renderHome(){
  const list = ARTICLES.filter(a=>(cat==="Toutes"||rubrique(a)===cat) && (!q || (a.titre+" "+a.chapo+" "+(a.rap?a.rap.texte+a.hadith.texte:"")).toLowerCase().includes(q)));
  if(!list.length){ $("#app").innerHTML=`<p class="empty">Aucun article ne correspond à votre recherche.</p>`; return; }
  /* Le rappel du jour ne s'affiche en grand que le jour même (heure de Dakar) ;
     passé ce jour, il rejoint les autres articles. */
  const auj = new Date().toLocaleDateString("sv-SE",{timeZone:"Africa/Dakar"});
  const rap = list.find(a=>a.rappel && a.date===auj) || list.find(a=>a.rappelDu===auj);
  const others = list.filter(a=>a!==rap);
  const [first,...rest0]=others;
  const rest=[...rest0].sort((x,y)=>y.date.localeCompare(x.date));
  $("#app").innerHTML = `<h1 class="sr-only">Mais quand ? L'actualité du Sénégal et les dates à retenir</h1>
    ${first?`<a class="une" href="#${first.id}">
      ${img(first)}
      <div><span class="cat">À la une · ${first.cat}</span><h2>${esc(first.titre)}</h2><p>${esc(first.chapo)}</p><p style="margin-top:10px">${meta(first)}</p></div>
    </a>`:""}
    ${rap?rappelBand(rap):""}
    ${cat==="Toutes"&&!q?`<div class="duo">${prayerPanel()}${datesPanel()}</div>`:""}
    ${cat==="Toutes"&&!q?vfBand():""}
    ${cat==="Toutes"&&!q?partBand():""}
    ${rest.length?`<h3 class="sec">${cat==="Toutes"?"Dernières actualités":cat}</h3>
    <div class="grid">${rest.map(a=>`<a class="card" href="#${a.id}">${img(a)}<span class="cat">${a.cat}</span><h4>${esc(a.titre)}</h4>${meta(a)}</a>`).join("")}</div>`:""}`;
}

function renderArticle(a){
  if(a.rappel){
    $("#app").innerHTML = `<article>
      <button class="back" type="button" id="back">← Retour aux actualités</button>
      <span class="cat">${a.cat} · Le rappel du jour</span><h1>${esc(a.titre)}</h1><p class="chapo">${esc(a.chapo)}</p>
      <span class="meta">${fmt(a.date)} · ${a.hijri}</span>
      <div class="rp">
        <section><h2>Le hadith</h2><p style="margin:0">Le Messager d'Allah ﷺ a dit :</p><blockquote>« ${esc(a.hadith.texte)} »</blockquote><div class="ar" lang="ar" style="font-size:1.5rem">${a.hadith.ar}</div><span class="src">${a.hadith.source}</span></section>
        <section><h2>Le rappel</h2><strong style="font-size:1.15rem">${esc(a.rap.titre)}</strong><p style="margin:0">${esc(a.rap.texte)}</p></section>
        <section class="dark"><h2>Le verset du jour</h2><div class="ar" lang="ar">${a.verset.ar}</div><blockquote>« ${esc(a.verset.fr)} »</blockquote><span class="src">${a.verset.ref}</span></section>
        <section><h2>À retenir</h2><p style="margin:0;font-size:1.1rem">${esc(a.retenir)}</p></section>
        <section><h2>Douʿâ</h2><div class="ar" lang="ar">${a.doua.ar}</div><blockquote>« ${esc(a.doua.fr)} »</blockquote></section>
      </div>
      ${shareBar(a)}
    </article>`;
    $("#back").onclick=()=>{location.hash="accueil"};
    window.scrollTo(0,0); return;
  }
  $("#app").innerHTML = `<article>
    <button class="back" type="button" id="back">← Retour aux actualités</button>
    <span class="cat">${a.cat}</span><h1>${esc(a.titre)}</h1><p class="chapo">${esc(a.chapo)}</p>${meta(a,true)}
    ${saitBox(a)}
    ${a.video?`<figure class="vid"><video controls playsinline preload="metadata" poster="${a.photo}" src="${a.video}"></video><figcaption>Vidéo · ${fmt(a.date)}</figcaption></figure>`:img(a)}<div class="txt">${a.texte.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    ${a.videos?`<div class="vids">${a.videos.map((v,i)=>`<figure class="vid"><video controls playsinline preload="metadata" src="${v}"></video><figcaption>Vidéo ${a.videos.length>1?i+1+" ":""}· ${fmt(a.date)}</figcaption></figure>`).join("")}</div>`:""}
    ${a.conseils?`<ol class="conseils">${a.conseils.map(([t,d])=>`<li><strong>${esc(t)}</strong><p>${esc(d)}</p></li>`).join("")}</ol>`:""}${a.apres?`<div class="txt">${a.apres.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
    ${a.cta?`<a class="cta" href="${a.cta.u}" target="_blank" rel="noopener">${esc(a.cta.t)} →</a>`:""}
    ${a.att&&attById(a.att)?(x=>`<a class="attcard" href="#att-${x.id}">${cdBox(x)}<div><span class="meta">Mais quand ? · date suivie</span><strong>${esc(x.q)}</strong>${fiabTag(x)}</div></a>`)(attById(a.att)):""}
    ${(a.src||a.srcTxt)?`<section class="blk"><h2>Sources</h2><ul class="srcs">${a.src?srcLinks(a.src):""}${(a.srcTxt||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:""}
    <p class="regle-lien">Comment nous travaillons : <a href="#regles">nos règles</a> · <a href="#corrections">corrections</a></p>
    ${shareBar(a)}
  </article>`;
  $("#back").onclick=()=>{location.hash="accueil"};
  window.scrollTo(0,0);
}

/* Page demandée : l'ancre (#…) si elle existe, sinon l'adresse /a/…, /v/… ou /d/… */
const cheminCle=(()=>{const m=location.pathname.match(/^\/(a|v|d)\/([a-z0-9-]+)\/?$/);return m?(m[1]==="d"?"#att-":"#")+m[2]:""})();
const cleRoute=()=>location.hash.length>1?location.hash:cheminCle;
const TITRE_SITE="Mais quand ? · L'info qui ne vous fait pas attendre";
function route(){
  renderCats();
  const k=cleRoute(), titre=t=>{document.title=t?t+" · Mais quand ?":TITRE_SITE};
  if(k==="#dates"){ titre("Les dates à retenir"); return renderDates(); }
  if(k==="#regles"){ titre("Nos règles"); return renderRegles(); }
  if(k==="#annoncer"){ titre("Annoncer chez nous"); return renderAnnoncer(); }
  if(k==="#vrai-faux"){ titre("Vrai ou faux ?"); return renderVF(); }
  if(k.startsWith("#vf-")){ const v=vfById(k.slice(1)); if(v){ titre(VERDICTS[v.verdict]+" : "+v.claim); return renderVFOne(v); } }
  if(k==="#corrections"){ titre("Corrections"); return renderCorrections(); }
  if(k.startsWith("#att-")){ const x=attById(k.slice(5)); if(x){ titre(x.q); return renderAtt(x); } }
  const a = ARTICLES.find(x=>"#"+x.id===k);
  titre(a&&a.titre); a ? renderArticle(a) : renderHome();
}
window.addEventListener("hashchange",route);
renderCats(); route();
</script>
</body>
</html>
