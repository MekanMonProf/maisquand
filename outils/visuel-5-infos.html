<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
body{margin:0;width:1200px;height:750px;background:#f3ecd9;font-family:'Bricolage Grotesque',system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;position:relative}
.cal{position:relative;width:980px;margin-top:40px}
.back{position:absolute;inset:18px -14px -14px 14px;background:#e4dcc3;border-radius:34px}
.page{position:relative;background:#fffdf6;border-radius:34px;box-shadow:0 18px 40px rgba(11,58,42,.18);overflow:hidden}
.top{background:#0f4a35;padding:110px 60px 56px;text-align:center}
.top h1{margin:0;color:#f7f1e1;font-size:92px;font-weight:800;line-height:1}
.top h1 em{font-style:normal;color:#f0b84f}
.days{display:flex;justify-content:space-between;padding:40px 60px 46px}
.d{width:104px;height:104px;border-radius:50%;background:#0f4a35;color:#f7f1e1;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:26px}
.d.on{background:#f0b84f;color:#0b3a2a}
.rings{position:absolute;top:-62px;left:0;right:0;display:flex;justify-content:center;gap:120px;z-index:2}
.ring{width:96px;height:150px;border:16px solid #0b3a2a;border-radius:48px;box-sizing:border-box;position:relative}
.ring::after{content:"";position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#e4dcc3;box-shadow:inset 0 4px 6px rgba(0,0,0,.25)}
.logo{position:absolute;right:50px;bottom:22px;font-size:30px;font-weight:800;color:#0f4a35}.logo em{font-style:normal;color:#d9a23a}
</style></head><body>
<div class="cal"><div class="back"></div>
<div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
<div class="page"><div class="top"><h1>Les infos de la semaine</h1></div>
<div class="days"><div class="d on">Dim.</div><div class="d">Lun.</div><div class="d">Mar.</div><div class="d">Mer.</div><div class="d">Jeu.</div><div class="d">Ven.</div><div class="d">Sam.</div></div></div></div>
<div class="logo">Mais quand <em>?</em></div>
</body></html>
