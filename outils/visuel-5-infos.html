<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap');
body{margin:0;width:1200px;height:750px;background:#0f4a35;color:#f7f1e1;font-family:'Bricolage Grotesque',system-ui,sans-serif;display:grid;grid-template-columns:1fr 430px;overflow:hidden}
.g{padding:72px 64px;display:grid;align-content:space-between}
.k{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#d9b45a}
h1{font-size:96px;line-height:.98;margin:22px 0 0;font-weight:800}
h1 em{font-style:normal;color:#f0b84f}
p{font-size:30px;font-weight:600;color:#cfe3d6;margin:22px 0 0;max-width:15em}
.l{font-size:32px;font-weight:800}.l em{font-style:normal;color:#f0b84f}
ol{list-style:none;margin:0;padding:64px 64px 64px 0;display:grid;gap:20px;align-content:center;counter-reset:n}
li{counter-increment:n;display:grid;grid-template-columns:84px 1fr;gap:20px;align-items:center}
li::before{content:counter(n);width:84px;height:84px;border-radius:50%;background:#f0b84f;color:#0b3a2a;display:grid;place-items:center;font-size:46px;font-weight:800}
li span{height:16px;border-radius:8px;background:#2f6e52}
li:nth-child(2) span{width:80%}li:nth-child(3) span{width:92%}li:nth-child(4) span{width:70%}li:nth-child(5) span{width:86%}
</style></head><body>
<div class="g"><div><div class="k">Chaque dimanche</div><h1>La semaine<br>en <em>5</em> infos</h1><p>L'essentiel de l'actualité du Sénégal, vérifié et expliqué.</p></div><div class="l">Mais quand <em>?</em></div></div>
<ol><li><span></span></li><li><span></span></li><li><span></span></li><li><span></span></li><li><span></span></li></ol>
</body></html>
