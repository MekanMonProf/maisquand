<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap');
body{margin:0;width:1200px;height:750px;background:#0f4a35;color:#f7f1e1;font-family:'Bricolage Grotesque',system-ui,sans-serif;display:grid;grid-template-columns:470px 1fr;overflow:hidden}
.g{padding:64px 56px;display:grid;align-content:space-between;background:#0b3a2a}
.k{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#d9b45a}
h1{font-size:78px;line-height:1.02;margin:18px 0 0;font-weight:800}h1 em{font-style:normal;color:#f0b84f}
.l{font-size:30px;font-weight:800}.l em{font-style:normal;color:#f0b84f}
ul{list-style:none;margin:0;padding:56px;display:grid;gap:30px;align-content:center}
li{display:grid;grid-template-columns:150px 1fr;gap:26px;align-items:center}
.d{border:2px solid #d9b45a;border-radius:16px;text-align:center;padding:12px 0}
.d b{display:block;font-size:48px;line-height:1;color:#f0b84f}.d small{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
li p{margin:0;font-size:34px;line-height:1.15;font-weight:800}li p span{display:block;font-size:22px;font-weight:600;color:#cfe3d6;margin-top:6px}
.prix{border-top:2px solid #2f6e52;padding-top:26px}
.prix .d{border-style:dashed}
</style></head><body>
<div class="g"><div><div class="k">Campagne agricole 2026-2027</div><h1>Quand vendre sa <em>récolte</em> ?</h1></div><div class="l">Mais quand <em>?</em></div></div>
<ul>
<li><div class="d"><b>15</b><small>nov.</small></div><p>Coton<span>Ouverture de la commercialisation</span></p></li>
<li><div class="d"><b>Fin</b><small>nov.</small></div><p>Arachide<span>Ouverture de la campagne, jour exact à préciser</span></p></li>
<li class="prix"><div class="d"><b>?</b><small>à venir</small></div><p>Prix de l'arachide<span>Pas encore fixé : attendez l'annonce officielle</span></p></li>
</ul></body></html>
